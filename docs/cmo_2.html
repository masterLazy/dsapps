    const SFX = (() => {
      let ctx = null, master = null, noiseBuf = null, ambMaster = null;
      /* 背景音与音效分两路：玩家各调各的，互不牵连 */
      const AMB_MAX = 0.088;                 // 背景音 100% 时的目标增益
      let ambVol = 0.55, sfxVol = 1;
      try {
        const av = parseFloat(localStorage.getItem('cmo_amb_vol'));
        if (isFinite(av)) ambVol = Math.max(0, Math.min(1, av));
        const sv = parseFloat(localStorage.getItem('cmo_sfx_vol'));
        if (isFinite(sv)) sfxVol = Math.max(0, Math.min(1, sv));
      } catch (e) { }
      function persistVol() {
        try {
          localStorage.setItem('cmo_amb_vol', String(ambVol));
          localStorage.setItem('cmo_sfx_vol', String(sfxVol));
        } catch (e) { }
      }
      function ensure() {
        if (ctx) return ctx;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -9;
        comp.knee.value = 16;
        comp.ratio.value = 4;
        comp.attack.value = 0.004;
        comp.release.value = 0.22;
        comp.connect(ctx.destination);
        master = ctx.createGain();
        master.gain.value = 0.92 * sfxVol;
        master.connect(comp);
        ambMaster = ctx.createGain();
        ambMaster.gain.value = 1;
        ambMaster.connect(comp);
        const len = Math.floor(ctx.sampleRate * 0.4);
        noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        return ctx;
      }
      function resume() {
        const c = ensure();
        if (c && c.state === 'suspended') c.resume();
      }
      function noise(dur, freq, q, vol, type) {
        const c = ensure(); if (!c || !soundOn) return;
        const src = c.createBufferSource(); src.buffer = noiseBuf;
        const bp = c.createBiquadFilter();
        bp.type = type || 'bandpass'; bp.frequency.value = freq; bp.Q.value = q || 1.2;
        const g = c.createGain();
        const t = c.currentTime;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.004);
        g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
        src.connect(bp); bp.connect(g); g.connect(master);
        src.start(t); src.stop(t + dur + 0.02);
      }
      function tone(freq, dur, vol, type) {
        const c = ensure(); if (!c || !soundOn) return;
        const o = c.createOscillator(); o.type = type || 'triangle';
        const g = c.createGain(); const t = c.currentTime;
        o.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0006, t + dur);
        o.connect(g); g.connect(master);
        o.start(t); o.stop(t + dur + 0.02);
      }
      /* ---------- 背景：合成棕色噪声 ---------- */
      let amb = null, ambBuf = null;

      function brownBuf() {
        const c = ensure();
        if (ambBuf) return ambBuf;
        const len = Math.floor(c.sampleRate * 5);
        const buf = c.createBuffer(1, len, c.sampleRate);
        const d = buf.getChannelData(0);
        let last = 0;
        for (let i = 0; i < len; i++) {
          const w = Math.random() * 2 - 1;
          last = (last + 0.02 * w) / 1.02;   // 低频更重的积分白噪
          d[i] = last * 3.4;
        }
        /* 首尾交叉淡化：循环接缝不咔哒 */
        const fade = Math.floor(c.sampleRate * 0.09);
        for (let i = 0; i < fade; i++) {
          const t = i / fade;
          d[i] = d[i] * t + d[len - fade + i] * (1 - t);
        }
        ambBuf = buf;
        return buf;
      }

      /* 开/关背景噪声，靠增益淡入淡出，不硬切 */
      function ambience(on) {
        const c = ensure();
        if (!c) return;
        if (on && !amb) {
          if (c.state === 'suspended') c.resume();
          const src = c.createBufferSource();
          src.buffer = brownBuf();
          src.loop = true;
          const hp = c.createBiquadFilter();
          hp.type = 'highpass'; hp.frequency.value = 32;
          const lp = c.createBiquadFilter();
          lp.type = 'lowpass'; lp.frequency.value = 480; lp.Q.value = .35;
          const g = c.createGain();
          g.gain.value = 0;
          src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(ambMaster);
          src.start();
          g.gain.setTargetAtTime(AMB_MAX * ambVol, c.currentTime, 1.6);
          amb = { src, g };
        } else if (!on && amb) {
          const { src, g } = amb;
          amb = null;
          g.gain.setTargetAtTime(0, c.currentTime, .45);
          setTimeout(() => { try { src.stop(); } catch (e) { } }, 2000);
        }
      }

      /* 背景音音量：0..1，开了就平滑跟随，没开只记值 */
      function setAmbVol(v) {
        ambVol = Math.max(0, Math.min(1, v));
        persistVol();
        if (amb && ctx) amb.g.gain.setTargetAtTime(AMB_MAX * ambVol, ctx.currentTime, .2);
      }

      /* 音效音量：直接压 master，背景音走另一路，不受影响 */
      function setSfxVol(v) {
        sfxVol = Math.max(0, Math.min(1, v));
        persistVol();
        if (master && ctx) master.gain.setTargetAtTime(0.92 * sfxVol, ctx.currentTime, .2);
      }

      return {
        resume,
        ambience,
        setAmbVol,
        setSfxVol,
        vol() { return { amb: ambVol, sfx: sfxVol }; },
        type() { // 机械打字：短促摩擦 + 金属锤击（压低两档，更像老式打字机）
          noise(0.055, 1420 + Math.random() * 680, 1.6, 0.075);
          tone(92 + Math.random() * 42, 0.062, 0.085, 'square');
        },
        tick() { noise(0.035, 2600, 2.2, 0.08); tone(620, 0.045, 0.055, 'triangle'); },
        deal() { noise(0.18, 900, 0.8, 0.085, 'lowpass'); tone(320, 0.09, 0.03, 'sine'); },
        play() {
          noise(0.32, 420, 0.7, 0.15, 'lowpass');
          tone(220, 0.2, 0.1, 'sine');
          setTimeout(() => tone(660, 0.26, 0.075, 'sine'), 90);
        },
        good() { tone(523, 0.5, 0.085, 'sine'); setTimeout(() => tone(784, 0.6, 0.07, 'sine'), 90); },
        bad() { tone(158, 0.55, 0.1, 'sawtooth'); },
        win() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.8, 0.08, 'sine'), i * 110)); },
        /* 上课钟：Westminster 前四音 + 钟体泛音，外部音频缺失时兜底 */
        bell() {
          const c = ensure(); if (!c || !soundOn) return;
          if (c.state === 'suspended') c.resume();
          const t0 = c.currentTime + 0.04;
          const PART = [[1, .105, 2.0], [2.01, .048, 1.45], [3.02, .026, 1.05], [4.18, .014, .8], [5.43, .008, .58]];
          [659.25, 523.25, 587.33, 392.00].forEach((f, i) => {
            const at = t0 + i * 0.42;
            PART.forEach(([mul, vol, dur]) => {
              const o = c.createOscillator(); o.type = 'sine';
              const g = c.createGain();
              o.frequency.setValueAtTime(f * mul * (1 + (Math.random() - .5) * 0.0009), at);
              g.gain.setValueAtTime(0, at);
              g.gain.linearRampToValueAtTime(vol, at + 0.012);
              g.gain.exponentialRampToValueAtTime(0.0004, at + dur);
              o.connect(g); g.connect(master);
              o.start(at); o.stop(at + dur + 0.05);
            });
          });
        }
      };
    })();

    /* ==================================================================
       3.5 外部音效：与 html 同级的 sound/ 目录
       —— 缺文件、格式不支持、自动播放被拦，一律静默，不影响游戏
    ================================================================== */
    const EXT_SFX = (() => {
      const SRC = {
        chime: 'sound/Sfx_Scenario_057 School chime.ogg',   // 学期开始：上课钟
        paper: 'sound/Sfx_Scenario_066 Touch paper.ogg',    // 月份结束：翻纸

        noise: 'sound/Sfx_Scenario_074 Noise.ogg'           // 对话：随机环境碎响
      };
      const VOL = { chime: 0.4, paper: 0.36, tea: 0.66, noise: 0.44 };
      const pool = {};

      function make(k) {
        try {
          const a = new Audio(encodeURI(SRC[k]));
          a.preload = 'auto';
          a.volume = VOL[k];
          /* 文件不在，就永久降级为静音，不再重试 */
          a.addEventListener('error', () => { pool[k] = null; });
          return a;
        } catch (e) {
          return null;
        }
      }

      function play(k, opt) {
        if (!soundOn || !(k in SRC)) return;
        opt = opt || {};
        if (opt.chance && Math.random() > opt.chance) return;
        if (!(k in pool)) pool[k] = make(k);
        const a = pool[k];
        if (!a) {
          /* 文件不在：上课钟用合成钟声兜底，其余静音 */
          if (k === 'chime') SFX.bell();
          return;
        }
        try {
          /* 每次微调音量与音高，重复播放时不至于像复读机 */
          const v = VOL[k] * (opt.vol || 1) * (0.88 + Math.random() * 0.24);
          a.volume = Math.max(0, Math.min(1, v));
          a.playbackRate = opt.rate || 1;
          a.currentTime = 0;
          const pr = a.play();
          if (pr && pr.catch) pr.catch(() => { });
        } catch (e) { /* 忽略：文件缺失或尚未解锁播放 */ }
      }

      /* 预热：进游戏前就开始缓冲，免得第一声迟到 */
      Object.keys(SRC).forEach(k => { pool[k] = make(k); });

      return { play };
    })();

      <path d="M44 55 Q60 61 76 55" stroke="#a3834a" stroke-width=".45" fill="none" opacity=".3"/>
      <path d="M60 19 L60 30" stroke="#3d2e17" stroke-width=".5" opacity=".4"/>
      <circle cx="60" cy="60" r="55.5" fill="none" stroke="#8a6a33" stroke-width=".8" opacity=".8"/>
      <circle cx="60" cy="60" r="51" fill="none" stroke="#3d2e17" stroke-width=".5" opacity=".7"/>
    `;
    }

    const fx = n => Math.round(n * 100) / 100;

    /* ---- 五维星盘：能力 + 下一关门槛 ---- */
    const RADAR = { cx: 160, cy: 152, R: 104, cur: ATTRS.map(() => 0), raf: 0 };

    function rAngle(i) { return -Math.PI / 2 + i * Math.PI * 2 / ATTRS.length; }

    function rPt(i, v, k) {
      const a = rAngle(i);
      const r = RADAR.R * Math.min(1, Math.max(0, v / 10)) * (k || 1);
      return [RADAR.cx + Math.cos(a) * r, RADAR.cy + Math.sin(a) * r];
    }

    function rPoly(vals) {
      return ATTRS.map((_, i) => rPt(i, vals[i]).map(n => n.toFixed(1)).join(',')).join(' ');
    }

    function buildRadar() {
      const cx = RADAR.cx, cy = RADAR.cy, R = RADAR.R;
      let grid = '';
      [2, 4, 6, 8, 10].forEach((lv, gi) => {
        const pts = ATTRS.map((_, i) => rPt(i, lv).map(n => n.toFixed(1)).join(',')).join(' ');
        grid += `<polygon class="r-ring${gi === 4 ? '' : ' mid'}" points="${pts}"/>`;
      });
      ATTRS.forEach((_, i) => {
        const [x, y] = rPt(i, 10);
        grid += `<line class="r-spoke" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
        grid += `<line class="r-tick" x1="${(x + (x - cx) * .04).toFixed(1)}" y1="${(y + (y - cy) * .04).toFixed(1)}" x2="${(x + (x - cx) * .1).toFixed(1)}" y2="${(y + (y - cy) * .1).toFixed(1)}"/>`;
      });
      const labs = ATTRS.map((k, i) => {
        const a = rAngle(i);
        const x = cx + Math.cos(a) * (R + 27);
        const y = cy + Math.sin(a) * (R + 20) + 5;
        const anch = Math.abs(Math.cos(a)) < .2 ? 'middle' : (Math.cos(a) > 0 ? 'start' : 'end');
        return `<g class="r-lab" data-rl="${k}">
          <text class="r-name" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anch}">${ATTR_NAME[k]}</text>
          <text class="r-val" x="${x.toFixed(1)}" y="${(y + 15).toFixed(1)}" text-anchor="${anch}">Lv.0</text>
        </g>`;
      }).join('');
      return `<svg class="radar" viewBox="0 0 320 300">
        ${grid}
        <polygon class="r-req" points="${rPoly(ATTRS.map(() => 0))}"/>
        <g class="r-gaps"></g>
        <polygon class="r-poly" points="${rPoly(ATTRS.map(() => 0))}"/>
        <g class="r-dots">${ATTRS.map((_, i) => `<circle class="r-dot" cx="${cx}" cy="${cy}" r="2.6"/>`).join('')}</g>
        ${labs}
      </svg>`;
    }

    /* 下一关各科门槛；没有比赛就没有门槛 */
    function radarReq() {
      const c = nextComp();
      return c ? ATTRS.map(k => c.req[k] || 0) : null;
    }

    function paintRadar(vals, req) {
      const svg = document.querySelector('#ui-attrs .radar');
      if (!svg) return;
      svg.querySelector('.r-poly').setAttribute('points', rPoly(vals));
      const dots = svg.querySelectorAll('.r-dot');
      ATTRS.forEach((_, i) => {
        const p = rPt(i, vals[i]);
        dots[i].setAttribute('cx', p[0].toFixed(1));
        dots[i].setAttribute('cy', p[1].toFixed(1));
      });
      const reqPoly = svg.querySelector('.r-req');
      const hasReq = !!(req && req.some(v => v > 0));
      reqPoly.style.opacity = hasReq ? '1' : '0';
      if (hasReq) reqPoly.setAttribute('points', rPoly(ATTRS.map((k, i) => req[i] || vals[i])));
      svg.querySelector('.r-gaps').innerHTML = !req ? '' : ATTRS.map((k, i) => {
        const need = req[i];
        if (!need || vals[i] >= need * 0.85) return '';
        const a = rPt(i, vals[i]), b = rPt(i, need);
        return `<line class="r-gap" x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}"/>`;
      }).join('');
      ATTRS.forEach((k, i) => {
        const g = svg.querySelector(`[data-rl="${k}"]`);
        if (!g) return;
        g.querySelector('.r-val').textContent = 'Lv.' + Math.min(10, Math.floor(vals[i] + 1e-6));
        const bad = req && req[i] > 0 && vals[i] < req[i] * 0.85;
        g.classList.toggle('bad', !!bad);
      });
    }

    function updateRadar(animate) {
      const target = ATTRS.map(k => G.attrs[k]);
      const req = radarReq();
      cancelAnimationFrame(RADAR.raf);
      if (!animate) {
        RADAR.cur = target.slice();
        paintRadar(RADAR.cur, req);
        return;
      }
      const from = RADAR.cur.slice();
      const t0 = performance.now();
      const step = now => {
        const p = Math.min(1, (now - t0) / 620);
        const e = 1 - Math.pow(1 - p, 3);
        RADAR.cur = from.map((v, i) => v + (target[i] - v) * e);
        paintRadar(RADAR.cur, req);
        if (p < 1) RADAR.raf = requestAnimationFrame(step);
      };
      RADAR.raf = requestAnimationFrame(step);
    }

    function renderBoard(animate = true) {
      const phase = ['基础阶段', '发展阶段', '冲刺阶段', '巅峰阶段'][Math.min(G.year, 4) - 1] || '巅峰阶段';
      const cn = ['一', '二', '三', '四'][Math.min(G.year, 4) - 1];
      const mn = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二'][G.month - 1];
      $('#ui-time').innerHTML = `第${cn}年 · ${mn}月<em>${phase}</em>`;
      $('#ui-phase').textContent = ['入门弟子', '可造之材', '省队苗子', '国手之姿'][Math.min(G.year, 4) - 1];


      $('#ui-vitals').innerHTML = VITALS.map(v => {
        const val = G[v.k];
        const segs = Array.from({ length: 10 }, (_, i) => `<i class="v-seg${i < Math.round(val) ? ' on' : ''}"></i>`).join('');
        return `<div class="vital" data-vk="${v.k}" style="--c:${v.c}">
          <div class="v-ico"><span>${v.g || '◆'}</span></div>
          <div class="v-body">
            <div class="v-top"><span class="v-name">${v.n}</span><span class="v-num">${val.toFixed(1)}</span></div>
            <div class="v-track">${segs}</div>
          </div>
        </div>`;
      }).join('');

      /* 低档皮肤：健康虚弱 / 师生疏离，条子自己会说话 */
      const hpT = hpTierOf(), relT = relTierOf();
      Array.from($('#ui-vitals').children).forEach(el => {
        const k = el.dataset.vk;
        el.classList.toggle('low', (k === 'hp' && hpT === 'weak') || (k === 'rel' && (relT === 'distant' || relT === 'red')));
        el.classList.toggle('crit', k === 'rel' && relT === 'red');
      });
      watchTiers();

      const p = profile();
      const tal = $('#ui-talent');
      if (tal) {
        tal.innerHTML = `<span class="t-chip up">${p.n}</span>`
          + `<span class="t-chip ${p.up ? 'down' : ''}">${p.desc}</span>`;
      }

      const sk = $('#ui-skills');
      if (sk) {
        sk.innerHTML = SKILLS.map(x => {
          const used = !!G.skills[x.id];
          const buff = x.id === 'plan' && G.planBuff > 0;
          return `<button class="sk-chip${used ? ' used' : ''}${buff ? ' buff' : ''}" data-sk="${x.id}"
            title="${x.d}${used ? '（本学年已用）' : ''}" ${used ? 'disabled' : ''}><i>${x.ico}</i>${x.n}</button>`;
        }).join('');
      }
      const pasEl = $('#ui-pas');
      if (pasEl) {
        const list = ATTRS.filter(k => (G.pas[k] || 0) > 0.001)
          .map(k => `${ATTR_NAME[k]}+${Math.round(G.pas[k] * 100)}%`);
        pasEl.textContent = list.length ? `教法 · ${list.join(' · ')}` : '';
      }

      const box = $('#ui-attrs');
      if (!box.dataset.built) {
        box.innerHTML = buildRadar();
        box.dataset.built = '1';
      }
      updateRadar(animate);

      renderMatch();
      renderDeckMeta();
    }

    /* 跨档位：只提示一次，不常驻 */
    function watchTiers() {
      const hpT = hpTierOf(), relT = relTierOf();
      const msgs = [];
      if (G.hpTier && G.hpTier !== hpT) {
        if (hpT === 'weak') msgs.push('他咳了两声，休息也补不回来了');
        else if (hpT === 'good') msgs.push('他缓过来了，脸色好看了些');
      }
      if (G.relTier && G.relTier !== relT) {
        if (relT === 'red') msgs.push('他不再主动开口了');
        else if (relT === 'distant') msgs.push('他把门带上了，师生降到疏离');
        else if (relT === 'close') msgs.push('他愿意把心里话讲给你听了');
      }
      G.hpTier = hpT;
      G.relTier = relT;
      /* 一次跨两档时排着说，不互相盖掉 */
      msgs.forEach((m, i) => i ? setTimeout(() => toast(m), i * 2100) : toast(m));
    }

    function occurOf(c) {
      const s0 = G.sched[c.id] || { y: c.y, mo: c.mo };
      let y = s0.y, mo = s0.mo;
      while (y < G.year || (y === G.year && mo < G.month)) y++;
      return { y, mo };
    }

    function nextComp() {
      const c = COMPS[G.pass];
      if (!c) return null;
      const o = occurOf(c);
      if (o.y > 4) return null;
      return Object.assign({}, c, { y: o.y, mo: o.mo });
    }

    function compThisMonth() {
      const c = nextComp();
      return c && c.y === G.year && c.mo === G.month ? c : null;
    }

    function compGap(c) { return (c.y - G.year) * 12 + (c.mo - G.month); }

    /* 最后一个还能开赛的月份：第 4 年 11 月 */
    const DEADLINE = 4 * 12 + 11;

    function canStillComp() {
      const c = COMPS[G.pass];
      if (!c) return false;
      const o = occurOf(c);
      return o.y * 12 + o.mo <= DEADLINE;
    }

    /* 硬门槛 + 软判定：
       · 硬：任一科低于需求的 85% 即「未达标」，每差一项胜算 ×0.55
       · 软：加权达标度 + 状态乘数 + 战术分析 + 随机（仅开赛时掷） */
    function compEval(c, roll) {
      const keys = Object.keys(c.req);
      let sum = 0, wsum = 0, hard = 1;
      const missing = [];
      keys.forEach(k => {
        const w = (c.focus || []).indexOf(k) >= 0 ? 1.5 : 1;
        const r = G.attrs[k] / c.req[k];
        if (G.attrs[k] < c.req[k] * 0.85) {
          hard *= 0.55;
          missing.push({ k, gap: c.req[k] * 0.85 - G.attrs[k] });
        }
        sum += clamp(r, 0.05, 1.35) * w;
        wsum += w;
      });
      const ratio = sum / wsum;
      let soft = (ratio - 1) * 1.15 + (stateMul() - 0.86) * 1.4 + (G.planBuff || 0) + relSoft();
      if (G.review) soft += 0.12;
      if (roll) soft += Math.random() * 0.2 - 0.1;
      const ch = clamp((0.56 + soft * 0.62) * hard, 0.04, 0.95);
      return { ch, ratio, missing, hard };
    }

    function chanceOf(c, roll) { return compEval(c, !!roll).ch; }

    function tierOf(ch) {
      if (ch >= .70) return { k: '稳', c: '#9ac48f', v: .84 };
      if (ch >= .40) return { k: '有希望', c: '#e3bd76', v: .56 };
      return { k: '悬', c: '#c0675a', v: .22 };
    }

    /* 只给一句人话，不给倍率 */
    function statusLine() {
      if (G.cold > 0) return '冷战未解，他不太愿意开口。';
      const rt = relTierOf();
      if (rt === 'red') return '他一句话都不愿多说，临场会失手。';
      if (rt === 'distant') return '他问一句答一句，比赛容易走神。';
      if (hpTierOf() === 'weak') return '他有些撑不住了，恢复也慢。';
      if (G.will <= 3) return '心气不足，遇到难题容易退。';
      if (G.hp >= 8 && G.will >= 8) return '精力充沛，利于发挥。';
      if (G.will >= 7 && G.hp >= 6) return '状态平稳，看临场发挥。';
      return '状态平平，别指望超常。';
    }

    function renderMatch() {
      const c = nextComp();
      const box = $('#ui-match');
      if (!c) {
        const left = COMPS.length - G.pass;
        box.innerHTML = `<div class="m-head"><span class="m-ico">✧</span>
          <div><div class="m-title">${left > 0 ? '赛 程 已 尽' : '所 有 赛 事 落 幕'}</div></div></div>
          <div class="m-reqs">${left > 0 ? '资格链已断，四年之内再无缘下一级赛场。' : '四年的光阴，都写在了那一摞草稿纸上。'}</div>`;
        return;
      }
      const ev = compEval(c, false);
      const t = tierOf(ev.ch);
      const gap = compGap(c);
      const shown = t.v;
      const ang = Math.PI - shown * Math.PI;
      const bx = fx(80 + Math.cos(ang) * 62);
      const by = fx(86 - Math.sin(ang) * 62);
      let ticks = '';
      for (let i = 0; i <= 10; i++) {
        const tt = Math.PI - (i / 10) * Math.PI;
        ticks += `<line class="d-tick" x1="${fx(80 + Math.cos(tt) * 55)}" y1="${fx(86 - Math.sin(tt) * 55)}" x2="${fx(80 + Math.cos(tt) * 59)}" y2="${fx(86 - Math.sin(tt) * 59)}"/>`;
      }
      const canReview = gap === 0 && G.mode === 'hand' && !G.review && !busy;
      const revLabel = G.review ? '✓ 本月已做考前复习' : (gap === 0 ? '考前复习 · 耗 1 格 / 1 精力' : '仅比赛当月可安排');
      const buff = G.planBuff > 0 ? `<div class="m-buff">◈ 战术分析已就位</div>` : '';
      const calm = ev.missing.length
        ? `<div class="m-calm">门槛见星盘 · 红线是缺口</div>`
        : `<div class="m-calm">${statusLine()}</div>`;
      box.innerHTML = `
        <div class="m-head">
          <span class="m-ico">◆</span>
          <div>
            <div class="m-title">${c.n}</div>
            <div class="m-when">${gap === 0 ? '本 月 月 末 开 赛' : gap + ' 个 月 后'} · 第 ${c.idx + 1} 关</div>
          </div>
        </div>
        <div class="dial" style="--gc:${t.c}">
          <svg viewBox="0 0 160 98">
            <path class="d-bg" d="M18 86 A62 62 0 0 1 142 86"/>
            <path class="d-arc" d="M18 86 A62 62 0 0 1 142 86" stroke-dasharray="195" stroke-dashoffset="${fx(195 * (1 - shown))}"/>
            ${ticks}
            <circle class="d-bead" cx="${bx}" cy="${by}" r="4.2" fill="#fff8e6" stroke="${t.c}" stroke-width="2" color="${t.c}"/>
            <text class="d-tier" x="80" y="79" text-anchor="middle" fill="${t.c}">${t.k}</text>
          </svg>
          <div class="dial-cap">胜 算 · 只 分 三 档</div>
        </div>
        ${calm}${buff}
        <button class="m-review${G.review ? ' on' : ''}" id="btn-review" ${canReview ? '' : 'disabled'}>${revLabel}</button>`;
    }

    /* ---------- 月历：8 格棋盘 ---------- */
    function calUsed() { return G.cal.reduce((a, seg) => a + seg.used, 0); }
    function calLeft() { return MONTH_UNITS - calUsed(); }

    function newCal() {
      return Array.from({ length: 4 }, () => ({ used: 0, items: [], cells: [null, null] }));
    }

    /* 连续分配：从第一个还有空位的格开始，依次向后占 */
    function allocUnits(n) {
      let start = -1;
      for (let i = 0; i < 4; i++) if (G.cal[i].used < SEG_UNITS) { start = i; break; }
      if (start < 0) return null;
      const out = [];
      let left = n;
      for (let i = start; i < 4 && left > 0; i++) {
        const free = SEG_UNITS - G.cal[i].used;
        if (free <= 0) continue;              // 已满的段直接跳过，别把整月判成「排不下」
        const take = Math.min(free, left);
        out.push({ i, take });
        left -= take;
      }
      return left === 0 ? out : null;
    }

    function firstFree() {
      for (let i = 0; i < 4; i++) if (G.cal[i].used < SEG_UNITS) return i;
      return -1;
    }

    /* 单元格短名：最多 3 字 */
    function shortLabel(t) {
      if (!t) return '';
      return String(t).split(' ＋ ').map(x => x.length > 3 ? x.slice(0, 3) : x).join('＋');
    }

    /* 选中预览：落点 / 精力 / 差额，一次算清 */
    function previewOf(cards) {
      const list = cards || [];
      const u = playUnits(list), e = playEnergy(list);
      const link = list.length === 2 ? 1 : 0;
      const plan = list.length ? allocUnits(u) : null;
      const cells = {};
      const left = calLeft();
      let n = 0;
      if (plan) {
        plan.forEach(sl => {
          const base = G.cal[sl.i].used;
          for (let k = 0; k < sl.take; k++) {
            cells[sl.i + '-' + (base + k)] = (link && n >= u - link) ? 'link' : 'ghost';
            n++;
          }
        });
      } else if (list.length) {
        for (let i = 0; i < 4; i++) {
          for (let k = G.cal[i].used; k < SEG_UNITS; k++) {
            if (n < left) { cells[i + '-' + k] = 'ghost'; n++; }
          }
        }
      }
      const short = Math.max(0, u - left);
      const lackE = Math.max(0, e - G.energy);
      return { u, e, link, cells, short, lackE, left, fit: !!plan, ok: !!plan && lackE === 0 };
    }

    /* 本月负荷目标：已出牌 + 当前选中牌的阶数均值 */
    function loadTarget(extra) {
      const arr = (G.monthLoad || []).slice();
      if (extra && extra.length) {
        arr.push(Math.max.apply(null, extra.map(c => c.m === 'rest' ? INTEN_W.rest : INTEN_W[c.tier])));
      }
      if (!arr.length) return 1;
      return clamp(arr.reduce((a, b) => a + b, 0) / arr.length, 1, 10);
    }

    function projInten(extra) {
      return clamp(G.intensity * 0.7 + loadTarget(extra) * 0.3, 1, 10);
    }

    function loadWord(t) { return t >= 7 ? '重' : t >= 4 ? '中' : '轻'; }

    function renderCalendar(pv) {
      const bar = $('#cal-bar');
      if (!bar) return;
      const cells = (pv && pv.cells) || {};
      const used = calUsed();
      const left = MONTH_UNITS - used;
      const short = !!(pv && !pv.fit);

      /* 8 个菱形点：已用填实，将占虚亮，联动变紫，排不下转红 */
      let dots = '';
      for (let i = 0; i < 4; i++) {
        for (let k = 0; k < SEG_UNITS; k++) {
          const on = k < G.cal[i].used;
          const st = cells[i + '-' + k] || '';
          const lab = on ? ((G.cal[i].cells && G.cal[i].cells[k]) || '') : '';
          let cls = on ? (lab === '校外' ? 'out' : 'on') : (st === 'link' ? 'link' : st ? 'ghost' : '');
          if (!on && !st && short) cls = 'bad';
          dots += `<i class="${cls}"${lab ? ` title="${esc(lab)}"` : ''}></i>`;
        }
      }

      /* 精力：文字化，选中时显示消耗箭头 */
      const spend = pv ? Math.min(pv.e, G.energy) : 0;
      const keep = G.energy - spend;
      const enTxt = pv
        ? `<b class="${pv.lackE ? 'bad' : ''}">${G.energy}</b><i>→</i><b class="${pv.lackE ? 'bad' : ''}">${keep}</b>`
        : `<b>${G.energy}</b><i>/${ENERGY_MAX}</i>`;

      /* 一句结论 */
      let note;
      if (!pv) {
        note = `<span class="tl-note">剩余 <b>${left}</b>/${MONTH_UNITS} 格</span>`;
      } else if (selected.length === 1 && selected[0].coach) {
        note = `<span class="tl-note"><span class="ok">教练亲授 · 不占时间</span></span>`;
      } else if (!pv.fit) {
        note = `<span class="tl-note"><span class="bad">差 ${pv.short} 格 · 排不下</span></span>`;
      } else if (pv.lackE > 0) {
        note = `<span class="tl-note"><span class="bad">精力还差 ${pv.lackE} 点</span></span>`;
      } else {
        note = `<span class="tl-note"><span class="ok">占 <b>${pv.u}</b> 格 · 耗 <b>${pv.e}</b> 精力 · 剩 <b>${pv.left - pv.u}</b> 格</span></span>`;
      }

      /* 负荷预警：只在选牌时露一句，不进常驻面板 */
      const proj = pv ? projInten(selected) : G.intensity;
      const warn = pv && proj >= 7 ? '<span class="tl-warn">⚠ 负荷偏重</span>' : '';

      bar.innerHTML = `<span class="tl-label">时 间</span>
        <div class="tl-dots">${dots}</div>
        ${note}
        <span class="tl-en"><em>⚡</em>精力 ${enTxt}</span>
        ${warn}`;
    }

    /* 剩余量 → 还能打什么 */
    function roomText(left, en) {
      if (left <= 0) return '时间已排满';
      const out = [];
      let l = left, n = 0;
      [[8, '整月'], [4, '一周'], [2, '整日'], [1, '半日']].forEach(([sz, nm]) => {
        let c = 0;
        while (l >= sz && n < 3) { l -= sz; n++; c++; }
        if (c) out.push(`${nm}×${c}`);
      });
      if (!out.length) return '排不下';
      let txt = out.join(' ＋ ');
      if (en < n) txt += `（精力只够 ${en} 张）`;
      return txt;
    }

    function renderDeckMeta() {
      if (G.mode !== 'hand') return;
      renderCalendar(selected.length ? previewOf(selected) : null);
    }

    /* ==================================================================
       5. 手牌：扇形布局（JS 只写 CSS 变量，悬停只动内层）
    ================================================================== */
    const handEl = $('#hand');

    function drawCard() {
      if (!deck.length) {
        if (!discard.length) return null;
        deck = discard.splice(0).sort(() => Math.random() - 0.5);
      }
      return deck.pop();
    }

    function hasPre(card) {
      if (!card.pre || !card.pre.length) return true;
      return card.pre.every(id => (G.mastery[id] || 0) >= 1);
    }

    function isLocked(card) {
      return card.tier >= 3 && (G.rel < 5 || G.cold > 0);
    }

    function playUnits(cards) {
      let u = 0;
      cards.forEach(c => { if (!c.coach) u += DUR[c.dur].u; });
      if (cards.length === 2) u += 1;
      return u;
    }

    function playEnergy(cards) {
      let e = 0;
      cards.forEach(c => { if (!c.coach) e += (c.cost || 0); });
      if (cards.length === 2) e += 1;
      return e;
    }

    function cardEl(card) {
      /* 教练亲授：深底浅字，独立版式 */
      if (card.coach) {
        const wrap = document.createElement('div');
        wrap.className = 'card-wrap coach-card';
        wrap.dataset.id = card.id;
        wrap.innerHTML = `
          <div class="card card-coach" style="--mc:#c9a86a">
            <div class="card-face">
              <div class="c-top">
                <span class="c-mod"><i>✎</i>教练</span>
                <span class="c-badges"><i>不占时</i></span>
              </div>
              <div class="c-title">${esc(card.t)}</div>
              <div class="c-flavor">${esc(card.b)}</div>
              <div class="c-bot">
                <span class="c-kind">本月一次</span>
                <span class="c-ar">→</span>
              </div>
            </div>
          </div>`;
        wrap.addEventListener('click', e => {
          e.stopPropagation();
          toggleSelect(card);
        });
        return wrap;
      }

      const m = MODS[card.m];
      const mast = G.mastery[card.id] || 0;
      const locked = isLocked(card);
      const preOk = hasPre(card);
      const wrap = document.createElement('div');
      wrap.className = 'card-wrap' + (locked ? ' locked' : '');
      wrap.dataset.id = card.id;
      const note = locked ? '师生不足' : (preOk ? '' : '前置未通');
      const dots = [0, 1, 2].map(i => `<i class="${i < mast ? 'on' : ''}"></i>`).join('');
      wrap.innerHTML = `
        <div class="card" style="--mc:${m.c}">
          <div class="card-face">
            <div class="c-sigil">${m.g}</div>
            <div class="c-top">
              <span class="c-mod"><i>${m.g}</i>${m.n}</span>
              <span class="c-badges"><i>🕒${DUR[card.dur].u}</i><i class="${card.en ? 'plus' : ''}">⚡${card.cost || 0}</i></span>
            </div>
            <div class="c-title">${esc(card.t)}</div>
            <div class="c-flavor">${esc(card.f)}</div>
            <div class="c-bot">
              <span class="c-kind ${card.kind}">${KIND[card.kind]}</span>
              ${note ? `<span class="c-pre">${note}</span>` : `<span class="c-mast">${dots}</span>`}
              <span class="c-ar ${card.ar === '↑↑' ? 'up2' : ''}">${card.ar}</span>
            </div>
          </div>
          <div class="c-nofit"></div>
        </div>`;
      wrap.addEventListener('click', e => {
        e.stopPropagation();
        toggleSelect(card);
      });
      return wrap;
    }

    /* 扇形排布：以手下方一点为圆心，牌面向外张开 */
    function fanGeometry(n) {
      const W = Math.max(360, handEl.clientWidth || window.innerWidth);
      const cw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cw')) || 164;
      const usable = Math.min(W * 0.9, 1280);
      const spread = selected.length ? 1.1 : 1;
      const spacing = n > 1 ? Math.min(cw * 0.84 * spread, usable / (n - 1)) : 0;
      // 总张角随牌数增长，单张最多 9°，整体不超过 40°
      const step = n > 1 ? clamp(40 / (n - 1), 4.5, 9) : 0;
      return Array.from({ length: n }, (_, i) => {
        const t = i - (n - 1) / 2;
        const rot = t * step;
        const x = t * spacing;
        // 绕牌底中点旋转，外侧牌自然下沉成弧；整体再抬 8px，给底角留出余量
        const y = -8;
        return { x, y, rot };
      });
    }

    function layoutHand() {
      const wraps = Array.from(handEl.children);
      if (!wraps.length) return;
      const geo = fanGeometry(wraps.length);
      wraps.forEach((w, i) => {
        const g = geo[i];
        const sel = w.classList.contains('sel');
        const rad = g.rot * Math.PI / 180;
        const push = sel ? 26 : 0;
        w.style.setProperty('--tx', `${g.x + Math.sin(rad) * push}px`);
        w.style.setProperty('--ty', `${g.y - Math.cos(rad) * push}px`);
        w.style.setProperty('--rot', `${g.rot}deg`);
        w.style.setProperty('--z', sel ? 130 : 10 + i);
      });
    }

    function toggleSelect(card) {
      if (G.mode !== 'hand' || busy) return;
      if (TUT.lock === 'all' || TUT.lock === 'end') return;
      const wrap = handEl.querySelector(`.card-wrap[data-id="${card.id}"]`);
      if (!wrap) return;

      const idx = selected.indexOf(card);
      if (idx >= 0) {
        selected.splice(idx, 1);
        wrap.classList.remove('sel');
        SFX.tick();
      } else {
        if (isLocked(card)) {
          toast('这张精研卷，他现在的师生关系还压不住');
          SFX.bad();
          return;
        }
        // 教练牌只能单独打；选了普通牌则把教练牌放回
        if (card.coach) {
          selected.forEach(c => {
            const w = handEl.querySelector(`.card-wrap[data-id="${c.id}"]`);
            if (w) w.classList.remove('sel');
          });
          selected.length = 0;
        } else if (selected.some(c => c.coach)) {
          selected.length = 0;
          handEl.querySelectorAll('.card-wrap').forEach(w => w.classList.remove('sel'));
        }
        if (selected.length >= 2) {
          const first = selected.shift();
          const fw = handEl.querySelector(`.card-wrap[data-id="${first.id}"]`);
          if (fw) fw.classList.remove('sel');
        }
        selected.push(card);
        wrap.classList.add('sel');
        SFX.tick();
      }
      const pv = previewOf(selected);
      handEl.querySelectorAll('.card-wrap').forEach(w => {
        const isSel = w.classList.contains('sel');
        w.classList.toggle('dim', selected.length >= 2 && !isSel);
        const bad = isSel && selected.length > 0 && (!pv.fit || pv.lackE > 0);
        w.classList.toggle('nofit', bad);
        const tip = w.querySelector('.c-nofit');
        if (tip) tip.textContent = !pv.fit ? '排 不 下' : '精 力 不 足';
      });
      layoutHand();
      renderCalendar(selected.length ? pv : null);
      syncButtons();
      fire('select');
    }

    function syncButtons() {
      const play = $('#btn-play'), end = $('#btn-end');
      const L = TUT.lock;
      const canHand = L === 'none' || L === 'select' || L === 'play';
      const canPlay = L === 'none' || L === 'play';
      const canEnd = L === 'none' || L === 'end';
      const ok = G.mode === 'hand' && selected.length > 0 && !busy && canHand && canPlay;
      let reason = '';
      let pv = null;
      if (ok) {
        pv = previewOf(selected);
        if (!pv.fit) reason = `要吃 ${pv.u} 格，本月只剩 ${pv.left} 格（差 ${pv.short} 格）`;
        else if (pv.lackE > 0) reason = `精力不够：还差 ${pv.lackE} 点`;
      }
      play.disabled = !ok || !!reason;
      play.textContent = selected.length === 2 ? '联 动 打 出' : '打 出';
      end.disabled = !(G.mode === 'hand' && !busy && canEnd);
      end.textContent = calLeft() > 0 ? '提前结束本月' : '结 束 本 月';
    }

    /* ==================================================================
       6. 事件门（教学等待）
    ================================================================== */
    const gates = {}, fired = {};
    function waitFor(name) {
      if (fired[name] && Date.now() - fired[name] < 4000) {
        fired[name] = 0;
        return Promise.resolve();
      }
      return new Promise(res => { (gates[name] = gates[name] || []).push(res); });
    }
    function fire(name, data) {
      const list = gates[name] || [];
      gates[name] = [];
      if (!list.length) fired[name] = Date.now();
      list.forEach(fn => fn(data));
    }

    /* ==================================================================
       7. 特效：飘字 / 飞牌
    ================================================================== */
    function burst() {
      const b = document.createElement('div');
      b.className = 'burst';
      $('#fx').appendChild(b);
      setTimeout(() => b.remove(), 950);
    }

    let token = 0;
    function floatResult(lines) {
      const box = $('#float');
      const my = ++token;
      const board = $('#board');
      box.classList.toggle('up', $('#coach').classList.contains('on'));
      box.classList.remove('out');
      box.innerHTML = '';
      lines.forEach((l, i) => {
        const d = document.createElement('div');
        d.className = l.cls;
        d.style.animationDelay = `${i * 95}ms`;
        d.innerHTML = l.html;
        box.appendChild(d);
      });
      board.classList.add('veil');

      /* 以「最后一行」的动画为准：大字/分条 2.6s，其余 2.4s */
      const DUR = lines.some(l => /fl-(big|rule)/.test(l.cls)) ? 2600 : 2400;
      const lastStart = Math.max(0, lines.length - 1) * 95;
      const lastEnd = lastStart + DUR;

      /* 最后一行从 52% 起开始淡出，暗底也在这一刻起淡，时长正好用完剩下的 48% */
      const fadeStart = lastStart + DUR * 0.52;
      box.style.setProperty('--vo', `${(DUR * 0.48 / 1000).toFixed(2)}s`);
      setTimeout(() => {
        if (my !== token) return;
        box.classList.add('out');
      }, fadeStart);

      /* 字一消失，暗底与棋盘遮罩一起收干净 */
      setTimeout(() => {
        if (my !== token) return;
        box.classList.remove('out');
        box.innerHTML = '';
        board.classList.remove('veil');
      }, lastEnd + 30);
    }

    function signed2(v) {
      if (Math.abs(v) < 0.005) return '±0';
      return (v > 0 ? '+' : '−') + Math.abs(v).toFixed(2);
    }

    /* 属性变化不报小数，只报「等级跃迁 / 方向」 */
    function attrDeltaText(k, v) {
      const after = G.attrs[k];
      const before = after - v;
      const lvB = Math.min(10, Math.floor(before + 1e-6));
      const lvA = Math.min(10, Math.floor(after + 1e-6));
      if (lvA > lvB) return `Lv.${lvB}→${lvA}`;
      if (v > 0) return v >= 0.5 ? '↑↑' : '↑';
      return v <= -0.5 ? '↓↓' : '↓';
    }

    function showDeltas(deltas, notes) {
      const lines = [];
      if (notes.title) lines.push({ cls: 'fl-event', html: notes.title });
      if (notes.syn) lines.push({ cls: 'fl-syn', html: `✧ ${notes.syn} ✧` });
      if (notes.pre) lines.push({ cls: 'fl-event', html: '◇ 前置未通 · 收益减半' });
      if (notes.overflow) lines.push({ cls: 'fl-event', html: '◇ 协同溢出 · 半数转综合' });
      Object.keys(deltas).forEach(k => {
        const v = deltas[k];
        if (Math.abs(v) < 0.05) return;
        const isAttr = ATTRS.includes(k);
        const name = isAttr ? ATTR_NAME[k] : ({ will: '意志', hp: '健康', rel: '师生' })[k];
        const glyph = isAttr ? MODS[k].g : ({ will: '❖', hp: '✚', rel: '✧' })[k];
        lines.push({
          cls: 'fl-line ' + (v > 0 ? 'gain' : 'loss'),
          html: `<span class="g">${glyph}</span><span class="n">${name}</span><span class="v">${isAttr ? attrDeltaText(k, v) : signed(v)}</span>`
        });
      });
      if (notes.event) lines.push({ cls: 'fl-event', html: notes.event });
      floatResult(lines);
    }

    async function flyCards(cards) {
      const stage = $('.stage').getBoundingClientRect();
      const cx = stage.left + stage.width / 2;
      const cy = stage.top + stage.height / 2;
      const jobs = [];
      cards.forEach((c, i) => {
        const w = handEl.querySelector(`.card-wrap[data-id="${c.id}"]`);
        if (!w) return;
        const r = w.getBoundingClientRect();
        const flyer = document.createElement('div');
        flyer.className = 'flyer';
        flyer.style.cssText = `left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;`;
        /* 整张牌原样飞出去：克隆真牌面，布局不变 */
        const face = w.querySelector('.card');
        if (face) {
          const clone = face.cloneNode(true);
          clone.style.position = 'absolute';
          clone.style.inset = '0';
          flyer.appendChild(clone);
        } else {
          flyer.innerHTML = `<div class="ft">${esc(c.t)}</div>`;
        }
        $('#fly').appendChild(flyer);
        const dx = cx - (r.left + r.width / 2);
        const dy = cy - (r.top + r.height / 2);
        const a = flyer.animate([
          { transform: 'translate(0,0) scale(1) rotate(0deg)', opacity: 1, offset: 0 },
          { transform: `translate(${dx * .62}px,${dy * .62}px) scale(1.2) rotate(-4deg)`, opacity: 1, offset: .55 },
          { transform: `translate(${dx}px,${dy}px) scale(1.46) rotate(0deg)`, opacity: 1, offset: .82 },
          { transform: `translate(${dx}px,${dy}px) scale(1.62) rotate(0deg)`, opacity: 0, offset: 1 }
        ], { duration: 640, delay: i * 110, easing: 'cubic-bezier(.3,.7,.25,1)', fill: 'forwards' });
        jobs.push(a.finished.catch(() => { }).then(() => flyer.remove()));
        w.style.transition = 'opacity .2s';
        w.style.opacity = '0';
        setTimeout(() => w.remove(), 220);
      });
      SFX.play();
      await sleep(640 + (cards.length - 1) * 110);
      await Promise.all(jobs);
    }

    async function collectHand() {
      const wraps = Array.from(handEl.children);
      wraps.forEach((w, i) => {
        const tx = w.style.getPropertyValue('--tx'), ty = w.style.getPropertyValue('--ty');
        const rot = w.style.getPropertyValue('--rot');
        w.style.zIndex = 200 - i;
        w.animate([
          { transform: `translate3d(${tx}, ${ty}, 0) rotate(${rot})` },
          { transform: `translate3d(${tx}, ${ty}, 0) rotate(${rot}) translateY(10px) scale(.88)`, opacity: 0 }
        ], { duration: 420, delay: i * 40, easing: 'cubic-bezier(.5,0,.75,.3)', fill: 'forwards' });
        setTimeout(() => SFX.deal(), i * 40);
      });
      await sleep(480 + wraps.length * 45);
    }
    /* ==================================================================
       8. 场景切换（ADV 与手牌互斥）
    ================================================================== */
    function setMode(mode) {
      G.mode = mode;
      const adv = mode === 'adv';
      $('#layer-adv').classList.toggle('on', adv);
      $('#layer-hand').classList.toggle('on', !adv);
      const sk = $('#ui-skills');
      if (sk) sk.classList.toggle('off', adv);
      $('#board').classList.toggle('dim', adv);
      if (adv) clearHint();
      syncButtons();
      renderDeckMeta();
    }

    /* ==================================================================
       9. ADV 对话
    ================================================================== */
    const ADV = { typing: false, finish: null, waiter: null };

    function setSpeaker(s) {
      const el = $('#adv-speaker');
      el.textContent = s === 'cmo_UwU' ? 'cmo_UwU' : s;
      el.className = 'adv-speaker' + (s === 'cmo_UwU' ? ' student' : s === '教练' ? ' coach' : '');
    }

    function typeLine(text, isNarr) {
      return new Promise(res => {
        const el = $('#adv-text');
        let i = 0, done = false, timer = null;
        ADV.typing = true;
        const paint = n => {
          const body = isNarr ? `<span class="narr">${esc(text.slice(0, n))}</span>` : esc(text.slice(0, n));
          el.innerHTML = body + '<span class="caret"></span>';
        };
        const finish = () => {
          if (done) return;
          done = true;
          clearTimeout(timer);
          ADV.typing = false;
          ADV.finish = null;
          el.innerHTML = isNarr ? `<span class="narr">${esc(text)}</span>` : esc(text);
          res();
        };
        ADV.finish = finish;
        paint(0);
        const step = () => {
          if (done) return;
          if (i >= text.length) return finish();
          const ch = text[i++];
          paint(i);
          if (i % 2 === 0) SFX.type();
          let d = 24 + Math.random() * 14;
          if ('。！？'.includes(ch)) d += 190;
          else if ('，、；：—'.includes(ch)) d += 85;
          timer = setTimeout(step, d);
        };
        timer = setTimeout(step, 90);
      });
    }

    function waitAdvClick() {
      return new Promise(res => {
        ADV.waiter = res;
        $('#adv-next').classList.add('show');
      });
    }

    function onAdvClick() {
      if (G.mode !== 'adv') return;
      if (manualEl || Date.now() < mnGuard) return;
      if (ADV.typing && ADV.finish) { ADV.finish(); return; }
      if (ADV.waiter) {
        const w = ADV.waiter;
        ADV.waiter = null;
        $('#adv-next').classList.remove('show');
        w();
      }
    }

    /* 脚本令牌：跳过教程 / 强制切场时作废旧脚本，免得它继续往对话框里写字 */
    let scriptSeq = 0;

    async function playScript(lines) {
      const my = ++scriptSeq;
      setMode('adv');
      for (const ln of lines) {
        if (my !== scriptSeq) return;
        setSpeaker(ln.s);
        $('#adv-next').classList.remove('show');
        if (ln.spot) spotOn(ln.spot); else spotOff();
        /* 偶尔垫一层环境碎响，让对话不那么干 */
        if (Math.random() < 0.24) {
          EXT_SFX.play('noise', { vol: 0.95 + Math.random() * 0.4, rate: 0.86 + Math.random() * 0.3 });
        }
        await typeLine(ln.t, ln.s === '旁白');
        if (my !== scriptSeq) return;
        await waitAdvClick();
      }
      if (my === scriptSeq) spotOff();
    }

    /* ==================================================================
       10. 指引
    ================================================================== */
    let skipPause = null;
    function pause(ms) {
      return new Promise(res => {
        const t = setTimeout(() => { skipPause = null; res(); }, ms);
        skipPause = () => { clearTimeout(t); skipPause = null; res(); };
      });
    }

    function spotOn(target, pad = 8) {
      const el = typeof target === 'string' ? document.querySelector(target) : target;
      const spot = $('#spot');
      if (!el) return spotOff();
      const r = el.getBoundingClientRect();
      if (!r.width || !r.height) return spotOff();
      spot.style.left = (r.left - pad) + 'px';
      spot.style.top = (r.top - pad) + 'px';
      spot.style.width = (r.width + pad * 2) + 'px';
      spot.style.height = (r.height + pad * 2) + 'px';
      spot.classList.toggle('strong', G.mode === 'hand');
      spot.classList.add('on');
    }

    function spotOff() {
      $('#spot').classList.remove('on');
    }

    function clearHint() {
      spotOff();
      $('#coach').classList.remove('on');
      $('.board-wrap').classList.remove('lift');
    }

    /* 教练对话条：与 ADV 同款排版，但停在手牌上方，不遮挡牌面 */
    const COACH = { typing: false, finish: null };

    /* 逐字打完即返回（不等点击） */
    function coachType(text, target, speaker) {
      return new Promise(res => {
        $('#coach').classList.add('on');
        $('#coach-speaker').textContent = speaker || '教练';
        if (target) spotOn(target); else spotOff();
        const el = $('#coach-text');
        let i = 0, done = false, timer = null;
        COACH.typing = true;
        const paint = n => { el.innerHTML = esc(text.slice(0, n)) + '<span class="caret"></span>'; };
        const finish = () => {
          if (done) return;
          done = true;
          clearTimeout(timer);
          COACH.typing = false;
          COACH.finish = null;
          el.innerHTML = esc(text);
          res();
        };
        COACH.finish = finish;
        paint(0);
        const step = () => {
          if (done) return;
          if (i >= text.length) return finish();
          i++;
          paint(i);
          if (i % 2 === 0) SFX.type();
          timer = setTimeout(step, 26 + Math.random() * 14);
        };
        timer = setTimeout(step, 60);
      });
    }

    /* 讲解一步：打完字停住，点一下才继续 */
    function coachStep(text, target, speaker, tip) {
      return new Promise(async res => {
        $('#coach-tip').textContent = tip || '▼ 点 击 继 续';
        await coachType(text, target, speaker);
        if (!TUT.on) return res();
        TUT.waiter = res;
      });
    }

    /* 操作一步：打完字停住，等玩家真的做了那件事 */
    function coachAct(text, target, gate, lock, tip) {
      tutLock(lock || 'select');
      return new Promise(async res => {
        $('#coach-tip').textContent = tip || '▼ 点 击 目 标';
        await coachType(text, target, '教练');
        if (!TUT.on) return res();
        await Promise.race([waitFor(gate), tutSkipSignal]);
        res();
      });
    }

    /* ==================================================================
       11. 结算
    ================================================================== */
    /* 月度事件牌：每月盲抽三张、盲选一张，只有选中的生效 */
    const EVT_POOL = [
      { id: 'flash', n: '灵光一闪', k: 'good', t: '半夜忽然想通一个卡了很久的引理，他从床上坐了起来。', eff: () => ({ [pick(ATTRS)]: .6, will: .2 }) },
      { id: 'senior', n: '学长来访', k: 'good', t: '去年保送的学长回校，在走廊上跟他聊了一下午。', eff: () => ({ rel: .5, [pick(ATTRS)]: .3 }) },
      { id: 'library', n: '图书馆偶遇', k: 'good', t: '在旧期刊室翻到一本绝版的书，扉页上还有前人的批注。', eff: () => ({ [pick(['num', 'com'])]: .5 }) },
      { id: 'praise', n: '教练的肯定', k: 'good', cond: () => G.lastWin, t: '教研会上，你点名夸了他一句。他红着脸低头喝水。', eff: () => ({ will: .8, rel: .3 }) },
      { id: 'bottleneck', n: '瓶 颈 期', k: 'bad', t: '连着两周，做题速度没有一点长进。他开始怀疑方法。', eff: () => ({ will: -.8, rel: -.2 }) },
      { id: 'sick', n: '身体不适', k: 'bad', t: '换季，他开始咳嗽，草稿纸上落了几点药渍。', eff: () => ({ hp: -.9 }), inten: -1 },
      { id: 'parent', n: '家长施压', k: 'bad', t: '电话里，母亲问了很多次「到底有没有把握」。', eff: () => ({ rel: -.5, will: -.3 }) },
      { id: 'mock', n: '同学嘲讽', k: 'bad', t: '有人在背后说他是「做题机器」。他听见了，没回头。', eff: () => ({ will: -.6, gen: -.2 }) },
      { id: 'gaokao', n: '高考抉择', k: 'time', force: () => G.year === 1 && G.month === 6, t: '班主任把高考志愿表放在他桌上，说：想清楚再填。', eff: () => (G.rel >= 5 ? { rel: .5, will: .5 } : { rel: -.8, will: -.5 }), note: () => (G.rel >= 5 ? '他先来问你的意见。' : '他一个人填完了，没跟你说。') },
      { id: 'camp', n: '外省训练营', k: 'time', force: () => G.year === 2 && G.month === 7, t: '外省有个高水平训练营，名额只有一个，要占掉半个月。', eff: () => ({ [pick(ATTRS)]: .8, will: -.6 }), slot: 2 },
      { id: 'school', n: '学校活动', k: 'time', cond: () => G.month === 4 && Math.random() < 0.3, t: '校庆排练，他被拉去当班级代表，推不掉。', eff: () => ({ rel: .3 }), slot: 2 },
      { id: 'prize', n: '竞赛奖金', k: 'special', cond: () => G.lastWin && Math.random() < 0.3, t: '学校发了一笔竞赛奖金，他全买了书。', eff: () => ({ hp: .5, will: .3, rel: .2 }) }
    ];

    function sumAttrs() { return ATTRS.reduce((a, k) => a + G.attrs[k], 0); }

    function findSyn(cards) {
      if (cards.length !== 2) return null;
      const ids = cards.map(c => c.id);
      const fixed = SYNERGY.find(x => (x.a === ids[0] && x.b === ids[1]) || (x.a === ids[1] && x.b === ids[0]));
      if (fixed) return fixed;

      const [a, b] = cards;
      const am = a.m, bm = b.m;
      if (am === 'rest' && bm === 'rest') return null;

      // 属性卡 + 养息卡
      if (am === 'rest' || bm === 'rest') {
        const train = am === 'rest' ? b : a;
        const e = { will: .3 };
        ATTRS.forEach(k => { if ((train.e[k] || 0) > 0) e[k] = .1; });
        return { n: '张弛有度', d: '训练 × 养息', e };
      }
      // 同模块
      if (am === bm) {
        const e = { gen: .12 };
        ATTRS.forEach(k => { if ((a.e[k] || 0) + (b.e[k] || 0) > 0.5) e[k] = .16; });
        return { n: '专题精读', d: `${MODS[am].n} × ${MODS[bm].n}`, e };
      }
      // 相邻模块
      if ((ADJ[am] || []).indexOf(bm) >= 0) {
        const e = { gen: .1 };
        e[am] = .12; e[bm] = .12;
        return { n: '交叉视角', d: `${MODS[am].n} × ${MODS[bm].n}`, e };
      }
      return { n: '同席共读', d: '两张不同方向的书', e: { gen: .08 } };
    }

    /* ---------- 画像 / 状态 / 强度 ---------- */
    function profile() {
      return PROFILES.find(p => p.id === G.profile) || PROFILES[2];
    }

    /* 画像被动：主属性 ×1.15，弱属性 ×0.85；杂食型全科 ×1.05 */
    function profileMul(m) {
      if (m === 'rest') return 1;
      const p = profile();
      if (!p.up) return 1.05;
      if (m === p.up) return 1.15;
      if (m === p.down) return 0.85;
      return 1;
    }

    /* 状态乘数：三项全满 ×1.0，三项全空 ×0.75 */
    function stateMul() {
      return 0.75 + 0.25 * (G.will + G.hp + G.rel) / 30;
    }

    /* 强度因子：强度 1 → ×0.88，5 → ×1.2，10 → ×1.6 */
    function intenFactor() {
      return 0.8 + clamp(G.intensity, 1, 10) / 12.5;
    }

    /* 冷战：收益减半，负面事件概率翻倍 */
    function inCold() { return G.cold > 0; }

    /* ---------- 档位：健康三档、师生四档 ----------
       只影响「恢复效率 / 比赛 / 事件 / 台词」，不碰学习收益 */
    function hpTierOf(v) {
      v = v === undefined ? G.hp : v;
      return v >= 7 ? 'good' : v >= 4 ? 'mid' : 'weak';
    }
    function relTierOf(v) {
      v = v === undefined ? G.rel : v;
      if (v <= 2) return 'red';
      if (v <= 3) return 'distant';
      return v >= 7 ? 'close' : 'mid';
    }
    /* 疏离 / 红线：比赛软判定下压 */
    function relSoft() {
      const t = relTierOf();
      return t === 'red' ? -0.12 : t === 'distant' ? -0.08 : 0;
    }

    function resolvePlay(cards) {
      const deltas = {};
      const notes = { title: cards.map(c => c.t).join(' ＋ ') };
      const mood = stateMul() * intenFactor() * (inCold() ? 0.5 : 1);
      const weakHp = hpTierOf() === 'weak';
      let preMissing = false;

      cards.forEach(c => {
        const mast = G.mastery[c.id] || 0;
        const mm = MAST_MUL[Math.min(mast, 3)];
        const preOk = hasPre(c);
        if (!preOk) preMissing = true;
        const preMul = preOk ? 1 : 0.5;
        const tMul = profileMul(c.m);          // 因材施教
        const pMul = 1 + (G.pas[c.m] || 0);    // 方法牌的教法复利
        for (const k in c.e) {
          const v = c.e[k];
          let val;
          if (v > 0) {
            val = v * mood * mm * preMul * tMul * pMul;
            if (ATTRS.includes(k)) val *= Math.max(0.22, 1 - G.attrs[k] / 13.5);
            /* 虚弱：养息牌的健康回复只剩四分之三 */
            if (weakHp && k === 'hp' && c.m === 'rest') val *= 0.75;
          } else {
            val = v * (inCold() ? 1.35 : 1);
          }
          deltas[k] = (deltas[k] || 0) + val;
        }
      });

      /* 虚弱硬撑：每张学习牌额外掉一点意志（教练亲授不算） */
      if (weakHp) {
        const n = cards.filter(c => c.m !== 'rest' && c.m !== 'coach').length;
        if (n) deltas.will = (deltas.will || 0) - 0.1 * n;
      }
      /* 精研卷吃关系：每张 −0.12 师生；亲密时免 */
      if (relTierOf() !== 'close') {
        const n = cards.filter(c => c.tier === 3 && c.m !== 'coach').length;
        if (n) deltas.rel = (deltas.rel || 0) - 0.12 * n;
      }

      const syn = findSyn(cards);
      if (syn) {
        let moved = 0;
        const synMul = (profile().up ? 1 : 0.9) * (inCold() ? 0.5 : 1);
        for (const k in syn.e) {
          let v = syn.e[k] * synMul;
          // 溢出转化：该项已接近上限时，一半的加成转为综合
          if (ATTRS.includes(k) && G.attrs[k] > 7.5) {
            const over = clamp((G.attrs[k] - 7.5) / 2.5, 0, 1);
            const cut = v * over * 0.5;
            v -= cut;
            moved += cut;
          }
          deltas[k] = (deltas[k] || 0) + v;
        }
        if (moved > 0.02) {
          deltas.gen = (deltas.gen || 0) + moved;
          notes.overflow = true;
        }
        notes.syn = syn.n;
      }
      if (preMissing) notes.pre = true;

      return { deltas, notes };
    }

    function applyDeltas(d) {
      const real = {};
      for (const k in d) {
        let v = d[k];
        if (ATTRS.includes(k)) {
          const nv = clamp(G.attrs[k] + v, 0, 10);
          real[k] = nv - G.attrs[k];
          G.attrs[k] = nv;
        } else {
          const nv = clamp(G[k] + v, 0, 10);
          real[k] = nv - G[k];
          G[k] = nv;
        }
      }
      return real;
    }

    function flashKeys(d) {
      Object.keys(d).forEach(k => {
        if (Math.abs(d[k]) < 0.05) return;
        const sel = ATTRS.includes(k) ? `[data-ak="${k}"]` : `[data-vk="${k}"]`;
        const el = document.querySelector(sel);
        if (!el) return;
        el.classList.add('flash');
        setTimeout(() => el.classList.remove('flash'), 1000);
      });
    }

    /* ==================================================================
       12. 出牌 / 补牌
    ================================================================== */
    function grantPassive(card) {
      if (!card.pas) return;
      const names = [];
      for (const k in card.pas) {
        G.pas[k] = (G.pas[k] || 0) + card.pas[k];
        names.push(`${ATTR_NAME[k]}+${Math.round(card.pas[k] * 100)}%`);
      }
      toast(`《${card.t}》教法成形 · 此后${names.join('、')}`);
      renderBoard(false);
    }

    function bumpMastery(card) {
      const prev = G.mastery[card.id] || 0;
      const m = prev + 1;
      G.mastery[card.id] = Math.min(3, m);
      if (prev === 0) grantPassive(card);   // 第一次读懂，教法生效
      if (m !== 3) return false;
      let main = null, best = 0;
      ATTRS.forEach(k => { if ((card.e[k] || 0) > best) { best = card.e[k]; main = k; } });
      if (main && best > 0) {
        G.attrs[main] = clamp(G.attrs[main] + 0.12, 0, 10);
        toast(`《${card.t}》已精读 · ${ATTR_NAME[main]} +0.12`);
      }
      // 牌库见底时不退役，避免牌荒
      return (deck.length + discard.length) > 12;
    }

    /* 打出教练牌：不占时间、不耗精力，直接生效 */
    async function playCoach(card) {
      busy = true;
      selected = [];
      handEl.querySelectorAll('.card-wrap').forEach(w => w.classList.remove('sel', 'dim'));
      syncButtons();
      await flyCards([card]);
      hand = hand.filter(h => h !== card);
      busy = false;
      useSkill(card.coach);
      handEl.innerHTML = '';
      hand.forEach(c => handEl.appendChild(cardEl(c)));
      layoutHand();
      syncButtons();
      renderMatch();
      renderDeckMeta();
      fire('play');
      saveGame();          // 教练牌用过就落盘，刷新不能再用一次
    }

    async function doPlay() {
      if (busy || G.mode !== 'hand' || !selected.length) return;
      if (TUT.lock === 'all' || TUT.lock === 'select' || TUT.lock === 'end') return;
      const cards = selected.slice();
      if (cards.length === 1 && cards[0].coach) return playCoach(cards[0]);
      const u = playUnits(cards);
      const eCost = playEnergy(cards);
      const slots = allocUnits(u);
      if (!slots) { toast(`本月时间不够：要吃 ${u} 格，只剩 ${calLeft()} 格`); return; }
      if (G.energy < eCost) { toast(`精力不够：还差 ${eCost - G.energy} 点`); return; }

      busy = true;
      selected = [];
      handEl.querySelectorAll('.card-wrap').forEach(w => w.classList.remove('sel', 'dim'));
      syncButtons();

      await flyCards(cards);
      layoutHand();
      if (cards.some(c => c.m === 'rest')) EXT_SFX.play('tea');

      // 落格：逐格写入牌名，跨段自然横跨
      const label = cards.map(c => c.t).join(' ＋ ');
      const lab = shortLabel(label);
      G.cal[slots[0].i].items.push({ t: label });
      slots.forEach(sl => {
        const seg = G.cal[sl.i];
        for (let k = 0; k < sl.take; k++) seg.cells[seg.used + k] = lab;
        seg.used += sl.take;
      });

      let en = 0;
      cards.forEach(c => {
        hand = hand.filter(h => h !== c);
        if (bumpMastery(c)) {
          deck = deck.filter(d => d !== c);
        } else {
          discard.push(c);
        }
        en += (c.en || 0);
      });
      G.played += cards.length;
      if (cards.some(c => c.m === 'rest')) G.restPlayed = true;   // 本月是否打过养息牌
      G.energy = clamp(G.energy - eCost + en, 0, ENERGY_MAX);
      // 本月负荷：一次出牌记一条，联动取较高阶
      G.monthLoad.push(Math.max.apply(null, cards.map(c => c.m === 'rest' ? INTEN_W.rest : INTEN_W[c.tier])));

      const res = resolvePlay(cards);

      // 通宵记一笔债，补觉只能还六成
      let debtMsg = '';
      cards.forEach(c => {
        if (c.debt) {
          G.debt = Math.min(4, G.debt + c.debt);
          debtMsg = `透支 ${c.debt.toFixed(1)} · 未清的债会一直扣健康`;
        }
      });
      if (G.debt > 0.05 && cards.some(c => c.m === 'rest')) {
        const repay = G.debt * 0.6;
        G.debt = Math.max(0, G.debt - repay);
        debtMsg = `补觉还了 ${repay.toFixed(1)}，还欠 ${G.debt.toFixed(1)}`;
      }
      if (debtMsg) res.notes.event = debtMsg;

      const real = applyDeltas(res.deltas);
      renderBoard();
      renderCalendar();
      flashKeys(real);
      showDeltas(real, res.notes);
      burst();
      SFX.good();

      await sleep(760);
      busy = false;
      syncButtons();
      renderMatch();          // 出牌时 busy 还是 true，这里要补一次，否则复习按钮一直灰着
      renderDeckMeta();
      fire('play');
      saveGame();          // 每一次出牌都落盘：刷新回到这一刻，而不是月初

      if (G.will <= 0 || G.hp <= 0) return gameOver();
      if (calLeft() <= 0) {
        toast('8 格排满，这个月到此为止');
        await sleep(900);
        endMonth(true);
      }
    }

    /* 单张牌：从牌库的位置飞到手位（i 只用来错开节奏） */
    function dealWrap(w, i) {
      const tx = w.style.getPropertyValue('--tx');
      const ty = w.style.getPropertyValue('--ty');
      const rot = w.style.getPropertyValue('--rot');
      const base = `translate3d(${tx}, ${ty}, 0) rotate(${rot})`;
      const deckEl = document.querySelector('.deck');
      if (!deckEl) {
        w.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: i * 80, fill: 'backwards' });
        return;
      }
      const dr = deckEl.getBoundingClientRect();
      const r = w.getBoundingClientRect();
      const dx = (dr.left + dr.width / 2) - (r.left + r.width / 2);
      const dy = (dr.top + dr.height / 2) - (r.top + r.height / 2);
      w.animate([
        { transform: `${base} translate(${dx}px, ${dy}px) scale(.6)`, opacity: 0 },
        { transform: base, opacity: 1 }
      ], { duration: 520, delay: i * 80, easing: 'cubic-bezier(.2,.85,.3,1.02)', fill: 'backwards' });
    }

    function animateDeal(startIdx = 0) {
      const list = Array.from(handEl.children).slice(startIdx);
      if (!list.length) return;
      handEl.style.pointerEvents = 'none';
      setTimeout(() => { handEl.style.pointerEvents = ''; }, 520 + list.length * 80);
      list.forEach((w, i) => {
        dealWrap(w, i);
        setTimeout(() => SFX.deal(), i * 80);
      });
    }

    /* ==================================================================
       13. 月份循环
    ================================================================== */
    const SEASON_LINE = {

      3: ['三月的风带着土腥味。楼下的树冒了芽，他的习题册也换了新的一本。', '春光很好，可惜没人有空抬头看。'],

      8: ['八月，最热的日子。他把凉席铺在地板上，趴着做题。', '暑气蒸腾，连墨水都干得比平时快。'],
      9: ['九月，开学。走廊里又挤满了人，他的桌上多了一摞新的卷子。', '秋风一起，天就高了。他抬头看了眼天，又低下头。'],

    };

    function studentLine() {
      const c = nextComp();
      if (G.will < 3 || G.hp < 3) return pick([
        '「教练……我今天有点撑不住。能不能，慢一点？」',
        '「昨晚算到两点，今天看什么都是重影。」',
        '「我没事，就是有点困。真的。」'
      ]);
      /* 疏离：话变短、变冷；虚弱：话里带疲惫 */
      const rt = relTierOf();
      if (rt === 'red') return pick([
        '「……嗯。」',
        '「题做完了。放桌上了。」',
        '「还有事吗，教练。」'
      ]);
      if (rt === 'distant') return pick([
        '「今天读哪本。」',
        '「我按课表来就行。」',
        '「不用管我，我自己能安排。」'
      ]);
      if (hpTierOf() === 'weak') return pick([
        '「没事，我撑得住……就是有点头晕。」',
        '「这张牌，能不能挪到下个月？」',
        '「昨晚又没睡好。喝口水就好了。」'
      ]);
      if (G.month === 7 || G.month === 8) return pick([
        '「暑假……可以睡到八点吗？就一次。」',
        '「天太热了，脑子像一团浆糊。」',
        '「教练，我们能不能在树荫下做题？」'
      ]);
      if (c && (c.y - G.year) * 12 + (c.mo - G.month) <= 1) return pick([
        `「下个月就是${c.n}了。我……有点紧张。」`,
        `「${c.n}。教练，你觉得我能行吗？」`
      ]);
      const sum = ATTRS.reduce((a, k) => a + G.attrs[k], 0);
      if (sum > 26) return pick([
        '「最近做题，能看见以前看不见的东西了。」',
        '「有些题，我一眼就知道该往哪儿走。」',
        '「教练，我想试试更难的。」'
      ]);
      return pick([
        '「教练，今天我们读哪一本？」',
        '「这道题的辅助线，我昨晚梦到了。」',
        '「我准备好了。开始吧。」',
        '「小蓝本还剩几本没读完？」'
      ]);
    }

    function introLines() {
      const lines = [];
      const season = pick(SEASON_LINE[G.month]);
      lines.push({ s: '旁白', t: season });
      if (G.month === 7 || G.month === 8) {
        lines.push({ s: '旁白', t: '暑假不排课。身体会自己回来一些，月强度也会落下去。' });
      }
      lines.push({ s: 'cmo_UwU', t: studentLine() });
      if (Math.random() < 0.28) {
        lines.push({
          s: '旁白', t: pick([
            '书架上的小蓝本排成一列，书脊被翻得起了毛边。',
            '你把上个月的错题本翻到新的一页，写下日期。',
            '他做题时习惯咬笔杆，你提醒过很多次，没用。',
            '窗外的猫又蹲在墙头，看了一会儿，走了。'

    function scheduleSummary() {
      const parts = [];
      G.cal.forEach((seg, i) => {
        if (!seg.items.length) return;
        parts.push(`${SEG_NAME[i]}${seg.items.map(it => it.t).join('、')}`);
      });
      return parts.length ? parts.join('，') : '这个月，他几乎没碰书。';
    }

    /* ---------- 月度事件：盲抽三张、盲选一张 ---------- */
    const VIT_NAME = { will: '意志', hp: '健康', rel: '师生' };

    function effText(eff, ev) {
      const parts = [];
      for (const k in eff) {
        const v = eff[k];
        const n = ATTRS.includes(k) ? ATTR_NAME[k] : (VIT_NAME[k] || k);
        parts.push(`${n} ${v > 0 ? '+' : ''}${v.toFixed(1)}`);
      }
      if (ev && ev.slot) parts.push(`占 ${ev.slot} 格`);
      if (ev && ev.inten) parts.push(`强度 ${ev.inten > 0 ? '+' : ''}${ev.inten}`);
      return parts.length ? parts.join(' · ') : '什么也没发生';
    }

    function draftThree() {
      const chosen = [];
      EVT_POOL.filter(e => e.force && e.force()).forEach(e => { if (chosen.length < 2) chosen.push(e); });
      const pool = EVT_POOL.filter(e => chosen.indexOf(e) < 0 && e.id !== G.evtLast && (!e.cond || e.cond()));
      const isPos = e => e.k === 'good' || e.k === 'special';
      const isNeg = e => e.k === 'bad';

      /* 师生档位决定吉凶配比：关系差，坏消息扎堆；关系好，局面整体变顺 */
      const t = relTierOf();
      const needGood = t === 'close' ? 2 : t === 'mid' ? 1 : 0;
      const needBad = t === 'red' ? 2 : (t === 'distant' || t === 'mid') ? 1 : 0;

      while (chosen.length < 3 && chosen.filter(isPos).length < needGood) {
        const p = pool.filter(e => isPos(e) && chosen.indexOf(e) < 0);
        if (!p.length) break;
        chosen.push(pick(p));
      }
      while (chosen.length < 3 && chosen.filter(isNeg).length < needBad) {
        const n = pool.filter(e => isNeg(e) && chosen.indexOf(e) < 0);
        if (!n.length) break;
        chosen.push(pick(n));
      }
      const rest = pool.filter(e => chosen.indexOf(e) < 0);
      while (chosen.length < 3 && rest.length) {
        chosen.push(rest.splice(Math.floor(Math.random() * rest.length), 1)[0]);
      }
      return chosen.sort(() => Math.random() - 0.5).map(ev => ({ ev, eff: ev.eff() }));
    }

    function draftLayer(head, sub, cardsHtml, footText) {
      const layer = document.createElement('div');
      layer.className = 'draft-layer';
      layer.innerHTML = `<div class="draft-head">${head}<em>${sub}</em></div>
        <div class="draft-row">${cardsHtml}</div>
        <div class="draft-foot" id="draft-foot">${footText}</div>`;
      document.body.appendChild(layer);
      requestAnimationFrame(() => layer.classList.add('on'));
      return layer;
    }

    function pickEventsUI(list) {
      return new Promise(res => {
        const KIN = { good: '吉', bad: '凶', time: '时', special: '喜' };
        const NUM = ['壹', '贰', '叁'];
        const SIG = ['✦', '✧', '❖'];
        const html = list.map((x, i) => `
          <div class="draft-card" data-i="${i}">
            <div class="dc-inner">
              <div class="dc-back"><span>?</span><i>${NUM[i] || '壹'}</i></div>
              <div class="dc-face">
                <div class="dc-sigil">${SIG[i] || '✦'}</div>
                <div class="dc-top">
                  <span class="dc-k ${x.ev.k}">${KIN[x.ev.k] || '变'}</span>
                  <span class="dc-turn">第 ${NUM[i] || ''} 张</span>
                </div>
                <div class="dc-n">${x.ev.n}</div>
                <div class="dc-t">${x.ev.t}</div>
                <div class="dc-bot"><div class="dc-e">${effText(x.eff, x.ev)}</div></div>
              </div>
            </div>
          </div>`).join('');
        const layer = draftLayer('月 度 事 件', '三 张 背 面 · 盲 选 一 张 · 只 有 选 中 的 生 效', html, '— 凭 感 觉 选 一 张 —');
        let picked = -1, locked = false;
        const foot = layer.querySelector('#draft-foot');
        const cards = Array.from(layer.querySelectorAll('.draft-card'));

        /* 鼠标跟随的 3D 倾斜 + 卡背流光 */
        cards.forEach(card => {
          card.addEventListener('pointermove', e => {
            if (locked) return;
            const r = card.getBoundingClientRect();
            const px = (e.clientX - r.left) / r.width;
            const py = (e.clientY - r.top) / r.height;
            card.style.setProperty('--ry', ((px - .5) * 16).toFixed(2) + 'deg');
            card.style.setProperty('--rx', ((.5 - py) * 14).toFixed(2) + 'deg');
            card.style.setProperty('--ty', '-14px');
            card.style.setProperty('--sc', '1.03');
            const back = card.querySelector('.dc-back');
            if (back) {
              back.style.setProperty('--mx', (px * 100).toFixed(1) + '%');
              back.style.setProperty('--my', (py * 100).toFixed(1) + '%');
            }
          });
          card.addEventListener('pointerleave', () => {
            if (locked) return;
            ['--ry', '--rx', '--ty', '--sc'].forEach(v => card.style.removeProperty(v));
          });
        });

        const close = () => {
          layer.classList.remove('on');
          setTimeout(() => layer.remove(), 460);
          res(picked);
        };

        cards.forEach((card, i) => {
          card.addEventListener('click', () => {
            if (locked) return;
            locked = true;
            picked = i;
            ['--ry', '--rx', '--ty', '--sc'].forEach(v => card.style.removeProperty(v));

            /* 三张依次翻开 */
            const STEP = 230, FLIP = 900;
            cards.forEach((c, j) => {
              ['--ry', '--rx', '--ty', '--sc'].forEach(v => c.style.removeProperty(v));
              setTimeout(() => c.classList.add('flip'), j * STEP);
            });

            const done = (cards.length - 1) * STEP + FLIP;
            setTimeout(() => {
              cards.forEach((c, j) => {
                if (j === i) c.classList.add('chosen');
                else c.classList.add('faded');
              });
            }, done - 120);

            setTimeout(() => {
              foot.textContent = list[i].ev.k === 'bad' ? '这一张，也许不是好签。' : '你翻开了它。';
            }, done + 220);

            setTimeout(close, done + 2300);
          });
        });
      });
    }

    async function monthlyEvent() {
      setMode('adv');
      /* 三张牌一旦抽出来就写进存档：刷新只能从这三张里选，不能重抽 */
      let three;
      if (Array.isArray(G.evtPick) && G.evtPick.length) {
        three = G.evtPick.map(x => {
          const ev = EVT_POOL.find(e => e.id === x.id);
          return ev ? { ev, eff: x.eff } : null;
        }).filter(Boolean);
      } else {
        three = draftThree();
        if (three.length) { G.evtPick = three.map(x => ({ id: x.ev.id, eff: x.eff })); saveGame(); }
      }
      if (!three.length) return;
      const idx = await pickEventsUI(three);
      if (idx < 0) return;
      const pickX = three[idx];
      const ev = pickX.ev;
      G.evtLast = ev.id;
      G.evtPick = null;
      if (ev.slot) G.slotCut = (G.slotCut || 0) + ev.slot;
      if (ev.inten) G.intensity = clamp(G.intensity + ev.inten, 1, 10);
      const real = applyDeltas(pickX.eff);
      G.log.push({ t: `${ev.n}${ev.note ? ' · ' + ev.note() : ''}`, k: ev.k === 'bad' ? 'lose' : 'win' });
      /* 选完即落盘：这一条事件本月只发生一次 */
      G.evtDone = G.year * 12 + G.month;
      saveGame();
      renderBoard();
      flashKeys(real);
      const lines = [{ cls: 'fl-event', html: `${ev.k === 'bad' ? '◆' : '◇'} ${ev.n}` }];
      ATTRS.concat(['will', 'hp', 'rel']).forEach(k => {
        const v = real[k] || 0;
        if (Math.abs(v) < 0.05) return;
        const isAttr = ATTRS.includes(k);
        lines.push({
          cls: 'fl-line ' + (v > 0 ? 'gain' : 'loss'),
          html: `<span class="g">${isAttr ? MODS[k].g : ({ will: '❖', hp: '✚', rel: '✧' })[k]}</span><span class="n">${isAttr ? ATTR_NAME[k] : VIT_NAME[k]}</span><span class="v">${signed(v)}</span>`
        });
      });
      if (ev.slot) lines.push({ cls: 'fl-event', html: `本月被占去 ${ev.slot} 格` });
      floatResult(lines);
      if (ev.k === 'bad') SFX.bad(); else SFX.good();
      await sleep(1600);
    }

    /* 抽三张：至少一张休息、一张冲刺，一年之内不重复 */
    function holidayDraw(n) {
      const used = G.holidayUsed || (G.holidayUsed = []);
      let restPool = HOLIDAY_CARDS.filter(c => c.type === 'rest' && used.indexOf(c.id) < 0);
      let sprintPool = HOLIDAY_CARDS.filter(c => c.type === 'sprint' && used.indexOf(c.id) < 0);
      if (restPool.length < 2 || sprintPool.length < 1) {
        used.length = 0;
        restPool = HOLIDAY_CARDS.filter(c => c.type === 'rest');
        sprintPool = HOLIDAY_CARDS.filter(c => c.type === 'sprint');
      }
      const out = [];
      const take = (pool, k) => {
        while (k-- > 0 && pool.length) out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
      };
      take(sprintPool, 1);
      take(restPool, Math.max(1, (n || 3) - 1));
      return out.sort(() => Math.random() - 0.5);
    }

        const layer = draftLayer('假 期 的 一 件 事', '休 息 修 复 局 面 · 冲 刺 赌 一 个 身 位', html, '— 他 想 做 哪 一 件 —');

        /* 悬浮：3D 倾斜 + 卡面光泽跟随鼠标（和月度事件同一套手感） */
        cards.forEach(card => {

            card.style.setProperty('--rx', ((.5 - py) * 12).toFixed(2) + 'deg');

    async function holidayFlow() {
      G.monthLoad = [];
      setMode('adv');
      const summer = G.month === 7;
      await playScript([
        { s: '旁白', t: summer ? '七月，暑假。校园空了大半，蝉声铺满整个午后。' : '八月，最热的日子。凉席铺在地板上，风扇转得有气无力。' },
        { s: '旁白', t: '这个月不排课。你把他从书桌前赶了出去——书是读不完的，人得先歇过来。' }
      ]);

      /* ---------- 八月：假期尾声，只给一点自动恢复 ---------- */
      if (!summer) {
        await playScript([{ s: '旁白', t: '暑假快用完了。他没做什么大事，只是把觉补了回来。' }]);
        const d8 = { hp: .4, will: .3, rel: .2 };
        G.stage = 'settling';
        G.pend = { kind: 'holiday', applied: false, deltas: d8 };
        saveGame();
        const real = applyDeltas(d8);
        G.intensity = clamp(Math.max(3, G.intensity - 1), 1, 10);
        G.pend = { kind: 'holiday', applied: true };
        saveGame();
        renderBoard();
        flashKeys(real);
        const lines = [
          { cls: 'fl-event', html: '假 期 尾 声' },
          { cls: 'fl-meta', html: '不排课 · 不选牌 · 只是歇着' }
        ];
        ATTRS.concat(['will', 'hp', 'rel']).forEach(k => {
          const v = real[k] || 0;
          if (Math.abs(v) < 0.05) return;
          const isAttr = ATTRS.includes(k);
          lines.push({
            cls: 'fl-line ' + (v > 0 ? 'gain' : 'loss'),
            html: `<span class="g">${isAttr ? MODS[k].g : ({ will: '❖', hp: '✚', rel: '✧' })[k]}</span><span class="n">${isAttr ? ATTR_NAME[k] : VIT_NAME[k]}</span><span class="v">${isAttr ? attrDeltaText(k, v) : signedV(v)}</span>`
          });
        });
        lines.push({ cls: 'fl-meta', html: '月强度 −1' });
        floatResult(lines);
        SFX.good();
        await sleep(2000);
        return finishHoliday();
      }

      /* ---------- 七月：先选牌，再一次性结算 ---------- */
      await playScript([{ s: '旁白', t: '假期只够做一件事。这一次，让他自己挑。' }]);

      /* 抽到的三张、选中的那一张都记在存档里：刷新只能接着走，不能重抽重选 */
      let list, hi;
      if (G.holPick && G.holPick.length) {
        list = G.holPick.map(id => HOLIDAY_CARDS.find(c => c.id === id)).filter(Boolean);
        hi = (typeof G.holSel === 'number' && G.holSel >= 0 && G.holSel < list.length)
          ? G.holSel : await holidayPick(list);
      } else {
        list = holidayDraw(3);
        G.holPick = list.map(c => c.id);
        saveGame();
        hi = await holidayPick(list);
      }
      if (hi >= 0) { G.holSel = hi; saveGame(); }
      const card = hi >= 0 ? list[hi] : null;
      if (card) {
        if (G.holidayUsed.indexOf(card.id) < 0) G.holidayUsed.push(card.id);
        if (!G.log.some(x => x.t === `假期 · ${card.n}`)) G.log.push({ t: `假期 · ${card.n}`, k: 'choice' });
        await playScript([{ s: '旁白', t: card.t }]);
      }

      const sprint = !!(card && card.type === 'sprint');
      /* 固定恢复：无视虚弱；冲刺类减半 */
      const d = { hp: sprint ? .5 : 1.0, rel: sprint ? .2 : .4 };
      if (card) {
        for (const k in card.e) d[k] = (d[k] || 0) + card.e[k];
        if (card.pen) for (const k in card.pen) d[k] = (d[k] || 0) + card.pen[k];
      }
      /* 结算结果先落盘，再应用：刷新回来不会重复加 */
      G.stage = 'settling';
      G.pend = { kind: 'holiday', applied: false, deltas: d };
      saveGame();
      const real = applyDeltas(d);

      /* 休息类保底：健康 / 师生至少回到 4 */
      let floorHit = [];
      if (card && card.type === 'rest') {
        if (G.hp < 4) { real.hp = (real.hp || 0) + (4 - G.hp); G.hp = 4; floorHit.push('健康'); }
        if (G.rel < 4) { real.rel = (real.rel || 0) + (4 - G.rel); G.rel = 4; floorHit.push('师生'); }
      }

      G.intensity = clamp(Math.max(3, G.intensity - 2), 1, 10);
      G.pend = { kind: 'holiday', applied: true };
      saveGame();
      renderBoard();
      flashKeys(real);

      const lines = [{ cls: 'fl-event', html: '假 期 结 算' }];
      if (card) lines.push({ cls: 'fl-meta', html: `他挑了 · <b>${card.n}</b>${sprint ? ' · 冲刺' : ' · 休息'}` });
      ATTRS.concat(['will', 'hp', 'rel']).forEach(k => {
        const v = real[k] || 0;
        if (Math.abs(v) < 0.05) return;
        const isAttr = ATTRS.includes(k);
        lines.push({
          cls: 'fl-line ' + (v > 0 ? 'gain' : 'loss'),
          html: `<span class="g">${isAttr ? MODS[k].g : ({ will: '❖', hp: '✚', rel: '✧' })[k]}</span><span class="n">${isAttr ? ATTR_NAME[k] : VIT_NAME[k]}</span><span class="v">${isAttr ? attrDeltaText(k, v) : signedV(v)}</span>`
        });
      });
      if (sprint) lines.push({ cls: 'fl-meta', html: '冲刺 · 固定回血减半，健康 / 师生各让一步' });
      if (floorHit.length) lines.push({ cls: 'fl-meta', html: `休息把他托住了 · ${floorHit.join(' / ')} 至少回到 4` });
      lines.push({ cls: 'fl-meta', html: '月强度 −2' });
      floatResult(lines);
      SFX.good();
      await sleep(2200);

      return finishHoliday();
    }

    async function finishHoliday() {
      const comp = compThisMonth();
      /* 假期末尾若有比赛，胜负也在这里定死 */
      const cw = comp ? (Math.random() < compEval(comp, true).ch) : null;
      G.stage = 'settling';
      G.pend = { kind: 'holiday', applied: true, comp: comp ? comp.id : null, win: cw };
      saveGame();
      if (comp) {
        await runComp(comp, cw);
        if (!G.active) return;
        if (comp.idx === COMPS.length - 1) return epilogue();
      }
      advanceTime();
      G.stage = 'intro';
      G.pend = null;
      saveGame();
      renderBoard();
      busy = false;
      await sleep(300);
      beginMonth();
    }

    function askDialogue(opts) {

    async function maybeRescue() {
      const r = G.rescue || (G.rescue = { used: 0, last: -99, missed: 0 });
      const m = G.year * 12 + G.month;
      if (r.used >= 2 || G.will >= 3) return false;
      if (r.used === 1 && (G.will >= 2 || m - r.last < 6)) return false;
      /* 场景固定：刷新不会换一段重来 */
      let sc = null;
      if (typeof r.scene === 'number' && RESCUE_SCENES[r.scene]) sc = RESCUE_SCENES[r.scene];
      else { sc = pick(RESCUE_SCENES); r.scene = RESCUE_SCENES.indexOf(sc); saveGame(); }

      if (o.ok) {

    /* ---------- 教练技能 ---------- */
    function useSkill(id) {
      if (G.mode !== 'hand' || busy || G.skills[id]) return;
      const s = SKILLS.find(x => x.id === id);
      if (!s) return;
      G.skills[id] = 1;
      const lines = [{ cls: 'fl-event', html: `教练 · ${s.n}` }];
      if (id === 'train') {
        const k = pick(ATTRS);
        G.attrs[k] = clamp(G.attrs[k] + 1, 0, 10);
        G.intensity = clamp(G.intensity + 1, 1, 10);
        lines.push({ cls: 'fl-line gain', html: `<span class="g">${MODS[k].g}</span><span class="n">${ATTR_NAME[k]}</span><span class="v">+1.0</span>` });
        lines.push({ cls: 'fl-event', html: '月强度 +1' });
      } else if (id === 'talk') {
        G.will = clamp(G.will + 1.5, 0, 10);
        G.rel = clamp(G.rel + 0.8, 0, 10);

        lines.push({ cls: 'fl-line gain', html: `<span class="g">✧</span><span class="n">师生</span><span class="v">+0.8</span>` });
      } else if (id === 'plan') {
        G.planBuff = 0.2;

      } else {
        G.will = clamp(G.will + 1.2, 0, 10);
        G.hp = clamp(G.hp + 1.5, 0, 10);
        G.intensity = clamp(G.intensity - 2, 1, 10);
