<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金牌教练 · 小蓝本秘卷</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #080604;
      --bg2: #100b06;
      --brass: #b08d4f;
      --brass-l: #e8d3a2;
      --brass-d: #6d5327;
      --brass-x: #3d2e17;
      --parch: #e8dcc4;
      --parch-d: #b3a180;
      --ink: #1d150e;
      --gain: #e3bd76;
      --loss: #b8574a;
      --cw: 190px;
      --ch: 269px;
      --fs: 1.38;
      --dockH: 392px;
      --font-d: 'Cinzel', 'Noto Serif SC', serif;
      --font-t: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--parch);
      font-family: var(--font-t);
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    /* ---------- 环境纹理 ---------- */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background-image:
        radial-gradient(ellipse at 50% 0%, rgba(176, 141, 79, .16), transparent 62%),
        radial-gradient(ellipse at 50% 110%, rgba(120, 60, 30, .12), transparent 60%),
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.30'/></svg>");
      background-blend-mode: overlay;
      opacity: .55;
      mix-blend-mode: overlay;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(ellipse 78% 78% at 50% 44%, transparent 52%, rgba(0, 0, 0, .62) 100%);
      box-shadow: inset 0 0 90px 0 rgba(0, 0, 0, .55);
    }

    button {
      font-family: inherit;
      color: inherit;
      border: 0;
      background: none;
      cursor: pointer;
    }

    /* ================= 顶栏 ================= */
    /* ---- 顶部浮层：只留时间与两个工具 ---- */
    .hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 0;
      z-index: 40;
      pointer-events: none;
    }

    .hud .plaque {
      position: absolute;
      top: 14px;
      left: 22px;
      pointer-events: auto;
    }

    .hud .tools {
      position: absolute;
      top: 14px;
      right: 22px;
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-d);
      font-size: calc(17px * var(--fs));
      letter-spacing: .18em;
      color: var(--brass-l);
      text-shadow: 0 0 18px rgba(176, 141, 79, .35);
    }

    .brand .sigil {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 1px solid var(--brass-d);
      border-radius: 50%;
      font-size: calc(15px * var(--fs));
      color: var(--brass);
      box-shadow: inset 0 0 12px rgba(176, 141, 79, .3);
      transform: rotate(45deg);
    }

    .brand .sigil span {
      transform: rotate(-45deg);
    }

    .brand small {
      display: block;
      font-family: var(--font-t);
      font-size: calc(10px * var(--fs));
      letter-spacing: .34em;
      color: #7d6a4a;
      margin-top: 2px;
      text-shadow: none;
    }

    .plaque {
      position: relative;
      padding: 6px 30px;
      border: 1px solid var(--brass-d);
      background: linear-gradient(#1a130a, #0b0805);
      box-shadow: inset 0 0 18px rgba(0, 0, 0, .9), 0 0 0 1px rgba(0, 0, 0, .8);
      font-family: var(--font-d);
      font-size: calc(14px * var(--fs));
      letter-spacing: .16em;
      color: var(--brass-l);
      min-width: 260px;
      text-align: center;
    }

    .plaque::before,
    .plaque::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 5px;
      height: 5px;
      margin-top: -2.5px;
      background: var(--brass);
      transform: rotate(45deg);
      opacity: .7;
    }

    .plaque::before {
      left: 9px;
    }

    .plaque::after {
      right: 9px;
    }

    .plaque em {
      font-style: normal;
      color: #8d7a56;
      font-size: calc(11px * var(--fs));
      letter-spacing: .2em;
      margin-left: 10px;
    }

    .tools {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid #3d2e17;
      color: #9c8760;
      font-size: calc(14px * var(--fs));
      background: linear-gradient(#150f08, #0a0705);
      transition: .25s;
    }

    .icon-btn:hover {
      color: var(--brass-l);
      border-color: var(--brass);
      box-shadow: 0 0 14px rgba(176, 141, 79, .3);
    }

    /* ---------- 音量面板：点 ♪ 展开，背景音 / 音效分开调 ---------- */
    .snd-wrap {
      position: relative;
      display: flex;
    }

    .vol-pop {
      position: absolute;
      top: 42px;
      right: -6px;
      width: 214px;
      padding: 12px 13px 11px;
      background: linear-gradient(#171009, #0b0805);
      border: 1px solid #3d2e17;
      box-shadow: 0 14px 34px rgba(0, 0, 0, .62), inset 0 0 0 1px rgba(176, 141, 79, .08);
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: .22s ease;
      z-index: 60;
    }

    .vol-pop.on {
      opacity: 1;
      transform: none;
      pointer-events: auto;
    }

    .vp-head {
      color: var(--brass-l);
      font-size: calc(10px * var(--fs));
      letter-spacing: .34em;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(176, 141, 79, .16);
    }

    .vp-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 9px;
    }

    .vp-k {
      color: #8d7a56;
      font-size: calc(10px * var(--fs));
      letter-spacing: .16em;
      width: 44px;
      flex: 0 0 auto;
    }

    .vp-row input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1 1 auto;
      height: 3px;
      background: linear-gradient(90deg, var(--brass) var(--p, 55%), #2a2013 var(--p, 55%));
      outline: none;
      cursor: pointer;
    }

    .vp-row input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--brass-l);
      box-shadow: 0 0 8px rgba(176, 141, 79, .6);
      cursor: pointer;
    }

    .vp-row input[type=range]::-moz-range-thumb {
      width: 11px;
      height: 11px;
      border: 0;
      border-radius: 50%;
      background: var(--brass-l);
      cursor: pointer;
    }

    .vp-row b {
      color: #c9b28a;
      font-size: calc(10px * var(--fs));
      font-weight: 400;
      width: 24px;
      text-align: right;
      flex: 0 0 auto;
    }

    .vp-mute {
      width: 100%;
      margin-top: 4px;
      padding: 6px 0;
      border: 1px solid #3d2e17;
      background: transparent;
      color: #9c8760;
      font-family: inherit;
      font-size: calc(10px * var(--fs));
      letter-spacing: .26em;
      cursor: pointer;
      transition: .2s;
    }

    .vp-mute:hover {
      color: var(--brass-l);
      border-color: var(--brass);
      background: rgba(176, 141, 79, .07);
    }

    /* ================= 中央看板（天文盘式 HUD） ================= */
    .stage {
      position: relative;
      z-index: 10;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 26px 8px;
    }

    .board-wrap {
      position: relative;
      width: min(1440px, 100%);
      transition: transform .55s cubic-bezier(.2, .9, .3, 1);
    }

    .board-wrap.lift {
      transform: translateY(-42px) scale(.95);
    }

    /* 星盘底纹 */
    .astro {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(920px, 100vw);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      background: repeating-conic-gradient(from 0deg, rgba(176, 141, 79, .2) 0deg .4deg, transparent .4deg 3.4deg);
      -webkit-mask: radial-gradient(circle, transparent 0 46%, #000 46.5% 48.2%, transparent 48.7% 56.6%, #000 57.1% 58.6%, transparent 59.1%);
      mask: radial-gradient(circle, transparent 0 46%, #000 46.5% 48.2%, transparent 48.7% 56.6%, #000 57.1% 58.6%, transparent 59.1%);
      opacity: .62;
      animation: spin 160s linear infinite;
    }

    /* 浮尘 */
    .dust {
      position: absolute;
      inset: -30px;
      overflow: hidden;
      pointer-events: none;
    }

    .dust i {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: rgba(232, 211, 162, .9);
      box-shadow: 0 0 7px rgba(232, 211, 162, .8);
      opacity: 0;
      animation: drift linear infinite;
    }

    @keyframes drift {
      0% {
        transform: translate3d(0, 24px, 0) scale(.6);
        opacity: 0;
      }

      18% {
        opacity: .9;
      }

      80% {
        opacity: .45;
      }

      100% {
        transform: translate3d(var(--dx, 12px), -110px, 0) scale(1);
        opacity: 0;
      }
    }

    .board {
      position: relative;
      display: grid;
      grid-template-columns: 258px 1fr 356px;
      align-items: center;
      gap: 26px;
      padding: 20px 28px 18px;
      border: 1px solid #4a3a1e;
      background:
        radial-gradient(ellipse at 50% -14%, rgba(100, 74, 32, .34), transparent 58%),
        linear-gradient(158deg, rgba(32, 24, 14, .95), rgba(9, 7, 4, .97) 52%, rgba(23, 17, 10, .95));
      box-shadow:
        inset 0 0 0 1px rgba(0, 0, 0, .9),
        inset 0 1px 0 rgba(176, 141, 79, .2),
        inset 0 0 90px rgba(0, 0, 0, .8),
        0 26px 70px rgba(0, 0, 0, .9);
      transition: filter .5s;
    }

    .board.dim {
      filter: brightness(.74) saturate(.86);
    }

    .board.veil {
      filter: brightness(.42) saturate(.7) blur(.6px);
    }

    /* 四角铜饰 */
    .corner {
      position: absolute;
      width: 30px;
      height: 30px;
      pointer-events: none;
      border: 1px solid rgba(176, 141, 79, .7);
      opacity: .85;
    }

    .corner::after {
      content: '';
      position: absolute;
      width: 5px;
      height: 5px;
      background: var(--brass);
      transform: rotate(45deg);
      box-shadow: 0 0 8px rgba(176, 141, 79, .75);
    }

    .corner.tl {
      left: -1px;
      top: -1px;
      border-right: 0;
      border-bottom: 0;
    }

    .corner.tl::after {
      right: -3px;
      bottom: -3px;
    }

    .corner.tr {
      right: -1px;
      top: -1px;
      border-left: 0;
      border-bottom: 0;
    }

    .corner.tr::after {
      left: -3px;
      bottom: -3px;
    }

    .corner.bl {
      left: -1px;
      bottom: -1px;
      border-right: 0;
      border-top: 0;
    }

    .corner.bl::after {
      right: -3px;
      top: -3px;
    }

    .corner.br {
      right: -1px;
      bottom: -1px;
      border-left: 0;
      border-top: 0;
    }

    .corner.br::after {
      left: -3px;
      top: -3px;
    }

    /* ---- 学生 ---- */
    .col-stu {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding-right: 22px;
      border-right: 1px solid rgba(109, 83, 39, .3);
    }

    .medal {
      position: relative;
      padding: 6px;
      border-radius: 50%;
    }

    .medal::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #4a3a1e, #e8d3a2 9%, #6d5327 21%, #b08d4f 43%, #3d2e17 57%, #b08d4f 78%, #4a3a1e);
      -webkit-mask: radial-gradient(circle, transparent 0 62%, #000 63%);
      mask: radial-gradient(circle, transparent 0 62%, #000 63%);
      animation: spin 34s linear infinite;
      opacity: .95;
    }

    .portrait {
      position: relative;
      width: 126px;
      height: 126px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 35%, #2a2013, #090604 72%);
      box-shadow: 0 0 0 1px var(--brass-d), inset 0 0 30px rgba(0, 0, 0, .95), 0 14px 36px rgba(0, 0, 0, .85);
    }

    .portrait svg {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 50%;
    }

    .portrait .halo {
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      border: 1px dashed rgba(176, 141, 79, .35);
      animation: spin 46s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .s-name {
      font-family: var(--font-d);
      font-size: calc(16px * var(--fs));
      letter-spacing: .12em;
      color: var(--brass-l);
      margin-top: 2px;
    }

    .s-title {
      font-size: calc(10px * var(--fs));
      letter-spacing: .22em;
      color: #9c8760;
      padding: 3px 10px;
      border: 1px solid rgba(109, 83, 39, .55);
      background: rgba(0, 0, 0, .35);
    }

    .talent-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
      margin-top: 1px;
    }

    .t-chip {
      font-size: calc(9px * var(--fs));
      letter-spacing: .06em;
      padding: 1px 6px;
      border: 1px solid rgba(109, 83, 39, .55);
      color: #9c8760;
      background: rgba(0, 0, 0, .35);
      white-space: nowrap;
    }

    .t-chip.up {
      color: #d3b06a;
      border-color: rgba(176, 141, 79, .72);
    }

    .t-chip.down {
      color: #8492a0;
      border-color: rgba(120, 140, 150, .45);
    }

    /* ---- 月强度 ---- */
    .inten {
      position: absolute;
      top: 4px;
      right: 2px;
      width: 164px;
      z-index: 3;
    }

    .in-row {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: calc(9px * var(--fs));
      letter-spacing: .08em;
      color: #9c8760;
    }

    .in-row .in-label {
      flex: 0 0 auto;
    }

    .in-pips {
      display: flex;
      gap: 2px;
      flex: 1;
      min-width: 40px;
    }

    .in-pips i {
      flex: 1;
      height: 4px;
      background: rgba(109, 83, 39, .28);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .4);
    }

    .in-pips i.on {
      background: linear-gradient(180deg, #d8b978, #9a7638);
    }

    .in-pips i.hot {
      background: linear-gradient(180deg, #e08a63, #a9503a);
    }

    .in-val {
      flex: 0 0 auto;
      font-family: var(--font-d);
      color: var(--brass-l);
      font-size: calc(10px * var(--fs));
      letter-spacing: .04em;
    }

    .in-val.up {
      color: #e0916a;
    }

    .in-val.down {
      color: #8fb2c4;
    }

    .in-state {
      font-size: calc(9px * var(--fs));
      letter-spacing: .06em;
      color: #8d7a55;
      text-align: right;
    }

    .in-state b {
      color: #d3b06a;
      font-weight: 400;
    }

    .in-state.cold b {
      color: #c0675a;
    }

    /* ---- 教练技能 ---- */
    .skills {
      display: flex;
      gap: 5px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .sk-chip {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 7px;
      font-family: inherit;
      font-size: calc(10px * var(--fs));
      letter-spacing: .06em;
      color: #c8ac74;
      background: linear-gradient(180deg, rgba(52, 39, 20, .9), rgba(24, 18, 10, .9));
      border: 1px solid rgba(140, 108, 55, .6);
      cursor: pointer;
      transition: .18s;
      white-space: nowrap;
    }

    .sk-chip i {
      font-style: normal;
      font-size: calc(10px * var(--fs));
      color: var(--brass);
    }

    .sk-chip:hover:not(:disabled) {
      border-color: rgba(214, 178, 110, .9);
      color: #f0d9a6;
      box-shadow: 0 0 12px rgba(176, 141, 79, .25);
    }

    .sk-chip:disabled,
    .sk-chip.used {
      opacity: .34;
      cursor: default;
      filter: grayscale(.6);
    }

    .skills.off {
      opacity: .35;
      pointer-events: none;
    }

    .sk-chip.buff {
      border-color: rgba(214, 178, 110, .9);
      color: #f0d9a6;
    }

    /* ---- 生命刻条 ---- */
    .vitals {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      margin-top: 8px;
    }

    .vital {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .v-ico {
      flex: 0 0 20px;
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      font-family: var(--font-d);
      font-size: calc(10px * var(--fs));
      color: var(--c);
      background: rgba(0, 0, 0, .55);
      border: 1px solid color-mix(in srgb, var(--c) 50%, transparent);
      transform: rotate(45deg);
      box-shadow: 0 0 10px color-mix(in srgb, var(--c) 26%, transparent);
      transition: box-shadow .35s;
    }

    .v-ico span {
      display: block;
      transform: rotate(-45deg);
      line-height: 1;
    }

    .v-body {
      flex: 1;
      min-width: 0;
    }

    .v-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 3px;
    }

    .v-name {
      font-size: calc(10.5px * var(--fs));
      letter-spacing: .18em;
      color: #bda67c;
    }

    .v-num {
      font-family: var(--font-d);
      font-size: calc(12.5px * var(--fs));
      font-weight: 700;
      color: var(--c);
      text-shadow: 0 0 12px color-mix(in srgb, var(--c) 55%, transparent);
      transition: color .3s;
    }

    .v-track {
      position: relative;
      display: flex;
      gap: 2px;
      height: 9px;
      overflow: hidden;
    }

    .v-seg {
      flex: 1;
      background: #0a0705;
      box-shadow: inset 0 0 0 1px rgba(109, 83, 39, .3);
      transition: background .5s, box-shadow .5s;
    }

    .v-seg.on {
      background: var(--c);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .4), 0 0 8px color-mix(in srgb, var(--c) 60%, transparent);
    }

    .v-track::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .4), transparent);
      transform: translateX(-110%);
      animation: sheen 3.6s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes sheen {

      0%,
      58% {
        transform: translateX(-110%);
      }

      100% {
        transform: translateX(110%);
      }
    }

    .vital.flash .v-ico {
      box-shadow: 0 0 20px var(--c), inset 0 0 8px var(--c);
    }

    .vital.flash .v-num {
      color: #fff;
    }

    /* 低档：数字变红 + 轻微呼吸（只是状态皮肤，不是新数据） */
    .vital.low .v-num {
      color: #cf6b58;
      animation: vBreath 2.8s ease-in-out infinite;
    }

    .vital.crit .v-num {
      color: #e05a45;
      animation-duration: 1.7s;
    }

    .vital.low .v-track .v-seg.on {
      background: #b8553f;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .4), 0 0 8px rgba(184, 85, 63, .55);
    }

    @keyframes vBreath {

      0%,
      100% {
        opacity: .68;
        text-shadow: 0 0 6px rgba(207, 107, 88, .25);
      }

      50% {
        opacity: 1;
        text-shadow: 0 0 16px rgba(207, 107, 88, .75);
      }
    }

    /* ---- 五维星盘 ---- */
    .col-chart {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-width: 0;
    }

    .col-chart::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 52%;
      width: min(392px, 96%);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      background: repeating-conic-gradient(from 0deg, rgba(176, 141, 79, .26) 0deg .5deg, transparent .5deg 6deg);
      -webkit-mask: radial-gradient(circle, transparent 0 63%, #000 63.5% 65.5%, transparent 66% 72%, #000 72.5% 74%, transparent 74.5%);
      mask: radial-gradient(circle, transparent 0 63%, #000 63.5% 65.5%, transparent 66% 72%, #000 72.5% 74%, transparent 74.5%);
      opacity: .38;
      animation: spin 90s linear infinite;
    }

    .col-chart::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 52%;
      width: min(330px, 86%);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, rgba(176, 141, 79, .16) 0%, rgba(176, 141, 79, .04) 52%, transparent 68%);
      animation: breathe 5.5s ease-in-out infinite;
    }

    @keyframes breathe {

      0%,
      100% {
        opacity: .55;
        transform: translate(-50%, -50%) scale(.97);
      }

      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.04);
      }
    }

    .chart-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-d);
      font-size: calc(11px * var(--fs));
      letter-spacing: .34em;
      color: #a08a60;
      margin-bottom: 2px;
      position: relative;
      z-index: 2;
      text-shadow: 0 0 18px rgba(176, 141, 79, .4);
    }

    .chart-title::before,
    .chart-title::after {
      content: '';
      width: 30px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(176, 141, 79, .75));
    }

    .chart-title::after {
      background: linear-gradient(90deg, rgba(176, 141, 79, .75), transparent);
    }

    /* ---- 五维星盘（雷达图） ---- */
    .radar-box {
      position: relative;
      z-index: 2;
      width: min(384px, 100%);
      aspect-ratio: 320 / 300;
    }

    .radar {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .r-ring {
      fill: none;
      stroke: rgba(176, 141, 79, .22);
      stroke-width: 1;
    }

    .r-ring.mid {
      stroke: rgba(176, 141, 79, .13);
    }

    .r-spoke {
      stroke: rgba(176, 141, 79, .26);
      stroke-width: 1;
    }

    .r-tick {
      stroke: rgba(176, 141, 79, .5);
      stroke-width: 1;
    }

    .r-poly {
      fill: rgba(201, 168, 106, .34);
      stroke: var(--brass-l);
      stroke-width: 1.6;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 10px rgba(232, 211, 162, .3));
    }

    .r-dot {
      fill: #fff6e0;
      stroke: var(--brass-l);
      stroke-width: 1.4;
    }

    .r-req {
      fill: rgba(160, 92, 74, .09);
      stroke: rgba(198, 122, 100, .85);
      stroke-width: 1.3;
      stroke-dasharray: 5 4;
      stroke-linejoin: round;
    }

    .r-gap {
      stroke: rgba(214, 108, 88, .95);
      stroke-width: 2.4;
      stroke-linecap: round;
      filter: drop-shadow(0 0 6px rgba(214, 108, 88, .55));
    }

    .radar-legend {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 2px;
      font-family: var(--font-d);
      font-size: calc(10.5px * var(--fs));
      letter-spacing: .2em;
      color: #9d8a64;
    }

    .radar-legend span {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .radar-legend span::before {
      content: '';
      width: 18px;
      height: 0;
      border-top: 2px solid var(--brass-l);
    }

    .radar-legend .rl-b::before {
      border-top: 2px dashed rgba(198, 122, 100, .9);
    }

    .r-lab {
      font-family: var(--font-t);
      font-size: 12.5px;
      letter-spacing: .1em;
      fill: #b09a6e;
      transition: fill .3s;
    }

    .r-name {
      font-family: var(--font-t);
      letter-spacing: .1em;
    }

    .r-val {
      font-family: var(--font-d);
      font-size: 12px;
      font-weight: 700;
      fill: #cbb083;
    }

    .r-lab.bad .r-name,
    .r-lab.bad .r-val {
      fill: #d0705f;
    }

    .r-lab.flash .r-name,
    .r-lab.flash .r-val {
      fill: #fff8e2;
    }

    .col-chart {
      position: relative;
    }

    .pas-line {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -16px;
      text-align: center;
      font-size: calc(9px * var(--fs));
      letter-spacing: .06em;
      color: #8f7a52;
      opacity: .92;
      pointer-events: none;
    }

    .c-kind {
      font-size: calc(9.5px * var(--fs));
      letter-spacing: .14em;
      color: #8d7550;
    }

    .c-kind.m {
      color: #8a4f18;
      font-weight: 600;
    }

    /* ---- 赛事转盘 ---- */
    .col-match {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-left: 20px;
      border-left: 1px solid rgba(109, 83, 39, .3);
      min-width: 0;
    }

    .m-head {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .m-ico {
      font-size: calc(11px * var(--fs));
      line-height: 1.6;
      color: var(--brass);
      text-shadow: 0 0 10px rgba(176, 141, 79, .85);
    }

    .m-title {
      font-family: var(--font-d);
      font-size: calc(13.5px * var(--fs));
      letter-spacing: .04em;
      color: var(--brass-l);
      line-height: 1.35;
    }

    .m-when {
      font-size: calc(10px * var(--fs));
      letter-spacing: .18em;
      color: #a89268;
      margin-top: 3px;
    }

    .dial {
      position: relative;
      width: 100%;
      margin-top: 4px;
    }

    .dial svg {
      display: block;
      width: 100%;
      max-width: 216px;
      margin: 0 auto;
      height: auto;
    }

    .d-bg {
      fill: none;
      stroke: #191107;
      stroke-width: 9;
      stroke-linecap: round;
    }

    .d-arc {
      fill: none;
      stroke: var(--gc);
      stroke-width: 7;
      stroke-linecap: round;
      filter: drop-shadow(0 0 7px var(--gc));
      animation: arcIn 1s cubic-bezier(.2, .9, .3, 1) both;
    }

    @keyframes arcIn {
      from {
        stroke-dashoffset: 195;
      }
    }

    .d-tick {
      stroke: rgba(176, 141, 79, .42);
      stroke-width: 1;
    }

    .d-bead {
      filter: drop-shadow(0 0 8px currentColor);
    }

    .d-num {
      font-family: var(--font-d);
      font-size: calc(29px * var(--fs));
      font-weight: 800;
      fill: var(--gc);
      filter: drop-shadow(0 0 12px color-mix(in srgb, var(--gc) 55%, transparent));
    }

    .d-pct {
      font-size: calc(13px * var(--fs));
      fill: var(--gc);
      opacity: .85;
    }

    .dial-cap {
      text-align: center;
      font-size: calc(10px * var(--fs));
      letter-spacing: .34em;
      color: #a08a60;
      margin-top: -4px;
    }

    .m-reqs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
      font-size: calc(10.5px * var(--fs));
      letter-spacing: .02em;
      color: #b5a077;
      line-height: 1.6;
    }

    .m-req.ok {
      color: #a9c99b;
    }

    .m-req.no {
      color: #c67a68;
    }

    /* ================= 底部：手牌 / 对话（互斥） ================= */
    .dock {
      position: relative;
      z-index: 20;
      flex: 0 0 var(--dockH);
      height: var(--dockH);
      border-top: 1px solid #3a2c18;
      background: linear-gradient(#080604, #050403);
    }

    .dock::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(176, 141, 79, .45), transparent);
    }

    .layer {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      transition: opacity .38s ease, visibility .38s;
    }

    .layer.on {
      opacity: 1;
      visibility: visible;
    }

    /* ---- 手牌层 ---- */
    .hand-layer::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 120%, rgba(176, 141, 79, .10), transparent 62%);
      pointer-events: none;
    }

    #hand {
      position: absolute;
      inset: 0;
    }

    .card-wrap {
      position: absolute;
      left: 50%;
      bottom: 44px;
      width: var(--cw);
      height: var(--ch);
      margin-left: calc(var(--cw) / -2);
      transform-origin: 50% 100%;
      transform: translate3d(var(--tx, 0px), var(--ty, 0px), 0) rotate(var(--rot, 0deg));
      transition: transform .46s cubic-bezier(.22, .9, .28, 1.06);
      z-index: var(--z, 1);
      cursor: pointer;
      will-change: transform;
      pointer-events: auto;
    }

    .card-wrap:hover {
      z-index: 120;
    }

    .card-wrap.sel {
      z-index: 130;
    }

    .card {
      position: absolute;
      inset: 0;
      border-radius: 5px;
      background: linear-gradient(157deg, #efe4cc 0%, #ddceb1 38%, #cfbc99 100%);
      box-shadow:
        0 1px 0 #f7efdc inset,
        0 0 0 1px #6d5327,
        0 2px 0 #b9a482,
        0 3px 0 #9d8763,
        0 4px 0 #7c6845,
        0 5px 0 #5c4b2f,
        0 6px 0 #3d2e17,
        0 14px 26px rgba(0, 0, 0, .75),
        0 26px 50px rgba(0, 0, 0, .5);
      transition: transform .3s cubic-bezier(.2, .9, .3, 1.1), box-shadow .3s, filter .3s;
      overflow: hidden;
      color: var(--ink);
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 5px;
      border: 1px solid rgba(61, 46, 23, .55);
      pointer-events: none;
      z-index: 3;
    }

    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 12%, rgba(255, 255, 255, .5), transparent 40%),
        repeating-linear-gradient(115deg, rgba(120, 95, 55, .05) 0 1px, transparent 1px 4px);
      mix-blend-mode: multiply;
      opacity: .55;
      z-index: 4;
    }

    .card-wrap:hover .card {
      transform: translateY(-15px);
      box-shadow:
        0 1px 0 #f7efdc inset,
        0 0 0 1px var(--brass),
        0 2px 0 #b9a482,
        0 3px 0 #9d8763,
        0 4px 0 #7c6845,
        0 5px 0 #5c4b2f,
        0 6px 0 #3d2e17,
        0 22px 34px rgba(0, 0, 0, .8),
        0 0 34px rgba(176, 141, 79, .28);
    }

    .card-wrap.sel .card {
      transform: translateY(-6px) scale(1.045);
      box-shadow:
        0 1px 0 #fff8e6 inset,
        0 0 0 2px var(--brass-l),
        0 2px 0 #cbb489,
        0 3px 0 #ab9268,
        0 4px 0 #856f4a,
        0 5px 0 #5c4b2f,
        0 6px 0 #3d2e17,
        0 26px 44px rgba(0, 0, 0, .85),
        0 0 46px rgba(232, 211, 162, .5);
      filter: brightness(1.04) saturate(1.05);
    }

    .card-wrap.sel .card::before {
      border-color: rgba(109, 83, 39, .9);
      box-shadow: inset 0 0 0 3px rgba(232, 211, 162, .35);
    }

    .card-wrap.dim {
      filter: brightness(.55) saturate(.6);
    }

    .card-face {
      position: absolute;
      inset: 0;
      padding: 14px 15px 12px;
      display: flex;
      flex-direction: column;
      z-index: 2;
    }

    /* ---- 极简卡面 ---- */
    .c-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(61, 46, 23, .26);
    }

    .c-badges {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .c-badges i {
      font-family: var(--font-d);
      font-style: normal;
      font-size: calc(9.5px * var(--fs));
      letter-spacing: .02em;
      line-height: 1;
      padding: 2px 4px;
      color: #5f4d2e;
      border: 1px solid rgba(61, 46, 23, .3);
      background: rgba(255, 250, 238, .38);
      white-space: nowrap;
    }

    .c-badges i.plus {
      color: #3f6b3a;
      border-color: rgba(63, 107, 58, .38);
    }

    .c-bot {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px dotted rgba(61, 46, 23, .28);
    }

    .c-bot .c-ar {
      margin-left: auto;
      font-family: var(--font-d);
      font-size: calc(15px * var(--fs));
      color: #6b5220;
    }

    .c-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: calc(10px * var(--fs));
      letter-spacing: .12em;
      color: #6b5836;
      padding-bottom: 7px;
      border-bottom: 1px solid rgba(61, 46, 23, .28);
    }

    .c-mod {
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
      color: var(--mc);
    }

    .c-mod i {
      font-style: normal;
      font-size: calc(12px * var(--fs));
      font-family: var(--font-d);
    }

    .c-tier {
      font-family: var(--font-d);
      font-size: calc(10px * var(--fs));
      letter-spacing: .08em;
      padding: 1px 6px;
      border: 1px solid rgba(61, 46, 23, .4);
      color: #5f4d2e;
    }

    .c-sigil {
      position: absolute;
      left: 50%;
      top: 54%;
      transform: translate(-50%, -50%);
      font-family: var(--font-d);
      font-size: calc(108px * var(--fs));
      line-height: 1;
      color: var(--mc);
      opacity: .07;
      pointer-events: none;
      z-index: 1;
    }

    .c-title {
      font-family: var(--font-t);
      font-size: calc(15.5px * var(--fs));
      font-weight: 700;
      line-height: 1.34;
      color: #2a1d10;
      margin-top: 9px;
      letter-spacing: .02em;
      text-wrap: balance;
      text-shadow: 0 1px 0 rgba(255, 255, 255, .4);
      position: relative;
      z-index: 2;
    }

    .c-rule {
      width: 38px;
      height: 1px;
      margin: 8px 0 9px;
      background: linear-gradient(90deg, var(--mc), transparent);
    }

    .c-blurb {
      font-size: calc(11.5px * var(--fs));
      line-height: 1.68;
      color: #4e3d24;
      flex: 0 0 auto;
      min-height: 0;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
    }

    .c-flavor {
      font-family: var(--font-t);
      font-size: calc(11.5px * var(--fs));
      line-height: 1.95;
      color: #6b5730;
      font-style: italic;
      margin: 12px 0 0;
      padding: 0 2px;
      text-align: center;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 0 1 auto;
    }

    .c-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: calc(10px * var(--fs));
      letter-spacing: .16em;
      color: #9c855c;
    }

    .c-seal {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      border: 1px solid rgba(61, 46, 23, .5);
      background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--mc) 70%, #fff), var(--mc));
      box-shadow: inset 0 0 4px rgba(0, 0, 0, .5);
      opacity: .8;
    }

    /* 牌库 */
    .deck {
      position: absolute;
      left: 34px;
      bottom: 26px;
      width: 74px;
      height: 106px;
      cursor: default;
    }

    .deck i {
      position: absolute;
      inset: 0;
      border-radius: 4px;
      background: linear-gradient(150deg, #3a2c18, #16100a);
      border: 1px solid #5a4626;
      box-shadow: 0 6px 14px rgba(0, 0, 0, .7);
    }

    .deck i:nth-child(1) {
      transform: translate(-4px, -4px);
      opacity: .5;
    }

    .deck i:nth-child(2) {
      transform: translate(-2px, -2px);
      opacity: .75;
    }

    .deck i:nth-child(3) {
      display: grid;
      place-items: center;
      font-family: var(--font-d);
      font-size: calc(20px * var(--fs));
      color: rgba(176, 141, 79, .5);
    }

    .deck-meta {
      position: absolute;
      left: 34px;
      bottom: 4px;
      font-size: calc(10px * var(--fs));
      letter-spacing: .16em;
      color: #6b5a3c;
      white-space: nowrap;
    }

    /* 按钮组 */
    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      pointer-events: auto;
    }

    .btn {
      position: relative;
      min-width: 132px;
      padding: 10px 20px;
      font-family: var(--font-t);
      font-size: calc(14px * var(--fs));
      font-weight: 600;
      letter-spacing: .16em;
      border: 1px solid var(--brass-d);
      background: linear-gradient(#1c1509, #0a0705);
      color: #a48d63;
      transition: .28s;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 3px;
      border: 1px solid rgba(176, 141, 79, .18);
      pointer-events: none;
      transition: .28s;
    }

    .btn:disabled {
      opacity: .34;
      cursor: not-allowed;
      filter: grayscale(.5);
    }

    .btn-gold {
      color: #241a0c;
      background: linear-gradient(168deg, #f2e0b4, #cbaa6a 45%, #a4823f);
      border-color: #f6e8c4;
      text-shadow: 0 1px 0 rgba(255, 255, 255, .45);
      box-shadow: 0 6px 20px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .5);
    }

    .btn-gold::before {
      border-color: rgba(90, 66, 24, .35);
    }

    .btn-gold:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(176, 141, 79, .4), inset 0 1px 0 rgba(255, 255, 255, .6);
    }

    .btn-ghost:not(:disabled):hover {
      color: var(--brass-l);
      border-color: var(--brass);
      box-shadow: 0 0 20px rgba(176, 141, 79, .25);
    }

    .btn.pulse {
      animation: btnPulse 1.6s ease-in-out infinite;
    }

    @keyframes btnPulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(232, 211, 162, .5);
      }

      50% {
        box-shadow: 0 0 0 7px rgba(232, 211, 162, 0);
      }
    }

    .dock-info {
      position: absolute;
      left: 128px;
      bottom: 26px;
      font-size: calc(10px * var(--fs));
      letter-spacing: .16em;
      color: #7a6845;
      line-height: 1.9;
      z-index: 140;
    }

    .dock-hint {
      position: absolute;
      left: 128px;
      bottom: 100px;
      max-width: 232px;
      font-size: calc(10.5px * var(--fs));
      letter-spacing: .08em;
      color: #c0675a;
      line-height: 1.6;
      z-index: 140;
      text-shadow: 0 2px 8px #000;
    }

    .dock-hint.gold {
      color: #d9c193;
    }

    .dock-hint.gold b {
      font-family: var(--font-d);
      font-weight: 700;
      color: var(--brass-l);
    }

    /* ---- 教练亲授牌：深底浅字，一眼区分 ---- */
    .card.card-coach {
      background: linear-gradient(158deg, #2c2214 0%, #171009 52%, #0a0705 100%);
      box-shadow:
        0 1px 0 rgba(232, 211, 162, .22) inset,
        0 0 0 1px #8a6a33,
        0 2px 0 #3a2c18,
        0 3px 0 #2a2013,
        0 5px 0 #14100a,
        0 14px 30px rgba(0, 0, 0, .8),
        0 0 30px rgba(176, 141, 79, .18);
      color: #ecdfc2;
    }

    .card.card-coach::before {
      border-color: rgba(232, 211, 162, .38);
    }

    .card.card-coach::after {
      background:
        radial-gradient(circle at 22% 10%, rgba(232, 211, 162, .16), transparent 46%),
        repeating-linear-gradient(115deg, rgba(232, 211, 162, .03) 0 1px, transparent 1px 4px);
      mix-blend-mode: normal;
      opacity: .9;
    }

    .card.card-coach .c-top {
      border-bottom-color: rgba(232, 211, 162, .24);
    }

    .card.card-coach .c-mod {
      color: #e6c98e;
    }

    .card.card-coach .c-title {
      color: #f6ecd4;
      text-shadow: 0 0 18px rgba(232, 211, 162, .28);
    }

    .card.card-coach .c-flavor {
      color: #b3a07a;
    }

    .card.card-coach .c-bot {
      border-top-color: rgba(232, 211, 162, .22);
    }

    .card.card-coach .c-kind {
      color: #b39d74;
    }

    .card.card-coach .c-badges i {
      color: #e6c98e;
      border-color: rgba(232, 211, 162, .38);
      background: rgba(232, 211, 162, .07);
    }

    .card.card-coach .c-ar {
      color: #e6c98e;
    }

    .card-wrap.coach-card .card::before {
      box-shadow: inset 0 0 0 3px rgba(232, 211, 162, .1);
    }

    .card-wrap.locked .card {
      filter: grayscale(.55) brightness(.72);
    }

    .card-wrap.nofit .card {
      box-shadow: 0 0 0 2px rgba(192, 103, 90, .85), 0 18px 40px rgba(0, 0, 0, .7);
    }

    .c-nofit {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      text-align: center;
      font-family: var(--font-d);
      font-size: calc(11px * var(--fs));
      letter-spacing: .24em;
      color: #c05a48;
      text-shadow: 0 1px 10px rgba(0, 0, 0, .55);
      opacity: 0;
      transition: opacity .25s;
      pointer-events: none;
      z-index: 6;
    }

    .card-wrap.nofit .c-nofit {
      opacity: 1;
      animation: nofitPulse 1.1s ease-in-out infinite;
    }

    @keyframes nofitPulse {

      0%,
      100% {
        opacity: .65;
      }

      50% {
        opacity: 1;
      }
    }

    .card-wrap.locked .c-pre {
      color: #8d4a38;
    }

    .dock-info b {
      color: var(--brass-l);
      font-family: var(--font-d);
      font-weight: 700;
    }


    /* ================= 底栏：时间线 + 精力（极简） ================= */
    .dock-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 10px 26px 0;
      z-index: 150;
      pointer-events: none;
    }

    .cal-bar {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 13px 26px;
      border: 1px solid rgba(176, 141, 79, .26);
      background: linear-gradient(rgba(18, 12, 7, .95), rgba(7, 5, 3, .95));
      box-shadow: 0 4px 18px rgba(0, 0, 0, .55), inset 0 0 22px rgba(176, 141, 79, .05);
      white-space: nowrap;
    }

    .tl-label {
      font-family: var(--font-d);
      font-size: calc(11.5px * var(--fs));
      letter-spacing: .26em;
      color: #8f7a54;
    }

    .tl-dots {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .tl-dots i {
      width: 10px;
      height: 13px;
      transform: rotate(45deg);
      border: 1px solid #4a3a20;
      background: #120d07;
      transition: background .28s, border-color .28s, box-shadow .28s;
    }

    .tl-dots i.on {
      background: linear-gradient(135deg, #f2e0b4, #a4823f);
      border-color: var(--brass-l);
      box-shadow: 0 0 8px rgba(232, 211, 162, .5);
    }

    .tl-dots i.ghost {
      border-color: rgba(232, 211, 162, .78);
      border-style: dashed;
      background: rgba(232, 211, 162, .12);
      animation: cellBreath 1.5s ease-in-out infinite;
    }

    .tl-dots i.link {
      border-color: rgba(186, 140, 206, .85);
      border-style: dashed;
      background: rgba(150, 105, 175, .24);
      animation: cellBreath 1.5s ease-in-out infinite;
    }

    .tl-dots i.bad {
      border-color: rgba(192, 103, 90, .85);
      background: rgba(192, 103, 90, .18);
      animation: cellBreath 1s ease-in-out infinite;
    }

    /* 被校外事务占掉的格子：斜纹占位 —— 不是他自己排的课 */
    .tl-dots i.out {
      background: repeating-linear-gradient(135deg, #5c4b2e 0 2px, #241b10 2px 4px);
      border-color: #6a5734;
      box-shadow: none;
    }

    @keyframes cellBreath {

      0%,
      100% {
        opacity: .45;
      }

      50% {
        opacity: 1;
      }
    }

    .tl-left {
      font-size: calc(10px * var(--fs));
      letter-spacing: .06em;
      color: #8a7653;
    }

    .tl-left b {
      font-family: var(--font-d);
      font-weight: 700;
      font-size: calc(11px * var(--fs));
      letter-spacing: 0;
      color: var(--brass-l);
    }

    .tl-en {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-left: 16px;
      border-left: 1px solid rgba(176, 141, 79, .24);
      font-size: calc(11.5px * var(--fs));
      letter-spacing: .06em;
      color: #8a7653;
    }

    .tl-en em {
      font-style: normal;
      font-size: calc(11px * var(--fs));
      color: #c8ac74;
    }

    .tl-en b {
      font-family: var(--font-d);
      font-weight: 700;
      font-size: calc(13px * var(--fs));
      letter-spacing: 0;
      color: var(--brass-l);
      transition: color .3s;
    }

    .tl-en b.bad {
      color: #d0705f;
      text-shadow: 0 0 10px rgba(192, 103, 90, .55);
    }

    .tl-en i {
      font-style: normal;
      color: #6f5c3c;
    }

    .tl-note {
      padding-left: 16px;
      border-left: 1px solid rgba(176, 141, 79, .24);
      font-size: calc(11.5px * var(--fs));
      letter-spacing: .05em;
      color: #6f5c3c;
    }

    .tl-note b {
      font-family: var(--font-d);
      font-weight: 700;
      font-size: calc(13px * var(--fs));
      letter-spacing: 0;
      color: #e2c795;
    }

    .tl-note .bad {
      color: #d0705f;
    }

    .tl-note .ok {
      color: #b9a27a;
    }

    .tl-warn {
      color: #d8916a;
      font-size: calc(11px * var(--fs));
      letter-spacing: .06em;
    }

    /* 卡面：时长 / 主涨 / 前置 / 掌握度 */
    .c-meta {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 7px;
      font-size: calc(9.5px * var(--fs));
      letter-spacing: .02em;
      position: relative;
      z-index: 2;
      white-space: nowrap;
    }

    .c-dur {
      padding: 1px 4px;
      border: 1px solid rgba(61, 46, 23, .35);
      color: #5f4d2e;
      background: rgba(255, 250, 238, .35);
      white-space: nowrap;
    }

    .c-en {
      padding: 1px 4px;
      border: 1px solid rgba(61, 46, 23, .32);
      color: #6b5220;
      background: rgba(255, 250, 238, .3);
      white-space: nowrap;
    }

    .c-en.plus {
      color: #3f6b3a;
      border-color: rgba(63, 107, 58, .4);
    }

    .c-ar {
      font-family: var(--font-d);
      font-size: calc(11px * var(--fs));
      letter-spacing: .06em;
      color: #7a6538;
    }

    .c-ar.up2 {
      color: #8a4f18;
    }

    .c-pre {
      color: #a35a4e;
      font-size: calc(9px * var(--fs));
      white-space: nowrap;
      letter-spacing: .02em;
      border-bottom: 1px dotted rgba(163, 90, 78, .6);
    }

    .c-mast {
      display: flex;
      gap: 3px;
      align-items: center;
    }

    .c-mast i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(61, 46, 23, .2);
      transition: .3s;
    }

    .c-mast i.on {
      background: var(--mc);
      box-shadow: 0 0 5px color-mix(in srgb, var(--mc) 60%, transparent);
    }

    /* 胜算档位 */
    .d-tier {
      font-family: var(--font-d);
      font-size: calc(12px * var(--fs));
      letter-spacing: .16em;
      fill: #f0dcb2;
    }

    .d-sub {
      font-family: var(--font-t);
      font-size: calc(9px * var(--fs));
      letter-spacing: .18em;
      fill: #8a7653;
    }

    .m-review {
      margin-top: 9px;
      width: 100%;
      padding: 6px 8px;
      font-family: var(--font-t);
      font-size: calc(11px * var(--fs));
      letter-spacing: .14em;
      border: 1px dashed rgba(176, 141, 79, .45);
      color: #b5a077;
      background: rgba(176, 141, 79, .05);
      cursor: pointer;
      transition: .24s;
    }

    /* 可点的时候要看得出来：亮一档，轻微呼吸 */
    .m-review:not(:disabled) {
      color: #e2c996;
      border-color: rgba(196, 158, 92, .72);
      background: rgba(176, 141, 79, .1);
      animation: revBreath 3.2s ease-in-out infinite;
    }

    .m-review:hover:not(:disabled) {
      color: var(--brass-l);
      border-color: var(--brass);
      background: rgba(176, 141, 79, .18);
      animation: none;
      box-shadow: 0 0 14px rgba(232, 211, 162, .25);
    }

    @keyframes revBreath {

      0%,
      100% {
        box-shadow: 0 0 0 rgba(232, 211, 162, 0);
      }

      50% {
        box-shadow: 0 0 12px rgba(232, 211, 162, .2);
      }
    }

    .m-review:disabled {
      opacity: .3;
      cursor: not-allowed;
    }

    .m-review.on {
      border-style: solid;
      color: #9ac48f;
      border-color: #5f7f57;
      background: rgba(120, 160, 110, .1);
    }

    /* 提示条 */
    .toast {
      position: fixed;
      left: 50%;
      top: 21%;
      transform: translate(-50%, -10px);
      padding: 10px 24px;
      font-size: calc(12.5px * var(--fs));
      letter-spacing: .14em;
      color: #e6cf9c;
      background: rgba(10, 7, 4, .95);
      border: 1px solid rgba(176, 141, 79, .5);
      box-shadow: 0 16px 44px rgba(0, 0, 0, .85), inset 0 0 0 1px rgba(0, 0, 0, .8);
      opacity: 0;
      transition: opacity .22s, transform .22s;
      z-index: 330;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.on {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .ts-btn.ghost {
      margin-top: 10px;
      font-size: calc(12px * var(--fs));
      padding: 9px 26px;
      color: #b5a077;
      background: transparent;
      border-color: rgba(176, 141, 79, .45);
    }

    .ts-btn.ghost:hover {
      color: var(--brass-l);
      border-color: var(--brass);
    }


    /* ---- 月度事件 / 假期：抽牌层 ---- */
    .draft-layer {
      position: fixed;
      inset: 0;
      z-index: 260;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: radial-gradient(circle at 50% 44%, rgba(38, 27, 12, .92), rgba(4, 3, 2, .985) 68%);
      backdrop-filter: blur(4px) saturate(.8);
      opacity: 0;
      transition: opacity .35s;
    }

    .draft-layer.on {
      opacity: 1;
    }

    .draft-head {
      font-family: var(--font-d);
      font-size: calc(18px * var(--fs));
      letter-spacing: .32em;
      color: var(--brass-l);
      text-align: center;
      text-shadow: 0 0 30px rgba(176, 141, 79, .35);
    }

    .draft-head em {
      display: block;
      font-style: normal;
      font-size: calc(10px * var(--fs));
      letter-spacing: .24em;
      color: #8a7653;
      margin-top: 8px;
    }

    .draft-row {
      display: flex;
      gap: 30px;
      perspective: 1800px;
      perspective-origin: 50% 40%;
    }

    /* 事件牌：与手牌同一套纸面，只是背面朝上 */
    .draft-card {
      position: relative;
      width: 214px;
      height: 302px;
      cursor: pointer;
      transform-style: preserve-3d;
      transform: translateY(var(--ty, 0px)) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(var(--sc, 1));
      transition: transform .5s cubic-bezier(.2, .85, .25, 1), opacity .5s, filter .5s;
      animation: dealIn .85s cubic-bezier(.16, .88, .24, 1.02) backwards;
      will-change: transform;
    }

    .draft-card:nth-child(1) {
      animation-delay: .06s;
    }

    .draft-card:nth-child(2) {
      animation-delay: .21s;
    }

    .draft-card:nth-child(3) {
      animation-delay: .36s;
    }

    /* 从下方依次飞入 */
    @keyframes dealIn {
      0% {
        opacity: 0;
        transform: translate3d(0, 240px, -420px) rotateX(38deg) rotateZ(-4deg) scale(.86);
      }

      62% {
        opacity: 1;
      }

      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) rotateX(0) rotateZ(0) scale(1);
      }
    }

    .dc-inner {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform 1s cubic-bezier(.3, .86, .2, 1);
    }

    .draft-card.flip .dc-inner {
      transform: rotateY(180deg);
    }

    .dc-back,
    .dc-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 5px;
      overflow: hidden;
    }

    /* ---- 牌背 ---- */
    .dc-back {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: var(--brass);
      background:
        repeating-linear-gradient(45deg, #1b1309, #1b1309 6px, #140e07 6px, #140e07 12px);
      box-shadow:
        0 1px 0 rgba(232, 211, 162, .18) inset,
        0 0 0 1px #6d5327,
        0 2px 0 #3a2c18,
        0 4px 0 #241b10,
        0 14px 30px rgba(0, 0, 0, .8);
    }

    .dc-back::before {
      content: '';
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(176, 141, 79, .38);
      pointer-events: none;
    }

    .dc-back::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at var(--mx, 50%) var(--my, 40%), rgba(232, 211, 162, .28), transparent 54%);
      opacity: 0;
      transition: opacity .35s;
      pointer-events: none;
    }

    .draft-card:hover .dc-back::after {
      opacity: 1;
    }

    .dc-back span {
      font-family: var(--font-d);
      font-size: calc(44px * var(--fs));
      line-height: 1;
      opacity: .4;
      text-shadow: 0 0 30px rgba(176, 141, 79, .6);
    }

    .dc-back i {
      font-style: normal;
      font-size: calc(10px * var(--fs));
      letter-spacing: .32em;
      opacity: .6;
    }

    .draft-card:hover .dc-back {
      box-shadow:
        0 1px 0 rgba(232, 211, 162, .3) inset,
        0 0 0 1px var(--brass),
        0 2px 0 #4a3818,
        0 4px 0 #241b10,
        0 24px 46px rgba(0, 0, 0, .85),
        0 0 34px rgba(176, 141, 79, .28);
    }

    /* ---- 牌面：手牌同款纸面 ---- */
    .dc-face {
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      padding: 15px 16px 13px;
      color: var(--ink);
      background: linear-gradient(157deg, #efe4cc 0%, #ddceb1 38%, #cfbc99 100%);
      box-shadow:
        0 1px 0 #f7efdc inset,
        0 0 0 1px #6d5327,
        0 2px 0 #b9a482,
        0 3px 0 #9d8763,
        0 4px 0 #7c6845,
        0 5px 0 #5c4b2f,
        0 6px 0 #3d2e17,
        0 14px 26px rgba(0, 0, 0, .75);
      transition: box-shadow .35s ease, filter .35s ease;
    }

    /* 已经翻开的卡（假期三选一）：悬浮时同样抬起、描金、发光 */
    .draft-card:hover .dc-face {
      filter: brightness(1.05);
      box-shadow:
        0 1px 0 #fff8e6 inset,
        0 0 0 1px var(--brass-l),
        0 2px 0 #cbb489,
        0 3px 0 #ab9268,
        0 4px 0 #856f4a,
        0 5px 0 #5c4b2f,
        0 6px 0 #3d2e17,
        0 26px 46px rgba(0, 0, 0, .85),
        0 0 46px rgba(232, 211, 162, .42);
    }

    .draft-card:hover .dc-sigil {
      opacity: .13;
      color: #8a6a34;
    }

    .draft-card:hover .dc-n {
      color: #7a3f1c;
    }

    .dc-face::before {
      content: '';
      position: absolute;
      inset: 5px;
      border: 1px solid rgba(61, 46, 23, .55);
      pointer-events: none;
      z-index: 3;
    }

    .dc-face::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 12%, rgba(255, 255, 255, .5), transparent 40%),
        repeating-linear-gradient(115deg, rgba(120, 95, 55, .05) 0 1px, transparent 1px 4px);
      mix-blend-mode: multiply;
      opacity: .55;
      z-index: 4;
    }

    .dc-sigil {
      position: absolute;
      left: 50%;
      top: 56%;
      transform: translate(-50%, -50%);
      font-family: var(--font-d);
      font-size: calc(112px * var(--fs));
      line-height: 1;
      color: #6d5327;
      opacity: .07;
      pointer-events: none;
      z-index: 1;
    }

    .dc-top {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(61, 46, 23, .26);
    }

    .dc-k {
      font-family: var(--font-d);
      font-size: calc(9.5px * var(--fs));
      letter-spacing: .18em;
      padding: 1px 7px;
      border: 1px solid currentColor;
    }

    .dc-k.good {
      color: #3f6b3a;
    }

    .dc-k.bad {
      color: #a4442f;
    }

    .dc-k.time {
      color: #8a6a1e;
    }

    .dc-k.special {
      color: #3f5f7a;
    }

    .dc-turn {
      font-family: var(--font-d);
      font-size: calc(9px * var(--fs));
      letter-spacing: .16em;
      color: #8d7550;
    }

    .dc-n {
      position: relative;
      z-index: 2;
      font-family: var(--font-t);
      font-size: calc(17px * var(--fs));
      font-weight: 700;
      letter-spacing: .08em;
      line-height: 1.4;
      color: #2a1d10;
      margin-top: 11px;
      text-wrap: balance;
      text-shadow: 0 1px 0 rgba(255, 255, 255, .4);
    }

    .dc-t {
      position: relative;
      z-index: 2;
      font-family: var(--font-t);
      font-size: calc(11.5px * var(--fs));
      line-height: 1.9;
      color: #6b5730;
      margin-top: 9px;
      display: -webkit-box;
      -webkit-line-clamp: 5;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .dc-bot {
      position: relative;
      z-index: 2;
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px dotted rgba(61, 46, 23, .28);
    }

    .dc-e {
      font-family: var(--font-d);
      font-size: calc(10px * var(--fs));
      line-height: 1.75;
      letter-spacing: .04em;
      color: #8a6a2a;
    }

    /* 选中：抬起、发光、其余退场 */
    .draft-card.chosen {
      --sc: 1.09;
      --ty: -22px;
      z-index: 5;
    }

    .draft-card.chosen .dc-face {
      box-shadow:
        0 1px 0 #fff8e6 inset,
        0 0 0 2px var(--brass-l),
        0 2px 0 #cbb489,
        0 3px 0 #ab9268,
        0 4px 0 #856f4a,
        0 5px 0 #5c4b2f,
        0 6px 0 #3d2e17,
        0 26px 46px rgba(0, 0, 0, .85),
        0 0 52px rgba(232, 211, 162, .55);
      animation: chosenGlow 1.7s ease-in-out infinite;
    }

    @keyframes chosenGlow {

      0%,
      100% {
        filter: brightness(1.02);
      }

      50% {
        filter: brightness(1.1);
      }
    }

    .draft-card.faded {
      --sc: .92;
      --ty: 22px;
      opacity: .34;
      filter: blur(.9px) grayscale(.35) brightness(.9);
    }

    .draft-foot {
      min-height: 30px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: calc(11px * var(--fs));
      letter-spacing: .22em;
      color: #8a7653;
      transition: opacity .3s;
    }

    .draft-picked {
      font-family: var(--font-t);
      font-size: calc(13px * var(--fs));
      letter-spacing: .2em;
      color: #e2c795;
      animation: goIn .3s ease both;
    }

    /* 确认按钮：黄铜实心，别再让玩家对着一颗默认灰按钮发呆 */
    .draft-go {
      padding: 9px 28px;
      font-family: var(--font-t);
      font-size: calc(12px * var(--fs));
      letter-spacing: .26em;
      text-indent: .26em;
      color: #1a1208;
      background: linear-gradient(#efdcb0, #b08d4f);
      border: 1px solid #8a6a34;
      box-shadow: 0 2px 0 #5c4b2f, 0 8px 20px rgba(0, 0, 0, .55);
      cursor: pointer;
      /* 只淡入，不用 transform 动画，否则会压住 hover 的位移 */
      animation: fadeIn .3s ease both;
      transition: filter .18s, transform .18s;
    }

    .draft-go:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
    }

    .draft-go:active {
      transform: translateY(1px);
      box-shadow: 0 1px 0 #5c4b2f;
    }

    @keyframes goIn {
      from {
        opacity: 0;
        transform: translateY(7px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    /* 比赛面板：未达标提示 */
    .m-req.edge {
      color: #e3bd76;
      border-color: rgba(227, 189, 118, .45);
    }

    .m-warn {
      margin-top: 8px;
      padding-left: 7px;
      border-left: 2px solid rgba(192, 103, 90, .65);
      font-size: calc(10px * var(--fs));
      line-height: 1.7;
      letter-spacing: .04em;
      color: #c0675a;
    }

    .m-buff {
      margin-top: 6px;
      font-size: calc(10px * var(--fs));
      letter-spacing: .1em;
      color: #e3bd76;
    }

    .m-calm {
      margin-top: 8px;
      padding-left: 7px;
      border-left: 2px solid rgba(176, 141, 79, .35);
      font-size: calc(10px * var(--fs));
      line-height: 1.7;
      letter-spacing: .04em;
      color: #8a7653;
    }

    /* 抉择按钮 */
    .choices {
      position: absolute;
      left: 44px;
      right: 44px;
      bottom: 18px;
      display: flex;
      gap: 12px;
      z-index: 5;
    }

    .choice-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 11px 16px;
      text-align: left;
      border: 1px solid rgba(176, 141, 79, .45);
      background: linear-gradient(#1a1309, #0b0805);
      color: #d9c9a8;
      cursor: pointer;
      transition: .24s;
    }

    .choice-btn b {
      font-family: var(--font-t);
      font-size: calc(13.5px * var(--fs));
      letter-spacing: .1em;
      color: var(--brass-l);
    }

    .choice-btn span {
      font-size: calc(10.5px * var(--fs));
      letter-spacing: .06em;
      color: #8a7653;
    }

    .choice-btn:hover {
      border-color: var(--brass);
      background: linear-gradient(#2a1f10, #120c07);
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(0, 0, 0, .7), 0 0 22px rgba(176, 141, 79, .18);
    }

    /* 竖排选项（救援对话，跟在正文后面） */
    .choices.inline {
      position: static;
      left: auto;
      right: auto;
      bottom: auto;
      flex-direction: column;
      gap: 7px;
      margin-top: 15px;
    }

    .choices.inline .choice-btn {
      flex: none;
      padding: 8px 13px;
      gap: 2px;
    }

    .choices.inline .choice-btn b {
      font-size: calc(10px * var(--fs));
      letter-spacing: .2em;
      color: #8a7653;
    }

    .choices.inline .choice-btn span {
      font-size: calc(10.5px * var(--fs));
      line-height: 1.75;
      color: #cbb98f;
      letter-spacing: .02em;
    }

    /* 结局回顾 */
    .review h5 {
      font-family: var(--font-d);
      font-size: calc(12px * var(--fs));
      letter-spacing: .3em;
      color: var(--brass);
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(176, 141, 79, .28);
      padding-bottom: 8px;
    }

    .review ul {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
    }

    .review li {
      font-size: calc(11.5px * var(--fs));
      letter-spacing: .06em;
      padding: 2px 10px;
      border: 1px solid rgba(176, 141, 79, .22);
      color: #a89570;
    }

    .review li.rv-win {
      color: #a9c99b;
      border-color: rgba(120, 160, 110, .45);
    }

    .review li.rv-lose {
      color: #c08573;
      border-color: rgba(160, 90, 74, .4);
    }

    .review li.rv-choice {
      color: #d8bd86;
      border-color: rgba(216, 189, 134, .45);
    }

    .rv-tail {
      margin-top: 14px;
      font-size: calc(12.5px * var(--fs));
      line-height: 1.9;
      color: #b9a988;
      font-style: italic;
    }

    /* ---- ADV 层 ---- */
    .adv-layer {
      padding: 0 clamp(20px, 9vw, 150px);
      display: flex;
      align-items: center;
      padding-bottom: 8px;
    }

    .adv-box {
      position: relative;
      width: 100%;
      min-height: 208px;
      padding: 28px 44px 32px;
      border: 1px solid #4a3a1e;
      background:
        linear-gradient(180deg, rgba(28, 21, 12, .97), rgba(10, 7, 4, .99));
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .9), inset 0 1px 0 rgba(176, 141, 79, .16), 0 24px 60px rgba(0, 0, 0, .9);
      cursor: pointer;
    }

    .adv-box::before,
    .adv-box::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      border: 1px solid var(--brass);
      opacity: .55;
    }

    .adv-box::before {
      top: 7px;
      left: 7px;
      border-right: 0;
      border-bottom: 0;
    }

    .adv-box::after {
      bottom: 7px;
      right: 7px;
      border-left: 0;
      border-top: 0;
    }

    .adv-speaker {
      position: absolute;
      top: -15px;
      left: 30px;
      padding: 5px 20px;
      font-family: var(--font-d);
      font-size: calc(12.5px * var(--fs));
      letter-spacing: .22em;
      color: var(--brass-l);
      background: linear-gradient(#2c2113, #120c07);
      border: 1px solid var(--brass-d);
      box-shadow: 0 6px 16px rgba(0, 0, 0, .8);
    }

    .adv-speaker.student {
      color: #cfe3c9;
      border-color: #4c6b4a;
      background: linear-gradient(#1b2a1a, #0a120a);
    }

    .adv-speaker.coach {
      color: #e6cf9c;
    }

    .adv-text {
      font-size: calc(15.5px * var(--fs));
      line-height: 2.05;
      letter-spacing: .06em;
      color: #ddd0b6;
      min-height: 96px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, .8);
      white-space: pre-wrap;
    }

    .adv-text .narr {
      color: #b9a988;
      font-style: italic;
    }

    .caret {
      display: inline-block;
      width: 2px;
      height: 17px;
      background: var(--brass-l);
      vertical-align: -3px;
      margin-left: 3px;
      animation: blink 1s steps(1) infinite;
      box-shadow: 0 0 10px var(--brass);
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    .adv-next {
      position: absolute;
      right: 28px;
      bottom: 14px;
      font-size: calc(11px * var(--fs));
      letter-spacing: .2em;
      color: #8a7653;
      opacity: 0;
      transition: opacity .3s;
      animation: bob 1.4s ease-in-out infinite;
    }

    .adv-next.show {
      opacity: .9;
    }

    @keyframes bob {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(4px);
      }
    }

    /* ================= 飘字 / 特效 ================= */
    #fx {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #float {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      transform: translateY(-14px);
      padding: 40px 70px;
      transition: transform .4s cubic-bezier(.2, .9, .3, 1);
    }

    #float.up {
      transform: translateY(-148px);
    }

    #float::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1160px;
      height: 440px;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at center, rgba(3, 2, 1, .97) 0%, rgba(3, 2, 1, .95) 34%, rgba(3, 2, 1, .82) 52%, rgba(3, 2, 1, .42) 70%, transparent 86%);
      filter: blur(14px);
      z-index: -1;
      animation: fadeIn .3s ease both;
    }

    #float:empty::before {
      display: none;
    }

    /* 退场：暗底与最后一行的淡出同一时刻开始、同一时刻结束，不会留下单独的一块阴影 */
    #float.out::before {
      animation: floatVeilOut var(--vo, .9s) ease forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    @keyframes floatVeilOut {
      from {
        opacity: 1
      }

      to {
        opacity: 0
      }
    }

    .fl-line {
      display: flex;
      align-items: baseline;
      gap: 12px;
      font-family: var(--font-d);
      font-size: calc(24px * var(--fs));
      font-weight: 700;
      letter-spacing: .1em;
      opacity: 0;
      animation: floatUp 2.4s cubic-bezier(.16, .8, .3, 1) forwards;
      text-shadow: 0 2px 2px rgba(0, 0, 0, .9);
    }

    .fl-line .g {
      font-size: calc(15px * var(--fs));
      opacity: .9;
    }

    .fl-line .n {
      font-family: var(--font-t);
      font-size: calc(15px * var(--fs));
      letter-spacing: .2em;
      opacity: .95;
      font-weight: 500;
    }

    .fl-line .v {
      font-size: calc(28px * var(--fs));
      font-weight: 800;
    }

    .fl-line.gain {
      color: var(--gain);
    }

    .fl-line.loss {
      color: var(--loss);
    }

    .fl-event {
      font-family: var(--font-t);
      font-size: calc(17px * var(--fs));
      font-weight: 600;
      letter-spacing: .3em;
      color: #f0dcb2;
      padding: 6px 24px;
      border-top: 1px solid rgba(176, 141, 79, .5);
      border-bottom: 1px solid rgba(176, 141, 79, .5);
      opacity: 0;
      animation: floatUp 2.4s cubic-bezier(.16, .8, .3, 1) forwards;
      text-shadow: 0 2px 2px rgba(0, 0, 0, .85);
      background: linear-gradient(90deg, transparent, rgba(176, 141, 79, .1), transparent);
    }

    .fl-syn {
      font-family: var(--font-d);
      font-size: calc(13px * var(--fs));
      letter-spacing: .28em;
      color: #d8efd2;
      text-shadow: 0 2px 2px rgba(0, 0, 0, .85);
      opacity: 0;
      animation: floatUp 2.4s cubic-bezier(.16, .8, .3, 1) forwards;
    }

    .fl-meta {
      font-family: var(--font-d);
      font-size: calc(13px * var(--fs));
      letter-spacing: .16em;
      color: #9d8a64;
      opacity: 0;
      animation: floatUp 2.4s cubic-bezier(.16, .8, .3, 1) forwards;
      text-shadow: 0 2px 2px rgba(0, 0, 0, .85);
    }

    .fl-meta b {
      font-weight: 700;
      color: #e2c795;
    }

    .fl-big {
      font-family: var(--font-t);
      font-size: calc(46px * var(--fs));
      font-weight: 700;
      letter-spacing: .36em;
      text-indent: .36em;
      opacity: 0;
      animation: floatUp 2.6s cubic-bezier(.16, .8, .3, 1) forwards;
    }

    .fl-big.gain {
      color: #f2dcaa;
      text-shadow: 0 0 40px rgba(232, 211, 162, .9), 0 0 90px rgba(176, 141, 79, .6);
    }

    .fl-big.loss {
      color: #c26a5c;
      text-shadow: 0 0 40px rgba(194, 106, 92, .8), 0 0 80px rgba(120, 40, 30, .6);
    }

    .fl-rule {
      font-size: calc(13px * var(--fs));
      letter-spacing: .14em;
      color: #cbb894;
      opacity: 0;
      animation: floatUp 2.6s cubic-bezier(.16, .8, .3, 1) forwards;
      text-shadow: 0 2px 10px #000;
    }

    @keyframes floatUp {
      0% {
        opacity: 0;
        transform: translateY(18px) scale(.94);
      }

      12% {
        opacity: 1;
        transform: translateY(0) scale(1.04);
      }

      22% {
        transform: translateY(-4px) scale(1);
      }

      52% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translateY(-30px) scale(.99);
      }
    }

    .burst {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 40px;
      height: 40px;
      margin: -20px 0 0 -20px;
      border-radius: 50%;
      border: 1px solid rgba(232, 211, 162, .7);
      animation: burst 900ms cubic-bezier(.2, .7, .3, 1) forwards;
    }

    @keyframes burst {
      0% {
        transform: scale(.2);
        opacity: .9;
      }

      100% {
        transform: scale(11);
        opacity: 0;
      }
    }

    /* 飞行卡牌层 */
    #fly {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 90;
    }

    #fly .flyer {
      position: fixed;
      background: none;
      box-shadow: none;
      transform-origin: 50% 50%;
    }

    #fly .flyer .card {
      pointer-events: none;
    }

    #fly .flyer .ft {
      font-size: calc(13px * var(--fs));
      color: #3a2a15;
      text-align: center;
      padding: 12px;
      line-height: 1.5;
      font-weight: 700;
    }

    /* 教练对话条（教程） */
    .coach {
      position: fixed;
      left: 50%;
      bottom: calc(var(--dockH) + 16px);
      width: min(780px, 90vw);
      z-index: 205;
      padding: 15px 30px 15px 96px;
      border: 1px solid #4a3a1e;
      background: linear-gradient(180deg, rgba(31, 23, 13, .975), rgba(10, 7, 4, .99));
      box-shadow:
        inset 0 0 0 1px rgba(0, 0, 0, .9),
        inset 0 1px 0 rgba(176, 141, 79, .2),
        0 20px 54px rgba(0, 0, 0, .92),
        0 0 70px rgba(0, 0, 0, .55);
      opacity: 0;
      transform: translate(-50%, 14px);
      pointer-events: none;
      transition: opacity .35s ease, transform .35s cubic-bezier(.2, .9, .3, 1);
    }

    .coach.on {
      opacity: 1;
      transform: translate(-50%, 0);
      pointer-events: auto;
      cursor: pointer;
    }

    .coach::before,
    .coach::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      border: 1px solid var(--brass);
      opacity: .55;
    }

    .coach::before {
      top: 6px;
      left: 6px;
      border-right: 0;
      border-bottom: 0;
    }

    .coach::after {
      bottom: 6px;
      right: 6px;
      border-left: 0;
      border-top: 0;
    }

    .coach-face {
      position: absolute;
      left: 24px;
      top: 50%;
      width: 52px;
      height: 52px;
      margin-top: -26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: var(--font-d);
      font-size: calc(20px * var(--fs));
      color: var(--brass-l);
      background: radial-gradient(circle at 38% 30%, #3a2c18, #0a0705 72%);
      border: 1px solid var(--brass-d);
      box-shadow: 0 0 0 3px #0a0705, 0 0 0 4px rgba(176, 141, 79, .35), 0 0 22px rgba(176, 141, 79, .3);
      text-shadow: 0 0 14px rgba(232, 211, 162, .7);
    }

    .coach-speaker {
      position: absolute;
      top: -13px;
      left: 84px;
      padding: 3px 18px;
      font-family: var(--font-d);
      font-size: calc(11px * var(--fs));
      letter-spacing: .24em;
      color: #e6cf9c;
      background: linear-gradient(#2c2113, #120c07);
      border: 1px solid var(--brass-d);
      box-shadow: 0 6px 16px rgba(0, 0, 0, .8);
    }

    .coach-text {
      font-size: calc(15.5px * var(--fs));
      line-height: 1.85;
      letter-spacing: .05em;
      color: #ddd0b6;
      min-height: 29px;
      padding-right: 132px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, .8);
    }

    .coach-tip {
      position: absolute;
      right: 22px;
      bottom: 10px;
      font-size: calc(10px * var(--fs));
      letter-spacing: .24em;
      color: #9c8760;
      animation: tipBlink 1.6s ease-in-out infinite;
    }

    @keyframes tipBlink {

      0%,
      100% {
        opacity: .35;
        transform: translateY(0);
      }

      50% {
        opacity: 1;
        transform: translateY(2px);
      }
    }

    .spot {
      position: fixed;
      z-index: 55;
      pointer-events: none;
      border: 2px solid rgba(246, 232, 198, .95);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .55), 0 0 40px rgba(232, 211, 162, .7), inset 0 0 34px rgba(232, 211, 162, .2);
      border-radius: 6px;
      opacity: 0;
      transition: opacity .35s, box-shadow .35s;
    }

    .spot.strong {
      box-shadow: 0 0 0 9999px rgba(3, 2, 1, .56), 0 0 0 1px rgba(0, 0, 0, .6),
        0 0 46px rgba(232, 211, 162, .8), inset 0 0 40px rgba(232, 211, 162, .22);
    }

    .spot.on {
      animation: spotPulse 1.9s ease-in-out infinite;
    }

    @keyframes spotPulse {

      0%,
      100% {
        box-shadow: 0 0 0 1px rgba(0, 0, 0, .5), 0 0 22px rgba(232, 211, 162, .35), inset 0 0 20px rgba(232, 211, 162, .1);
      }

      50% {
        box-shadow: 0 0 0 1px rgba(0, 0, 0, .5), 0 0 44px rgba(232, 211, 162, .7), inset 0 0 34px rgba(232, 211, 162, .22);
      }
    }

    .spot.on {
      opacity: 1;
    }

    /* 开场 */
    .title-screen {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      background:
        radial-gradient(circle at 50% 42%, rgba(90, 66, 26, .35), transparent 55%),
        linear-gradient(#0a0705, #050403);
      transition: opacity .8s, visibility .8s;
    }

    .title-screen.hide {
      opacity: 0;
      visibility: hidden;
    }

    .ts-mark {
      width: 84px;
      height: 84px;
      border: 1px solid var(--brass-d);
      transform: rotate(45deg);
      display: grid;
      place-items: center;
      box-shadow: 0 0 40px rgba(176, 141, 79, .25), inset 0 0 30px rgba(176, 141, 79, .15);
    }

    .ts-mark span {
      transform: rotate(-45deg);
      font-family: var(--font-d);
      font-size: calc(30px * var(--fs));
      color: var(--brass-l);
    }

    .ts-title {
      font-family: var(--font-d);
      font-size: clamp(30px, 4.4vw, 52px);
      letter-spacing: .3em;
      color: var(--brass-l);
      text-shadow: 0 0 50px rgba(176, 141, 79, .45);
      text-align: center;
    }

    .ts-sub {
      font-size: calc(12px * var(--fs));
      letter-spacing: .5em;
      color: #b39d74;
      text-align: center;
      line-height: 2.1;
      text-shadow: 0 0 24px rgba(176, 141, 79, .35);
    }

    .ts-rule {
      width: 260px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(176, 141, 79, .8), transparent);
      position: relative;
      margin: 2px 0 4px;
    }

    .ts-rule::after {
      content: '✦';
      position: absolute;
      left: 50%;
      top: -9px;
      transform: translateX(-50%);
      font-size: calc(10px * var(--fs));
      color: var(--brass);
      background: #070503;
      padding: 0 8px;
    }

    .ts-btn {
      margin-top: 8px;
      padding: 14px 54px;
      font-size: calc(15px * var(--fs));
      letter-spacing: .4em;
      color: #241a0c;
      background: linear-gradient(168deg, #f2e0b4, #cbaa6a 45%, #a4823f);
      border: 1px solid #f8ecd0;
      box-shadow: 0 12px 34px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .5);
      transition: .3s;
    }

    .ts-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 44px rgba(176, 141, 79, .45), inset 0 1px 0 rgba(255, 255, 255, .6);
    }

    .ts-pick {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .ts-pick.on {
      display: flex;
    }

    .tp-head {
      font-family: var(--font-d);
      font-size: calc(14px * var(--fs));
      letter-spacing: .28em;
      color: var(--brass-l);
      text-align: center;
    }

    .tp-head em {
      display: block;
      font-style: normal;
      font-size: calc(10px * var(--fs));
      letter-spacing: .2em;
      color: #a58f68;
      margin-top: 8px;
    }

    .tp-row {
      display: flex;
      gap: 28px;
      perspective: 1600px;
    }

    /* 明牌：与手牌同一套纸面语言 */
    .tp-card {
      position: relative;
      width: 208px;
      height: 294px;
      padding: 0;
      border: 0;
      background: none;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      transform: translateY(var(--ty, 0px)) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(var(--sc, 1));
      transition: transform .4s cubic-bezier(.2, .8, .3, 1);
      transform-style: preserve-3d;
      animation: dealIn .75s cubic-bezier(.2, .9, .25, 1.05) backwards;
    }

    .tp-card:nth-child(1) {
      animation-delay: .04s;
    }

    .tp-card:nth-child(2) {
      animation-delay: .14s;
    }

  <script>
    'use strict';

    /* ==================================================================
       0. 工具
    ================================================================== */
    const $ = s => document.querySelector(s);
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const pick = a => a[Math.floor(Math.random() * a.length)];
    const signed = n => (n > 0 ? '+' : '') + n.toFixed(1).replace('-', '−');
    /* 月末 / 假期的数字：一位够就一位，不够就两位（−0.45 不会被抹成 −0.5） */
    const signedV = n => {
      const a = Math.abs(n);
      const txt = Math.abs(a * 10 - Math.round(a * 10)) < 1e-9 ? a.toFixed(1) : a.toFixed(2);

    /* ==================================================================
