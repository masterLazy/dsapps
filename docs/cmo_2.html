        lines.push({ cls: 'fl-line gain', html: `<span class="g">✚</span><span class="n">健康</span><span class="v">+1.5</span>` });

    /* 刷新正好落在结算途中：只把没应用的那一步补上，然后照常翻篇 */
    async function resumeSettle() {
      const p = G.pend || {};
      if (!p.applied && p.deltas) applyDeltas(p.deltas);
      let last = false;
      if (p.comp && !p.appliedComp) {
        const c = COMPS.find(x => x.id === p.comp);
        if (c) {
          const ev = compEval(c, true);
          const win = (typeof p.win === 'boolean') ? p.win : (Math.random() < ev.ch);
          settleComp(c, win, ev);
          last = c.idx === COMPS.length - 1;
        }
      }
      G.pend = null;
      G.stage = 'intro';
      advanceTime();
      saveGame();
      busy = false;
      if (G.will <= 0 || G.hp <= 0) return gameOver();
      if (last) return epilogue();
      renderBoard();
      await sleep(240);
      beginMonth();
    }

    async function beginMonth() {
      if (G.year > 4) return epilogue();
      if (G.year === 4 && G.month >= 8 && G.pass < COMPS.length && !canStillComp()) return epilogue();
      if (G.skillYear !== G.year) { G.skills = {}; G.skillYear = G.year; }
      if (G.month === 9) G.holidayUsed = [];   // 新学年，假期牌重新洗

      /* 存档里记着本月走到哪一步：刷新回来只补没走完的那段 */
      const st = G.stage || 'intro';
      if (st === 'hand') { saveGame(); return startHand(true); }

      setMode('adv');
      if (st === 'intro') {
        G.stage = 'intro';
        saveGame();
        /* 上课钟：九月开学一声，跨年的一月再一声 */
        if (G.month === 9) EXT_SFX.play('chime', { vol: 1.06, rate: 0.95 });
        else if (G.month === 1 && G.year > 1) EXT_SFX.play('chime');
        await playScript(introLines());
        if (G.month === 7 || G.month === 8) return holidayFlow();
        G.stage = 'rescue';
        saveGame();
        await maybeRescue();
        G.stage = 'event';
        saveGame();
      } else if (st === 'rescue') {
        /* 月初旁白已播，救援还没做 */
        await maybeRescue();
        G.stage = 'event';
        saveGame();
      }
      /* st === 'event'：只补月度事件，不重抽、不重播旁白；已经结算过的月份直接跳过 */
      if (st === 'event' && G.evtDone === G.year * 12 + G.month) {
        /* 本月事件已生效 */
      } else {
        await monthlyEvent();
      }
      G.evtPick = null;
      G.stage = 'hand';
      saveGame();
      startHand();
    }

    /* 本月可用的教练技能 → 一张免费手牌 */
    function coachCard() {
      const avail = SKILLS.filter(x => !G.skills[x.id]);
      if (!avail.length) return null;
      const s2 = pick(avail);
      G.coachSkill = s2.id;
      return makeCoachCard(s2);
    }

    /* 教练牌不在牌表里，刷新后按技能 id 原样重建 */
    function makeCoachCard(s2) {
      return {
        id: 'coach_' + s2.id + '_' + G.year + '_' + G.month,
        coach: s2.id,
        t: s2.n,
        m: 'coach',
        tier: 1,
        dur: 'half',
        cost: 0,
        pre: [],
        ar: '→',
        kind: 'm',
        e: {},
        b: s2.d,
        f: '「这一次，只教他一个人。」'
      };
    }

    function startHand(resume) {
      /* 刷新回到本月：日历、精力、手牌都在存档里，只把桌面摆回去，不再发牌 */
      if (resume && hand.length) {
        selected = [];
        setMode('hand');
        hand = hand.filter(Boolean);
        handEl.innerHTML = '';
        hand.forEach(c => {
          const w = cardEl(c);
          w.classList.add('carried');
          handEl.appendChild(w);
        });
        layoutHand();
        renderBoard(false);
        renderDeckMeta();
        syncButtons();
        renderMatch();
        toast(`继续本月 · 已排 ${calUsed()}/${MONTH_UNITS} 格 · 精力 ${G.energy}`);
        return;
      }
      G.played = 0;
      G.restPlayed = false;
      G.energy = ENERGY_MAX;
      G.review = false;
      G.cal = newCal();
      // 事件占用的时间槽：从月初开始占，和后面排的课接在一起，时间条上不留空洞
      if (G.slotCut > 0) {
        let left = G.slotCut;
        for (let i = 0; i < 4 && left > 0; i++) {
          const take = Math.min(SEG_UNITS, left);
          G.cal[i].used = take;
          for (let k = 0; k < take; k++) G.cal[i].cells[k] = '校外';
          G.cal[i].items.push({ t: '校外事务' });
          left -= take;
        }
        G.slotCut = 0;
      }
      selected = [];
      setMode('hand');

      // 上月没读完的书，留在桌上，接着读
      hand = hand.filter(Boolean);

      // 先把「上个月留在桌上」的牌记下来：这些是旧牌，一会儿先落桌
      const carried = hand.slice();

      if (G.notesPending) {
        G.notesPending = false;
        if (!pullToHand('notes')) {
          G.attrs.gen = clamp(G.attrs.gen + 0.12, 0, 10);
          toast('错题本已精读 · 综合 +0.1');
        }
      }
      while (hand.length < HAND_SIZE) {
        const c = drawCard();
        if (!c) break;
        hand.push(c);
      }
      while (hand.length > HAND_CAP) deck.unshift(hand.pop());
      ensureRest();

      // 每月一张教练亲授牌，永远排在最前（上月未打的作废）
      hand = hand.filter(c => !c.coach);
      G.coachSkill = null;
      const cc = coachCard();
      if (cc) {
        if (hand.length >= HAND_CAP) deck.unshift(hand.pop());
        hand.unshift(cc);
      }

      /* ---------- 摆牌：旧牌先扇开，新牌随后从上方落进来 ---------- */
      const isCarried = c => carried.indexOf(c) >= 0;
      handEl.innerHTML = '';
      const freshWraps = [];
      let keptN = 0;
      hand.forEach(c => {
        const w = cardEl(c);
        if (isCarried(c)) {
          w.classList.add('carried');
          keptN++;
        } else {
          w.classList.add('fresh');
          w.style.opacity = '0';
          freshWraps.push(w);
        }
        handEl.appendChild(w);
      });
      layoutHand();

      const keptWraps = Array.from(handEl.children).filter(w => w.classList.contains('carried'));

      if (!keptN) {
        /* 首月 / 全新的一手：还是从牌库一张张发 */
        freshWraps.forEach(w => { w.style.opacity = ''; });
        animateDeal(0);
      } else {
        // 发牌期间先锁住手牌区，免得点到还没落定的牌
        handEl.style.pointerEvents = 'none';

        // 1) 旧牌：和开场发牌同一套动作，从牌库一路扇开
        keptWraps.forEach((w, i) => {
          dealWrap(w, i);
          setTimeout(() => SFX.deal(), i * 70);
        });

        // 2) 新牌：等旧牌坐定，再从牌位上方轻轻落进空位
        const holdOn = 480 + (keptWraps.length - 1) * 70 + 150;
        setTimeout(() => {
          freshWraps.forEach((w, i) => {
            w.style.opacity = '';
            dropWrap(w, i);
            setTimeout(() => SFX.deal(), i * 70);
          });
        }, holdOn);
        setTimeout(() => { handEl.style.pointerEvents = ''; }, holdOn + DROP_DUR + 120 + freshWraps.length * 70);
      }

      if (keptN && !G.tutorial) toast(`桌上还留着上月的 ${keptN} 张`);

      renderBoard();
      renderDeckMeta();
      syncButtons();
      G.stage = 'hand';
      saveGame();
    }

    /* 新牌：从牌位上方一点落进来，落地只轻轻一顿 */
    const DROP_DUR = 380;
    function dropWrap(w, i) {
      const tx = w.style.getPropertyValue('--tx');
      const ty = w.style.getPropertyValue('--ty');
      const rot = w.style.getPropertyValue('--rot');
      const base = `translate3d(${tx}, ${ty}, 0) rotate(${rot})`;
      const from = -(62 + i * 6);        // 略上方，不再从屏幕外飞进来
      w.animate([
        { transform: `${base} translateY(${from}px) rotate(-2.2deg)`, opacity: 0 },
        { transform: `${base} translateY(0) rotate(-1deg)`, opacity: 1, offset: .62 },
        { transform: `${base} translateY(4px) rotate(.4deg)`, opacity: 1, offset: .84 },
        { transform: base, opacity: 1 }
      ], { duration: DROP_DUR, delay: i * 70, easing: 'cubic-bezier(.22,.72,.28,1)', fill: 'backwards' });
    }

    /* 把某张指定的牌从牌库（或弃牌堆）提到手上，不复制 */
    function pullToHand(id) {
      if (hand.some(c => c.id === id)) return true;
      let i = deck.findIndex(c => c.id === id);
      if (i >= 0) { hand.push(deck.splice(i, 1)[0]); return true; }
      i = discard.findIndex(c => c.id === id);
      if (i >= 0) { hand.push(discard.splice(i, 1)[0]); return true; }
      return false;
    }

    /* 只从牌库（必要时洗弃牌堆）取养息牌，绝不从原始牌表凭空造牌 */
    function ensureRest() {
      if (hand.some(c => c.m === 'rest')) return;
      let i = deck.findIndex(c => c.m === 'rest' && c.dur !== 'month');
      if (i < 0 && discard.length) {
        deck = deck.concat(discard.splice(0).sort(() => Math.random() - 0.5));
        i = deck.findIndex(c => c.m === 'rest' && c.dur !== 'month');
      }
      if (i < 0) return;
      const c = deck.splice(i, 1)[0];
      if (hand.length >= HAND_SIZE) {
        let j = hand.findIndex(h => h.m !== 'rest' && selected.indexOf(h) < 0);
        if (j < 0) j = hand.length - 1;
        deck.unshift(hand.splice(j, 1)[0]);
      }
      hand.push(c);
    }

    async function endMonth(auto) {
      if (busy || G.mode !== 'hand') return;
      if (!auto && (TUT.lock === 'all' || TUT.lock === 'select' || TUT.lock === 'play')) return;
      busy = true;
      clearHint();
      if (G.tutorial) G.tutorial = false;
      fire('end');
      EXT_SFX.play('paper');

      const used = calUsed();
      const heavy = used >= 7 ? 'heavy' : used >= 4 ? 'normal' : 'light';
      const summary = scheduleSummary();
      const before = { will: G.will, hp: G.hp, rel: G.rel, inten: G.intensity };
      const cardN = G.played;

      await collectHand();
      selected = [];
      handEl.innerHTML = '';

      // ---- 1. 排课档位：按已用格数一次性跳变，不再涓流 ----
      const LOAD_JUMP = {
        heavy: { hp: -0.8, will: -0.45 },
        normal: { hp: -0.4, will: -0.2 },
        light: { hp: 0.3, will: 0.1 }
      };
      const jump = LOAD_JUMP[heavy];
      const hpTierBefore = hpTierOf();
      const goodHeal = hpTierBefore === 'good' ? 0.2 : 0;   // 健康良好：月末自然回升

      // ---- 1.2 月强度漂移：只影响下个月的出牌收益 ----
      const target = loadTarget();
      G.intensity = clamp(G.intensity * 0.7 + target * 0.3, 1, 10);
      G.monthLoad = [];

      // ---- 1.5 透支的债，按月扣健康 ----
      let h3 = 0, debtBefore = G.debt;
      if (G.debt > 0.05) {
        h3 = -0.24 * G.debt;
        G.debt = Math.max(0, G.debt * 0.5 - 0.1);
      }

      // ---- 1.6 师生：只看本月有没有打过养息牌 ----
      const restDone = !!G.restPlayed;
      const r1 = restDone ? 0.35 : -0.3;

      // ---- 2. 月度事件已在月初盲选，这里不再抽 ----
      const deltas = { will: jump.will, hp: jump.hp + goodHeal + h3, rel: r1 };
      /* 结算先落盘：本月结果一旦定下就固定住，刷新回来只补应用，不重算 */
      const compNow = compThisMonth();
      G.stage = 'settling';
      G.pend = { applied: false, deltas };
      saveGame();

      const real = applyDeltas(deltas);
      /* 比赛胜负也在此刻定死，写进存档，避免刷新后重掷 */
      const compWin = compNow ? (Math.random() < compEval(compNow, true).ch) : null;
      G.pend = { applied: true, comp: compNow ? compNow.id : null, win: compWin };
      saveGame();
      renderBoard();

      // ---- 2.5 结算：只用飘字说清楚 ----
      const heavyWord = { heavy: '重', normal: '中', light: '轻' }[heavy];
      const lines = [
        { cls: 'fl-event', html: '月 末 结 算' },
        { cls: 'fl-meta', html: `排课 <b>${used}</b>/${MONTH_UNITS} 格 · ${heavyWord}排月` },
        { cls: 'fl-meta', html: restDone ? '本月有养息 · 关系回暖' : '整月硬撑 · 关系变冷' }
      ];
      if (goodHeal) lines.push({ cls: 'fl-meta', html: '健康良好 · 自然回升 <b>+0.2</b>' });
      if (h3) lines.push({ cls: 'fl-meta', html: `透支 欠 <b>${debtBefore.toFixed(1)}</b> · 健康 ${signed2(h3)}` });
      ATTRS.concat(['will', 'hp', 'rel']).forEach(k => {
        const v = real[k] || 0;
        if (Math.abs(v) < 0.05) return;
        const isAttr = ATTRS.includes(k);
        lines.push({
          cls: 'fl-line ' + (v > 0 ? 'gain' : 'loss'),
          html: `<span class="g">${isAttr ? MODS[k].g : ({ will: '❖', hp: '✚', rel: '✧' })[k]}</span><span class="n">${isAttr ? ATTR_NAME[k] : ({ will: '意志', hp: '健康', rel: '师生' })[k]}</span><span class="v">${isAttr ? attrDeltaText(k, v) : signedV(v)}</span>`
        });
      });
      floatResult(lines);
      flashKeys(real);
      if (G.will > 5 && G.hp > 5) SFX.good(); else SFX.bad();

      G.relMin = Math.min(G.relMin, G.rel);
      // 冷战：连续两个月师生 ≥ 4 才解除
      if (G.cold > 0) {
        const need = (G.rescue && G.rescue.missed >= 2) ? 5 : 4;
        if (G.rel >= need) G.coldGood++; else G.coldGood = 0;
        if (G.coldGood >= 2) {
          G.cold = 0; G.coldGood = 0;
          toast('冷战结束 · 他主动来问了一道题');
        } else {
          G.cold--;
          if (G.cold <= 0) G.cold = 1;   // 未和解，继续
        }
      } else if (G.rel <= 0) {
        G.cold = 3; G.coldGood = 0;
        toast('师生关系破裂 · 进入冷战，收益减半');
      }
      if (G.will <= 0 || G.hp <= 0) { await sleep(700); return gameOver(); }

      await sleep(2800);

      // ---- 3. 时间锚点旁白 ----
      const tail = { heavy: '这个月，他瘦了一圈。', normal: '日子过得平稳，草稿纸用掉了半本。', light: '他难得睡了几个好觉。' }[heavy];
      await playScript([
        { s: '旁白', t: `${summary}。${tail}` },
        { s: '旁白', t: `第 ${G.year} 年 · ${G.month} 月，翻篇。` }
      ]);

      // ---- 4. 月末比赛 ----
      G.lastWin = false;
      const comp = compNow;
      if (comp) {
        await runComp(comp, compWin);
        if (!G.active) return;
        if (comp.idx === COMPS.length - 1) return epilogue();
      }

      advanceTime();
      G.stage = 'intro';
      G.pend = null;
      saveGame();
      renderBoard();
      busy = false;
      await sleep(160);
      beginMonth();
    }

    function advanceTime() {
      G.month++;
      if (G.month > 12) { G.month = 1; G.year++; }
    }

    /* ==================================================================
       14. 比赛
    ================================================================== */
    /* 一场比赛的数值结算：单独拎出来，月末存档恢复时可以只补这一步 */
    function settleComp(c, win, ev) {
      G.lastWin = win;
      if (win) {
        G.pass = Math.max(G.pass, c.idx + 1);
        G.done[c.id] = true;
        delete G.sched[c.id];
        G.will = clamp(G.will + 0.9, 0, 10);
        G.rel = clamp(G.rel + 0.55, 0, 10);
        G.log.push({ t: `${c.n} · 通过`, k: 'win' });
        SFX.win();
        burst();
        floatResult([
          { cls: 'fl-big gain', html: '捷 报' },
          { cls: 'fl-event', html: `${c.n} · 通过` },
          { cls: 'fl-line gain', html: `<span class="g">❖</span><span class="n">意志</span><span class="v">+0.9</span>` },
          { cls: 'fl-line gain', html: `<span class="g">✧</span><span class="n">师生</span><span class="v">+0.55</span>` }
        ]);
      } else {
        G.done[c.id] = false;
        G.sched[c.id] = { y: G.year + 1, mo: c.mo };
        G.will = clamp(G.will - 0.8, 0, 10);
        G.rel = clamp(G.rel - 0.35, 0, 10);
        G.log.push({ t: `${c.n} · 落榜`, k: 'lose' });
        // 失败也是学习：未达标的每一科，按「差多少」补回一点
        let worst = null;
        Object.keys(c.req).forEach(k => {
          const g = c.req[k] - G.attrs[k];
          if (!worst || g > worst.g) worst = { k, g };
        });
        const lines = [
          { cls: 'fl-big loss', html: '折 戟' },
          { cls: 'fl-event', html: `${c.n} · 落榜` },
          { cls: 'fl-line loss', html: `<span class="g">❖</span><span class="n">意志</span><span class="v">−0.8</span>` },
          { cls: 'fl-line loss', html: `<span class="g">✧</span><span class="n">师生</span><span class="v">−0.35</span>` }
        ];
        const fix = (ev && ev.missing && ev.missing.length) ? ev.missing.map(m => m.k) : (worst && worst.g > 0.05 ? [worst.k] : []);
        fix.forEach(k => {
          const add = 0.2;
          G.attrs[k] = clamp(G.attrs[k] + add, 0, 10);
          G.log.push({ t: `复盘 · ${ATTR_NAME[k]} +${add.toFixed(1)}`, k: 'win' });
          lines.push({ cls: 'fl-line gain', html: `<span class="g">${MODS[k].g}</span><span class="n">${ATTR_NAME[k]}·复盘</span><span class="v">+${add.toFixed(1)}</span>` });
        });
        if (fix.length) {
          G.notesPending = true;
          lines.push({ cls: 'fl-event', html: '错题本会在下个月回到桌上' });
        }
        lines.push({ cls: 'fl-event', html: '明年同一时候，可以再来一次' });
        SFX.bad();
        floatResult(lines);
      }
      if (c.idx === COMPS.length - 1) {
        G.imoResult = win ? ((ev && ev.ch >= 0.80) ? 'gold' : (ev && ev.ch >= 0.62) ? 'silver' : 'bronze') : 'none';
        if (win) G.log.push({ t: `IMO · ${G.imoResult === 'gold' ? '金牌' : G.imoResult === 'silver' ? '银牌' : '铜牌'}`, k: 'win' });
      }
      renderBoard();
      /* 记下这一场已经结过，刷新回来不再重算 */
      if (G.stage === 'settling' && G.pend) { G.pend.appliedComp = true; saveGame(); }
    }

    async function runComp(c, forcedWin) {
      const ev = compEval(c, true);
      const win = (typeof forcedWin === 'boolean') ? forcedWin : (Math.random() < ev.ch);
      G.review = false;
      busy = true;

      await playScript([
        { s: '旁白', t: `${c.n}。${c.desc}` },
        { s: '旁白', t: '你站在考场外，隔着一层玻璃看他。笔尖划过纸面的声音，你听不见，却好像听得见。' }
      ]);

      await sleep(240);
      G.planBuff = 0;
      settleComp(c, win, ev);
      await sleep(1800);

      await playScript(win ? [
        { s: '旁白', t: '他走出考场，先是愣了一下，然后朝你跑过来，眼睛亮得吓人。' },
        { s: 'cmo_UwU', t: '「教练！最后一题我做出来了！我真的做出来了！」' },
        { s: '教练', t: '「我知道。你一直都可以。」' }
      ] : [
        { s: '旁白', t: '他走出来的时候，脚步很慢。看到你，勉强笑了一下。' },
        { s: 'cmo_UwU', t: '「最后一道……我差一点点。就差一点点。」' },
        { s: '教练', t: '「把那张草稿纸留着。明年我们再看它。」' }
      ]);

      busy = false;
      if (G.will <= 0 || G.hp <= 0) return gameOver();
    }

    /* ==================================================================
       15. 结束
    ================================================================== */
    function showRestart(label) {
      if ($('#btn-restart')) return;
      const b = document.createElement('button');
      b.id = 'btn-restart';
      b.className = 'btn btn-gold';
      b.textContent = label || '重 新 执 教';
      b.style.cssText = 'position:absolute;right:26px;bottom:18px;z-index:5;';
      b.onclick = () => location.reload();
      $('#adv-box').appendChild(b);
    }

    function clearSave() {
      try { localStorage.removeItem('cmo_save_v1'); } catch (e) { }
    }

    function askChoice(opts) {
      return new Promise(res => {
        const wrap = document.createElement('div');
        wrap.className = 'choices';
        opts.forEach(o => {
          const b = document.createElement('button');
          b.className = 'choice-btn';
          b.innerHTML = `<b>${o.t}</b><span>${o.d}</span>`;
          b.onclick = ev => { ev.stopPropagation(); wrap.remove(); res(o.k); };
          wrap.appendChild(b);
        });
        $('#adv-box').appendChild(wrap);
        $('#adv-next').classList.remove('show');
      });
    }

    async function gameOver() {
      if (!G.active) return;
      G.active = false;
      busy = true;
      clearHint();
      clearSave();
      const sick = G.hp <= 0;
      await playScript(sick ? [
        { s: '旁白', t: '他在书桌前倒下了。医生说，是长期熬夜加上营养不良。' },
        { s: '旁白', t: '病房里很安静，窗外正下着雨。那本没做完的小蓝本，摊在床头。' },
        { s: 'cmo_UwU', t: '「教练……对不起。我好像，走不到那么远了。」' }
      ] : [
        { s: '旁白', t: '他把笔放下，很久没有说话。然后抬起头，眼神是空的。' },
        { s: 'cmo_UwU', t: '「教练，我不想做了。真的，一点都不想了。」' },
        { s: '旁白', t: '你想说点什么，可所有的道理，在这一刻都轻得像纸。' }
      ]);
      floatResult([
        { cls: 'fl-big loss', html: sick ? '灯 熄 了' : '心 火 灭 了' },
        { cls: 'fl-event', html: `第 ${G.year} 年 · ${G.month} 月 · 四年在此中断` }
      ]);
      await sleep(900);
      setSpeaker('旁白');
      $('#adv-text').innerHTML = `<span class="narr">失败也是故事的一部分。但这一次，你本可以让他多睡一会儿。</span>`;
      showRestart('再 来 一 次');
    }

    function endingOf() {
      const imo = G.imoResult;
      if (imo === 'gold') return { title: '传 奇 教 练', sub: 'IMO 金牌 · 名字进了校史馆', tone: 'gain' };
      if (imo === 'silver') return { title: '国 手 之 师', sub: 'IMO 银牌 · 国家队主力', tone: 'gain' };
      if (imo === 'bronze') return { title: '世 界 的 屋 顶', sub: 'IMO 铜牌 · 他真的站上了那里', tone: 'gain' };
      if (imo === 'none') return { title: '差 一 步', sub: 'IMO 未获奖 · 但他去过那个赛场', tone: 'gain' };
      if (G.pass >= 6) return { title: '省 队 教 头', sub: '止步集训队 · 保送数学系', tone: 'gain' };
      if (G.pass >= 4) return { title: '四 年 一 梦', sub: '省一 · 高考进了数学系', tone: 'gain' };
      return { title: '平 凡 的 四 年', sub: '没能走到最后 · 但那排书都翻烂了', tone: 'gain' };
    }

    async function epilogue() {
      if (G.epilogued) return;
      G.epilogued = true;
      G.active = false;
      busy = true;
      clearHint();
      setMode('adv');

      const imo = G.imoResult;
      if (imo) {
        await playScript([
          { s: '旁白', t: 'IMO 的赛程结束了，他背着那个旧书包回到学校，晒黑了一圈。' },
          { s: '旁白', t: '办公室的桌上堆着四年的草稿纸，从地面一直摞到窗台。' },
          { s: 'cmo_UwU', t: '「教练，我把这四年的本子都带来了。您要不要看看？」' }
        ]);
      } else {
        await playScript([
          { s: '旁白', t: '这一年的赛场，最终没有他的名字。' },
          { s: '旁白', t: '他坐在办公室里，把四年的草稿纸一张张理好，摞成整齐的一叠。' },
          { s: 'cmo_UwU', t: '「教练，我是不是……让您失望了？」' }
        ]);
      }

      await playScript([{ s: '旁白', t: '最后一件事，要他自己定。' }]);
      const choice = await askChoice([
        { t: '让他自己选', d: '把志愿表推过去，不再说话', k: 'free' },
        { t: '推他去最好的地方', d: '你替他填了那所学校的名字', k: 'push' },
        { t: '劝他先歇一年', d: '「不着急，人生很长。」', k: 'rest' }
      ]);
      G.log.push({ t: `最后的选择 · ${choice === 'free' ? '让他自己选' : choice === 'push' ? '推他去最好的地方' : '劝他先歇一年'}`, k: 'choice' });

      await playScript(choice === 'free' ? [
        { s: '旁白', t: '他低头写了很久，然后把表折好，放进信封。你没看。' },
        { s: 'cmo_UwU', t: '「教练，我想清楚了。这四年是我自己选的，往后也想自己选。」' }
      ] : choice === 'push' ? [
        { s: '旁白', t: '你把表填好，推回给他。他看了很久，最后什么也没说，签了字。' },
        { s: 'cmo_UwU', t: '「……好。听您的。」' }
      ] : [
        { s: '旁白', t: '他愣了一下，然后笑了，眼睛有点红。' },
        { s: 'cmo_UwU', t: '「教练，您是第一个跟我说这种话的人。」' }
      ]);

      finale();
    }

    async function finale() {
      G.active = false;
      busy = true;
      clearHint();
      const e = endingOf();
      const hidden = G.relMin >= 7.4 && (G.imoResult === 'gold' || G.imoResult === 'silver');
      const imo = G.imoResult;
      if (imo) SFX.win();

      await playScript([
        { s: '旁白', t: '四年后的夏天，机场。他背着一个旧书包，手里攥着录取通知书。' },
        { s: '旁白', t: '你站在送机口，看着那个曾经连话都说不利索的孩子，走向更远的地方。' },
        { s: 'cmo_UwU', t: '「教练，那道题，我用的是您教我的第一个技巧。」' },
        { s: '旁白', t: '窗外的梧桐又绿了一次。你把最后一本小蓝本放回书架，合上了灯。' }
      ]);

      const passed = Object.keys(G.done).filter(k => G.done[k]).length;
      floatResult([
        { cls: 'fl-big ' + e.tone, html: e.title },
        { cls: 'fl-event', html: e.sub },
        { cls: 'fl-event', html: `通过 ${G.pass} / 8 关 · 精读 ${Object.values(G.mastery).filter(v => v >= 3).length} 册 · 教法 ${Object.keys(G.pas).length} 条` }
      ]);
      await sleep(1200);

      // 结局回顾
      const logs = G.log.slice(-8);
      const list = logs.map(l => `<li class="rv-${l.k}">${esc(l.t)}</li>`).join('');
      setSpeaker('旁白');
      $('#adv-text').innerHTML = `<div class="review"><h5>四 年 回 顾</h5><ul>${list || '<li>没有留下什么记录。</li>'}</ul>
        <p class="rv-tail">${hidden ? '许多年后，他也站到了黑板前。第一句话是：「我们先看一个简单的例子。」' : (imo ? '不是每个故事都有金牌，但每个认真走过的四年，都算数。' : '有些路没走到终点，可路上的每一张草稿纸，都还留着。')}</p></div>`;
      showRestart(hidden ? '再 教 一 届' : '再 教 一 届');
      clearSave();
    }

    /* ==================================================================
       16. 新手教程
       —— 一句一停，点一下才走；没轮到玩家时，手牌与按钮全部锁死
    ================================================================== */
    const TUT = { on: false, skip: false, lock: 'none', waiter: null, started: false };
    let tutSkipRes = null;
    const tutSkipSignal = new Promise(r => { tutSkipRes = r; });

      TUT.lock = mode;
      document.body.dataset.tutLock = mode;
      document.body.classList.toggle('tut-lock', mode !== 'none');
      syncButtons();
    }

      const list = Array.from(handEl.children);
      if (!list.length) return '#hand';
      return list[clamp(i, 0, list.length - 1)];
    }

      return typeof st.spot === 'function' ? st.spot() : st.spot;
    }

    async function tutorial() {
      TUT.on = true;

      G.tutorial = true;
      $('#btn-skip').classList.add('on');
      tutLock('all');
      $('#coach').classList.remove('on');

      for (const st of tutScript()) {
        if (!TUT.on) break;
        if (st.k === 'adv') {
          await Promise.race([playScript([st]), tutSkipSignal]);
        } else if (st.k === 'hand') {
          startHand();
          TUT.started = true;
          await sleep(1000);
          $('.board-wrap').classList.add('lift');
        } else if (st.k === 'say') {
          tutLock('all');
          await coachStep(st.t, tutSpot(st), st.s, st.tip);
        } else if (st.k === 'act') {
          await coachAct(st.t, tutSpot(st), st.gate, st.lock, st.tip);
        }
      }

      TUT.on = false;
      TUT.waiter = null;
      tutLock('none');
      clearHint();
      $('#coach').classList.remove('on');
      $('#btn-skip').classList.remove('on');
      return TUT.started;

    function renderManualPage() {
      if (!manualEl) return;
      const m = MANUAL[mnCur];
      const main = manualEl.querySelector('#mn-main');
      main.innerHTML = `<div class="mn-h">${m.n}</div><div class="mn-lead">${m.lead}</div>${m.html}`;
      main.scrollTop = 0;
    }

    function onManualKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); closeManual(); return; }
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        mnCur = clamp(mnCur + (e.key === 'ArrowDown' ? 1 : -1), 0, MANUAL.length - 1);
        manualEl.querySelectorAll('#mn-nav button').forEach((x, i) => x.classList.toggle('on', i === mnCur));
        renderManualPage();
      }
    }

    function showManual() {
      if (manualEl) { closeManual(); return; }
      const el = document.createElement('div');
      el.className = 'manual';
      el.innerHTML = `
        <div class="mn-panel">
          <div class="mn-head">
            <h4>教 练 手 册</h4><em>四年一局 · 随时可查</em>
            <button class="mn-close" id="mn-close" title="关闭">✕</button>
          </div>
          <div class="mn-body">
            <nav class="mn-nav" id="mn-nav">
              ${MANUAL.map((m, i) => `<button data-i="${i}" class="${i === mnCur ? 'on' : ''}"><i>${m.ico}</i>${m.n}</button>`).join('')}
              <div class="mn-nav-foot">↑↓ 换页 · Esc 关闭<br>翻手册不会暂停游戏</div>
            </nav>
            <article class="mn-main" id="mn-main"></article>
          </div>
        </div>`;
      document.body.appendChild(el);
      manualEl = el;
      renderManualPage();

      el.querySelector('#mn-nav').addEventListener('click', e => {
        const b = e.target.closest('button[data-i]');
        if (!b) return;
        mnCur = +b.dataset.i;
        el.querySelectorAll('#mn-nav button').forEach(x => x.classList.toggle('on', x === b));
        renderManualPage();
        SFX.tick();
      });
      el.querySelector('#mn-close').addEventListener('click', e => {
        e.stopPropagation();
        closeManual();
      });
      el.addEventListener('click', e => { if (e.target === el) closeManual(); });
      document.addEventListener('keydown', onManualKey);
    }

    function closeManual() {
      if (!manualEl) return;
      document.removeEventListener('keydown', onManualKey);
      const el = manualEl;
      manualEl = null;                 // 先断引用，避免 remove 期间的事件再进来

      if (ADV.typing && ADV.finish) ADV.finish();
      if (COACH.typing && COACH.finish) COACH.finish();
      el.remove();
    }

      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({
          v: SAVE_VER,
          G: {
            year: G.year, month: G.month, will: G.will, hp: G.hp, rel: G.rel,
            attrs: G.attrs, mastery: G.mastery, pass: G.pass, sched: G.sched,
            done: G.done, cold: G.cold, log: G.log, relMin: G.relMin, imoResult: G.imoResult,
            pas: G.pas, profile: G.profile, debt: G.debt, notesPending: G.notesPending,
            intensity: G.intensity, skills: G.skills, skillYear: G.skillYear,
            planBuff: G.planBuff, rescue: G.rescue, evtLast: G.evtLast,
            lastWin: G.lastWin, coldGood: G.coldGood, slotCut: G.slotCut,
            holidayUsed: G.holidayUsed, restPlayed: G.restPlayed,
            /* 月内进度：日历格、精力、已出牌数、复习标记、阶段 */
            cal: G.cal, energy: G.energy, played: G.played, review: G.review,
            monthLoad: G.monthLoad, stage: G.stage,
            holPick: G.holPick, holSel: G.holSel, pend: G.pend,
            evtPick: G.evtPick, evtDone: G.evtDone, coachSkill: G.coachSkill
          },
          deck: deck.map(c => c.id),
          discard: discard.map(c => c.id),
          hand: hand.map(c => c.id)
        }));
      } catch (e) { }
    }

    function loadSave() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return null;
        const d = JSON.parse(raw);
        if (!d || !d.G || !d.G.year) return null;
        return d;
      } catch (e) { return null; }
    }

    function bindEvents() {
      /* 任意点击：先补完打字，再推进下一步教程 */
      document.addEventListener('click', e => {
        /* 点面板外面：收起音量面板 */
        const tgt = e.target;
        const inSnd = tgt && tgt.closest && tgt.closest('.snd-wrap');
        if (!inSnd) { const vp = document.getElementById('vol-pop'); if (vp) vp.classList.remove('on'); }
        /* 手册开着，或刚关掉的那一下：一律不产生任何副作用 */
        if (manualEl || Date.now() < mnGuard) {
          if (Date.now() < mnGuard) e.stopPropagation();
          return;
        }
        if (COACH.typing && COACH.finish) { const f = COACH.finish; f(); return; }
        if (skipPause) { const f = skipPause; skipPause = null; f(); return; }
        if (TUT.waiter) {
          const t = e.target;
          if (t && t.closest && t.closest('.icon-btn, #ui-match, .manual, .card-wrap, .vol-pop')) return;
          const w = TUT.waiter;
          TUT.waiter = null;
          w();
        }
      }, true);

      $('#btn-skip').addEventListener('click', e => {
        e.stopPropagation();
        skipTutorial();
      });

      $('#layer-adv').addEventListener('click', onAdvClick);

      $('#btn-play').addEventListener('click', doPlay);
      $('#btn-end').addEventListener('click', () => endMonth(false));

      $('#ui-match').addEventListener('click', e => {
        const b = e.target.closest('#btn-review');
        if (!b || b.disabled) return;
        e.stopPropagation();
        doReview();
      });

      /* ---------- 音量面板：背景音 / 音效分开调，静音单独一个键 ---------- */
      const volPop = $('#vol-pop');
      const ambRange = $('#vol-range'), sfxRange = $('#sfx-range');
      const paintRange = el => el.style.setProperty('--p', el.value + '%');
      const paintSoundBtn = () => {
        const b = $('#btn-sound');
        b.textContent = soundOn ? '♪' : '✕';
        b.style.color = soundOn ? '' : '#5a4a2e';
      };
      const setSound = on => {
        soundOn = !!on;
        paintSoundBtn();
        SFX.ambience(soundOn);
      };
      const syncVolUI = () => {
        const v = SFX.vol();
        ambRange.value = Math.round(v.amb * 100);
        sfxRange.value = Math.round(v.sfx * 100);
        $('#vol-val').textContent = Math.round(v.amb * 100);
        $('#sfx-val').textContent = Math.round(v.sfx * 100);
        paintRange(ambRange); paintRange(sfxRange);
        $('#vol-mute').textContent = soundOn ? '全 部 静 音' : '恢 复 声 音';
        paintSoundBtn();
      };
      syncVolUI();

      $('#btn-sound').addEventListener('click', e => {
        e.stopPropagation();
        volPop.classList.toggle('on');
        if (volPop.classList.contains('on')) { SFX.resume(); SFX.tick(); }
      });
      volPop.addEventListener('click', e => e.stopPropagation());

      ambRange.addEventListener('input', () => {
        const v = +ambRange.value / 100;
        SFX.setAmbVol(v);
        $('#vol-val').textContent = Math.round(v * 100);
        paintRange(ambRange);
        if (!soundOn) setSound(true);
        else SFX.ambience(true);
      });
      sfxRange.addEventListener('input', () => {
        const v = +sfxRange.value / 100;
        SFX.setSfxVol(v);
        $('#sfx-val').textContent = Math.round(v * 100);
        paintRange(sfxRange);
        if (!soundOn) setSound(true);
        else SFX.tick();
      });
      $('#vol-mute').addEventListener('click', () => {
        setSound(!soundOn);
        $('#vol-mute').textContent = soundOn ? '全 部 静 音' : '恢 复 声 音';
        if (soundOn) SFX.tick();
      });

      $('#btn-help').addEventListener('click', e => {
        e.stopPropagation();
        showManual();
      });

      document.addEventListener('keydown', e => {
        if (TUT.waiter && (e.code === 'Space' || e.code === 'Enter')) {
          e.preventDefault();
          const w = TUT.waiter;
          TUT.waiter = null;
          w();
          return;
        }
        if (G.mode === 'adv' && (e.code === 'Space' || e.code === 'Enter')) {
          e.preventDefault();
          onAdvClick();
          return;
        }
        if (G.mode !== 'hand' || busy) return;
        if (e.key >= '1' && e.key <= '9') {
          const i = parseInt(e.key, 10) - 1;
          if (hand[i]) toggleSelect(hand[i]);
        } else if (e.code === 'Space' && selected.length) {
          e.preventDefault();
          doPlay();
        } else if (e.code === 'Enter') {
          e.preventDefault();
          endMonth(false);
        }
      });

      window.addEventListener('resize', () => {
        layoutHand();
        clearHint();
      });
    }

    function doReview() {
      if (G.mode !== 'hand' || G.review || busy) return;
      if (TUT.lock !== 'none') return;
      if (!compThisMonth()) return;
      const slots = allocUnits(1);
      if (!slots) { toast(`本月只剩 ${calLeft()} 格，排不下复习`); return; }
      if (G.energy < 1) { toast('精力不足'); return; }
      slots.forEach(sl => {
        const seg = G.cal[sl.i];
        for (let k = 0; k < sl.take; k++) seg.cells[seg.used + k] = '复习';
        seg.used += sl.take;
      });
      G.cal[slots[0].i].items.push({ t: '考前复习' });
      G.energy -= 1;
      G.review = true;
      SFX.tick();
      renderBoard();
      renderCalendar();
      renderDeckMeta();
      syncButtons();
      toast('考前复习 · 本月胜算上升');
      saveGame();
      if (calLeft() <= 0) setTimeout(() => endMonth(true), 900);
    }

    function initDust() {
      let html = '';
      for (let i = 0; i < 14; i++) {
        html += `<i style="left:${(Math.random() * 100).toFixed(1)}%;top:${(35 + Math.random() * 65).toFixed(1)}%;--dx:${(Math.random() * 70 - 35).toFixed(0)}px;animation-duration:${(7 + Math.random() * 8).toFixed(1)}s;animation-delay:${(-Math.random() * 12).toFixed(1)}s"></i>`;
      }
      $('#dust').innerHTML = html;
    }

    function renderProfiles() {
      const row = $('#tp-row');
      if (!row) return;
      row.innerHTML = PROFILES.map((p, i) => `
        <button class="tp-card" data-p="${p.id}">
          <div class="tp-face">
            <div class="tp-sigil">${['∑', '△', '◈'][i] || '✦'}</div>
            <div class="tp-top">
              <span class="tp-tag">${p.tag}</span>
              <span class="tp-kind">新 生</span>
            </div>
            <div class="tp-n">${p.n}</div>
            <div class="tp-line">${p.line}</div>
            <div class="tp-bot"><span>就 他 了</span><span class="tp-ar">→</span></div>
          </div>
        </button>`).join('');

      row.querySelectorAll('.tp-card').forEach(card => {
        card.addEventListener('pointermove', e => {
          const r = card.getBoundingClientRect();
          const px = (e.clientX - r.left) / r.width;
          const py = (e.clientY - r.top) / r.height;
          card.style.setProperty('--ry', ((px - .5) * 14).toFixed(2) + 'deg');
          card.style.setProperty('--rx', ((.5 - py) * 12).toFixed(2) + 'deg');
        });
        card.addEventListener('pointerleave', () => {
          ['--ry', '--rx'].forEach(v => card.style.removeProperty(v));
        });
      });
    }

    async function startGame(pid) {
      SFX.resume();
      SFX.ambience(soundOn);
      clearSave();
      $('#title').classList.add('hide');
      await sleep(400);
      const p = PROFILES.find(x => x.id === pid) || PROFILES[2];
      G.profile = p.id;
      G.attrs = Object.assign({}, p.attrs);
      G.will = 6.5; G.hp = 7.6; G.rel = 7;
      G.intensity = 5;
      G.monthLoad = [];
      G.skills = {};
      G.skillYear = 1;
      G.planBuff = 0;
      G.rescue = { used: 0, last: -99, missed: 0 };
      G.evtLast = '';
      G.holidayUsed = [];
      G.slotCut = 0;
      G.lastWin = false;
      G.cold = 0;
      G.coldGood = 0;
      G.pas = {};
      G.debt = 0;
      G.notesPending = false;
      G.year = 1; G.month = 1;
      G.pass = 0; G.sched = {}; G.done = {};
      G.mastery = {}; G.log = []; G.imoResult = null; G.epilogued = false;
      G.stage = 'intro'; G.holPick = null; G.holSel = null; G.pend = null;
      G.evtPick = null; G.evtDone = -1; G.coachSkill = null;
      G.played = 0; G.review = false; G.restPlayed = false; G.monthLoad = [];
      G.cal = newCal(); G.energy = ENERGY_MAX;
      initDeck();
      renderBoard();
      setMode('adv');
      EXT_SFX.play('chime');
      const started = await tutorial();
      if (!started) beginMonth();
    }

    async function resumeGame() {
      const d = loadSave();
      if (!d) return startGame();
      SFX.resume();
      SFX.ambience(soundOn);
      $('#title').classList.add('hide');
      await sleep(400);
      Object.assign(G, d.G);
      G.active = true;
      G.epilogued = false;
      G.tutorial = false;
      /* 月内进度：能恢复的都恢复，刷新不等于重开本月 */
      G.cal = (Array.isArray(d.G.cal) && d.G.cal.length === 4)
        ? d.G.cal.map(s => ({ used: s.used || 0, items: s.items || [], cells: (s.cells || []).concat([null, null]).slice(0, 2) }))
        : newCal();
      G.energy = (typeof d.G.energy === 'number') ? clamp(d.G.energy, 0, ENERGY_MAX) : ENERGY_MAX;
      G.played = d.G.played || 0;
      G.review = !!d.G.review;
      G.monthLoad = Array.isArray(d.G.monthLoad) ? d.G.monthLoad : [];
      G.stage = d.G.stage || 'intro';
      G.holPick = Array.isArray(d.G.holPick) ? d.G.holPick : null;
      G.holSel = (typeof d.G.holSel === 'number') ? d.G.holSel : null;
      G.pend = d.G.pend || null;
      G.evtPick = Array.isArray(d.G.evtPick) ? d.G.evtPick : null;
      G.evtDone = (typeof d.G.evtDone === 'number') ? d.G.evtDone : -1;
      G.coachSkill = G.coachSkill || null;
      const byId = {};
      CARDS.forEach(c => { byId[c.id] = c; });
      deck = (d.deck || []).map(id => byId[id]).filter(Boolean);
      discard = (d.discard || []).map(id => byId[id]).filter(Boolean);
      hand = (d.hand || []).map(id => byId[id]).filter(Boolean);
      /* 教练牌按技能 id 重建：本月还没用过就放回手上 */
      if (G.stage === 'hand' && hand.length && !hand.some(c => c.coach) && G.coachSkill) {
        const sk = SKILLS.find(x => x.id === G.coachSkill);
        if (sk && !(G.skills || {})[sk.id]) hand.unshift(makeCoachCard(sk));
      }
      G.pas = G.pas || {};
      G.profile = G.profile || 'omni';
      G.debt = G.debt || 0;
      G.intensity = G.intensity || 5;
      G.skills = G.skills || {};
      G.skillYear = G.skillYear || G.year;
      G.planBuff = G.planBuff || 0;
      G.rescue = G.rescue || { used: 0, last: -99, missed: 0 };
      G.evtLast = G.evtLast || '';
      G.holidayUsed = G.holidayUsed || [];
      G.restPlayed = !!G.restPlayed;
      G.coldGood = G.coldGood || 0;
      G.slotCut = G.slotCut || 0;
      G.lastWin = !!G.lastWin;
      G.notesPending = !!G.notesPending;
      selected = [];
      renderBoard(false);
      setMode('adv');
      if (G.stage === 'settling') {
        toast('月末结算已记录 · 接着翻篇');
        return resumeSettle();
      }
      if (G.stage === 'hand') {
        toast(`继续本月 · 第 ${G.year} 年 ${G.month} 月 · 已排 ${calUsed()}/${MONTH_UNITS} 格`);
      } else {
        toast(`继续执教 · 第 ${G.year} 年 ${G.month} 月`);
      }
      beginMonth();
    }

    bindEvents();
    initDust();
    renderBoard(false);
    setMode('adv');
    if (loadSave()) {
      const rb = $('#btn-resume');
      rb.style.display = '';
      rb.addEventListener('click', resumeGame);
    }
    renderProfiles();
    $('#btn-start').addEventListener('click', () => {
      const pk = $('#ts-pick');
      if (!pk.classList.contains('on')) {
        pk.classList.add('on');
        $('#title').classList.add('picking');
        $('#btn-start').style.display = 'none';
        const rb = $('#btn-resume');
        if (rb) rb.style.display = 'none';
        SFX.resume();
      }
    });
    $('#tp-row').addEventListener('click', e => {
      const b = e.target.closest('.tp-card');
      if (b) startGame(b.dataset.p);
    });
  </script>
</body>

</html>
